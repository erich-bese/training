/* ================================================================== utils */
const isoWeek = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 86400000 + 1) / 7);
};
/* Year-scoped so week 31 of two different years never collapse into one bar. */
const isoYear = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return t.getUTCFullYear();
};
const weekKey = d => isoYear(d) + "-" + String(isoWeek(d)).padStart(2, "0");
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const parseDay = s => { const p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); };
/* planForDate() ist entfallen — der Wochentag bestimmt nichts mehr. */
const kg = n => {
  const v = Math.round(n * 100) / 100;
  return (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/,"").replace(".", ","));
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const buzz = (ms=8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
const snapTo = (v, step) => Math.max(0, Math.round(v / step) * step);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const dateShort = s => parseDay(s).toLocaleDateString("de-DE", {day:"2-digit", month:"short"});
const dateLong = s => parseDay(s).toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});

/* ================================================================ storage */
const KEY = "training:v3";
const OLD_KEYS = ["training:v2", "training:v1"];
const EMPTY = () => ({
  version:3,
  weights:Object.assign({}, DEFAULT_WEIGHTS),
  cfg:{},                 /* exId -> {perSide, ecc, chain, variant} */
  plans:null,             /* null = use defaults; object = user-edited copy */
  sessions:[],
  active:null,
  makeup:[],              /* queued exercises that fell out of a session */
  rest:null,              /* {endsAt} — a timestamp, so backgrounding cannot stall it */
  form:[],                /* Tagesform pro Tag, auch ohne Training */
  /* Eine Zeile je Nacht: {nacht, schlaf, hrv, puls, atem, basis:{...}}.
     Health liefert immer nur die letzte Nacht; fuer ein Mehr-Naechte-Fenster
     muss die App selbst mitschreiben. Neuere Huellen schicken zusaetzlich
     einen `verlauf` mit — dann ist das Fenster sofort voll statt erst in
     einer Woche. */
  healthLog:[],
  griffNachgetragen:false,/* einmaliges Nachtragen des Haengens in eigene Plaene */
  settings:{bodyweight:80, rest:120, sound:true, plates:[1.25, 2.5, 5], eccMax:10}
});

let S = EMPTY();
let storageOk = true;

function migrate(d){
  if (!d) return null;
  const out = Object.assign(EMPTY(), d);
  out.version = 3;
  out.settings = Object.assign(EMPTY().settings, d.settings || {});
  out.cfg = d.cfg || {};
  out.makeup = Array.isArray(d.makeup) ? d.makeup : [];
  out.form = Array.isArray(d.form) ? d.form : [];
  /* Absteigend, neueste zuerst — jede Auswertung will "die letzten n Naechte".
     Nur Zeilen mit Datum; ohne das laesst sich nichts einordnen. */
  out.healthLog = (Array.isArray(d.healthLog) ? d.healthLog : [])
    .filter(n => n && n.nacht)
    .sort((a, b) => (a.nacht < b.nacht ? 1 : -1))
    .slice(0, 90);
  /* Umbenannte Uebungen. Wer im Verlauf unter altem Namen steht, faellt sonst
     aus der Uebungstabelle: keine Zeichnung, keine Schrittweite — und vor
     allem keine Zuordnung zu einer Muskelgruppe. Die Saetze zaehlen dann fuer
     die Erholungsrechnung schlicht nicht mit. */
  const UMBENANNT = {revfly: "reardelt", squat_light: "squat", dl_light: "deadlift"};
  const neueId = id => UMBENANNT[id] || id;
  /* Wurde die Zieluebung nie trainiert, ist ihr Gewicht nur eine Voreinstellung
     — dann zaehlt der Wert der zusammengefuehrten Uebung. Sonst bleibt der
     echte Wert stehen. */
  const jeTrainiert = id => (d.sessions || []).some(s =>
    (s.entries || []).some(e => e.id === id && (e.reps || []).length));
  ["weights", "cfg"].forEach(feld => {
    Object.keys(UMBENANNT).forEach(alt => {
      const neu = UMBENANNT[alt];
      if (!out[feld] || out[feld][alt] === undefined) return;
      if (out[feld][neu] === undefined || (!jeTrainiert(neu) && jeTrainiert(alt))) {
        out[feld][neu] = out[feld][alt];
      }
      delete out[feld][alt];
    });
  });

  /* Selbst bearbeitete Plaene ebenfalls: sonst zeigt der Plan weiter auf eine
     Uebung, die es unter diesem Namen nicht mehr gibt. */
  if (out.plans) Object.keys(out.plans).forEach(pid => {
    const pl = out.plans[pid];
    if (pl && Array.isArray(pl.ex)) pl.ex.forEach(e => { e.id = neueId(e.id); });
  });

  /* Das Haengen kam nach den ersten Einheiten dazu. Wer seine Plaene schon
     bearbeitet hat, hat eine eigene Kopie — die kennt es nicht, und ohne
     diesen Schritt taucht es nie auf. Genau einmal, an den beiden Drucktagen,
     und nur wenn es dort nicht schon steht: haengt er es selbst wieder raus,
     bleibt es raus. */
  if (out.plans && !out.griffNachgetragen) {
    ["pushA", "pushB"].forEach(pid => {
      const pl = out.plans[pid];
      if (!pl || !Array.isArray(pl.ex)) return;
      if (pl.ex.some(e => e.id === "hang")) return;
      pl.ex.push({id:"hang", sets:3, min:30, max:60});
    });
  }
  out.griffNachgetragen = true;

  out.sessions = (Array.isArray(d.sessions) ? d.sessions : []).map(s => ({
    id: s.id || String(Math.round(Math.random()*1e9)),
    date: s.date, plan: s.plan, type: s.type,
    /* Der Zeitstempel ging bisher bei jedem Laden verloren: er stand im
       Datenmodell, wurde hier aber nicht uebernommen. Danach half nur noch
       die Tagesmitte, und die Reihenfolge innerhalb eines Tages war weg. */
    ts: +s.ts || 0,
    /* Beginn der Einheit. Fehlt er bei Altdaten, rechnet `sessionSpanne()`
       ihn aus Ende und Dauer zurueck. */
    startedAt: +s.startedAt || 0,
    /* Wird die Einheit nicht zeitnah abgeschlossen, laeuft die Uhr weiter.
       Im echten Verlauf standen dadurch 2174 Minuten, also gut 36 Stunden.
       Ueber vier Stunden ist keine Einheit — dann lieber nichts behaupten. */
    minutes: (s.minutes > 0 && s.minutes <= 240) ? s.minutes : 0,
    note: s.note || "",
    /* v2 kannte nur Krafteinheiten — alles Alte ist "lift" */
    kind: s.kind || "lift",
    effort: s.effort == null ? null : +s.effort,
    form: s.form || null,
    entries: (s.entries || []).map(e => ({
      id:neueId(e.id), name:e.name || exName(neueId(e.id)), bw:!!e.bw,
      weight:+e.weight || 0, perSide:!!e.perSide, ecc:+e.ecc || 0, chain:+e.chain || 0,
      variant:e.variant || "", note:e.note || "",
      skipped:e.skipped || null,
      reps:Array.isArray(e.reps) ? e.reps.slice() : []
    }))
  }));
  /* a v1 rest countdown was a plain number of seconds — not restorable, drop it */
  if (typeof out.rest === "number") out.rest = null;
  return out;
}

function load(){
  try {
    localStorage.setItem("training:probe", "1");
    localStorage.removeItem("training:probe");
    let raw = localStorage.getItem(KEY);
    for (let i = 0; !raw && i < OLD_KEYS.length; i++) raw = localStorage.getItem(OLD_KEYS[i]);
    if (raw) S = migrate(JSON.parse(raw)) || EMPTY();
  } catch(e) { storageOk = false; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch(e) { storageOk = false; }
}

/* plans: defaults unless the user edited them */
const plans = () => S.plans || DEFAULT_PLANS;
const planOf = id => plans()[id];
function editablePlans(){
  if (!S.plans) S.plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
  return S.plans;
}
const cfgOf = id => Object.assign({perSide:false, ecc:0, chain:0, variant:""}, S.cfg[id] || {});
function setCfg(id, patch){ S.cfg[id] = Object.assign(cfgOf(id), patch); save(); }
const incOf = id => {
  const c = S.cfg[id];
  if (c && c.inc) return c.inc;
  return (EX[id] || {}).inc || 1;
};
const isBw = id => !!(EX[id] || {}).bw;
/* Pause je Uebung. Eine Zahl fuer alles ist bei Seitheben zu lang und bei
   Kreuzheben zu kurz: schwere Grunduebungen brauchen das Nervensystem
   zurueck, Isolation nur den Muskel. Die Einstellung bleibt als Rueckfall
   und als Regler fuer alles, was keine eigene Angabe hat. */
const restFor = id => (EX[id] || {}).rest || S.settings.rest || 120;

/* --- Aufwaermsaetze ----------------------------------------------
   Bisher wurden sie bewusst gar nicht erfasst. Das war richtig, solange es
   nur um die Erfassung ging — sie gehoeren nicht ins Volumen, sonst zaehlt
   ein Satz mit 30 kg wie einer mit 76. Es hiess aber auch, dass niemand
   sagt, *wie* aufgewaermt wird, und genau das hat gefehlt.

   Drei Stufen auf 40, 60 und 80 Prozent des Arbeitsgewichts, mit
   absteigender Wiederholungszahl: aufwaermen soll die Bewegung bahnen und
   nicht ermueden. Nur bei den schweren Grundübungen — die tragen ohnehin
   schon die volle Pause von 180 Sekunden, und das ist genau dieselbe
   Auswahl. Bei Isolationsuebungen waere es Zeitverschwendung.

   Die Saetze werden nicht gespeichert und zaehlen nirgends mit. Sie sind
   eine Anleitung, kein Teil der Einheit. */
const AUFWAERM_STUFEN = [[0.4, 8], [0.6, 5], [0.8, 3]];
const AUFWAERM_MIN = 20;   /* darunter lohnt kein Aufbau — dann direkt los */

function aufwaermPlan(exId, gewicht){
  if (restFor(exId) < 180) return null;
  const w = +gewicht || 0;
  if (w < AUFWAERM_MIN) return null;
  const inc = incOf(exId);
  const stufen = [];
  AUFWAERM_STUFEN.forEach(([anteil, wdh]) => {
    const g = snapTo(w * anteil, inc);
    /* Zwei gleiche Stufen sind eine — bei kleinen Gewichten fallen 40 und 60
       Prozent nach dem Runden sonst auf denselben Wert. */
    if (g > 0 && g < w && !stufen.some(s => s.gewicht === g)) stufen.push({gewicht:g, wdh:wdh});
  });
  return stufen.length ? stufen : null;
}

/* =============================================================== analysis */
/* Load actually moved by one rep, in kg. Per-side entries count both sides;
   bodyweight moves count the body plus whatever hangs off the belt. */
function effLoad(e){
  const base = e.perSide ? e.weight * 2 : e.weight;
  return base + (e.bw ? S.settings.bodyweight : 0);
}
/* Uebungen, deren Zahl Sekunden meint statt Wiederholungen. Ein Haengen von
   60 Sekunden waere als Volumen 60 x Koerpergewicht — mehr als eine ganze
   Einheit Bankdruecken, und trotzdem waere kein Kilo bewegt worden. Deshalb
   zaehlt gehaltene Zeit weder ins Tonnage noch in die Kraftschaetzung; sie
   zaehlt dort, wo sie hingehoert: in die Belastung des Griffs und in ihr
   eigenes Ziel. */
const istZeit = id => !!(EX[id] || {}).zeit;
const einheitVon = id => istZeit(id) ? "s" : "Wdh.";
/* Schrittweite am Satzzaehler: bei Sekunden in Fuenfern, sonst einzeln. */
const schrittVon = id => istZeit(id) ? 5 : 1;

const tonnage = e => istZeit(e.id) ? 0 : e.reps.reduce((a,r) => a + r * effLoad(e), 0);
const e1rm = e => {
  if (!e.reps.length || istZeit(e.id)) return 0;
  const best = e.reps.reduce((a,r) => Math.max(a, r), 0);
  return effLoad(e) * (1 + best / 30);
};

function prsFrom(sessions){
  const pr = {};
  sessions.forEach(s => s.entries.forEach(e => {
    if (!e.reps.length) return;
    const best = e.reps.reduce((a,r) => Math.max(a, r), 0);
    const c = pr[e.id] || {reps:0, weight:-1, repsAtBw:0, e1rm:0};
    const w = e.perSide ? e.weight * 2 : e.weight;
    if (w > c.weight) c.weight = w;
    if (best > c.reps) c.reps = best;
    if (e.bw && best > c.repsAtBw) c.repsAtBw = best;
    c.e1rm = Math.max(c.e1rm, e1rm(e));
    pr[e.id] = c;
  }));
  return pr;
}
/* Bei Wiederholungszielen zaehlt der laengste Satz ohne Zusatzgewicht.
   Bei Lastzielen das schwerste Gewicht, das die geforderte Satzlaenge
   getragen hat — nicht das schwerste ueberhaupt. */
const goalReps = g => g.reps || 5;
/* Ein Ziel kann mehrere Uebungen umfassen — schwere und leichte Variante
   derselben Bewegung. Gemessen wird die Bewegung, nicht der Platz im Plan. */
const goalEx = g => Array.isArray(g.ex) ? g.ex : [g.ex];
const rawGoalValue = (g, pr) => {
  if (g.kind === "reps") {
    return goalEx(g).reduce((m, id) => Math.max(m, pr[id] ? pr[id].repsAtBw : 0), 0);
  }
  let best = 0;
  S.sessions.forEach(s => (s.entries || []).forEach(e => {
    if (goalEx(g).indexOf(e.id) < 0 || !e.reps.length) return;
    if (Math.max.apply(null, e.reps) < goalReps(g)) return;
    best = Math.max(best, e.perSide ? e.weight * 2 : e.weight);
  }));
  return best;
};
/* the rung we are climbing towards right now */
function goalStep(g, pr){
  const v = rawGoalValue(g, pr);
  const next = g.steps.find(s => v < s);
  return {value:v, target:next || g.steps[g.steps.length-1], final:g.steps[g.steps.length-1], done:!next};
}

/* Last time this exercise was actually trained (skips don't count). */
function lastEntry(exId, exceptSessionId){
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const s = S.sessions[i];
    if (exceptSessionId && s.id === exceptSessionId) continue;
    const e = s.entries.find(x => x.id === exId && x.reps.length);
    if (e) return {entry:e, session:s};
  }
  return null;
}
function historyOf(exId){
  const out = [];
  S.sessions.forEach(s => s.entries.forEach(e => {
    if (e.id === exId && e.reps.length) out.push({date:s.date, e1rm:e1rm(e), tonnage:tonnage(e), entry:e, sid:s.id});
  }));
  return out;
}

/* Progression rule: everything at the top of the bracket earns a step up;
   three sessions stuck below the bottom earn a step down. */
function evaluate(plan, entries, weights){
  const changes = [], next = Object.assign({}, weights);
  plan.ex.forEach(cfg => {
    const e = entries.find(x => x.id === cfg.id);
    if (!e || !e.reps.length) return;
    const w = weights[cfg.id] || 0;
    const inc = incOf(cfg.id);
    const total = e.reps.reduce((a,b) => a+b, 0);

    if (cfg.total) {
      if (total >= cfg.total[1]) {
        next[cfg.id] = snapTo(w + inc, inc);
        changes.push({id:cfg.id, from:w, to:next[cfg.id], why:total+" Wdh. gesamt – Zusatz drauf"});
      } else {
        changes.push({id:cfg.id, from:w, to:w, why:total+" von "+cfg.total[1]+" Wdh. – halten"});
      }
      return;
    }
    if (e.reps.length >= cfg.sets && e.reps.every(r => r >= cfg.max)) {
      /* Dieselbe Regel wie im Vorschlag vor der Einheit. Steigt das
         exzentrische Zusatzgewicht, wandert das direkt in die Einstellung der
         Uebung — es haengt nicht am Plan, sondern am Geraet. */
      const st = steigerung(cfg.id, w, +e.ecc || 0, e.rir, hauptZuletztErhoeht(cfg.id, null));
      next[cfg.id] = st.weight;
      if (st.ecc !== (+e.ecc || 0)) setCfg(cfg.id, {ecc: st.ecc});
      changes.push({id:cfg.id, from:w, to:st.weight, ecc:st.ecc !== (+e.ecc||0) ? st.ecc : null,
                    why:st.why});
      return;
    }
    const past = S.sessions.filter(s => s.entries.some(x => x.id === cfg.id && x.reps.length))
      .slice(-2).map(s => s.entries.find(x => x.id === cfg.id));
    /* Dieselbe Ausnahme wie im Vorschlag: eine abgebrochene Uebung ist kein
       Beleg dafuer, dass das Gewicht zu hoch war. */
    const weak = past.concat([e]).filter(x => x.reps.length && !x.abbruch &&
      x.reps.reduce((a,b) => a+b, 0) / x.reps.length < cfg.min);
    if (weak.length >= 3 && w > 0) {
      next[cfg.id] = snapTo(w * 0.9, inc);
      changes.push({id:cfg.id, from:w, to:next[cfg.id], why:"3× unter Ziel – 10 % runter"});
    } else {
      changes.push({id:cfg.id, from:w, to:w, why:"Gewicht halten"});
    }
  });
  return {next:next, changes:changes};
}

/* -------------------------------------------------- Vorschlag fuers Gewicht */
/* Dieselbe Regel, die nach der Einheit rechnet — nur vorher gefragt. Bisher
   entschied sie im Stillen; man sah beim Training nur das alte Gewicht und
   musste selbst raten, ob es diesmal mehr sein darf.

   `rir` ist der Abstand zum Muskelversagen aus der letzten Einheit: 0 heisst
   nichts mehr ging, 3 heisst es war locker. Nur damit laesst sich "alle Saetze
   im Ziel" ueberhaupt einordnen — zehn Wiederholungen mit drei in Reserve sind
   etwas anderes als zehn am Limit. */
/* Wie hoch das exzentrische Zusatzgewicht ueberhaupt gehen kann. Steht in den
   Einstellungen, weil es eine Eigenschaft des Geraets ist und nicht der App —
   und weil sich der Nutzer beim Wert selbst nicht sicher war. */
/* Die eigene Obergrenze fuer exzentrisches Zusatzgewicht — eine feste Zahl
   in Kilo. Sie allein reicht aber nicht: das Geraet deckelt den Zuschlag
   laut Speediance-FAQ bei **50 Prozent des konzentrischen Gewichts**. Bei
   20 kg Arbeitsgewicht sind also hoechstens 10 kg moeglich, bei 10 kg nur
   fuenf — und ein Vorschlag darueber laeuft am Geraet schlicht ins Leere,
   ohne dass die App es merken wuerde. Deshalb gilt immer die kleinere der
   beiden Grenzen. Fuer Uebungen ausserhalb des Geraets (Klimmzuege, Dips)
   greift der Prozentdeckel nicht — dort haengt das Gewicht am Guertel. */
const eccMax = () => +S.settings.eccMax || 10;
const ECC_ANTEIL = 0.5;
function eccGrenze(exId, w){
  const fest = eccMax();
  if (!amGeraet(exId)) return fest;
  const anteilig = Math.floor((+w || 0) * ECC_ANTEIL);
  return Math.max(0, Math.min(fest, anteilig));
}

/* Die Entscheidung, was nach einer erfuellten Einheit steigt. Genau eine
   Stelle, von der aus beide Seiten lesen: der Vorschlag vor der Uebung und
   die Auswertung danach. Standen sie getrennt, wuerde die App etwas anderes
   empfehlen als sie hinterher rechnet — und niemand merkt es.

   Der Grundgedanke: das Hauptgewicht traegt den Fortschritt, das exzentrische
   Zusatzgewicht ist ein zweites Gleis. Wer beides gleichzeitig hochzieht,
   steigert zweimal — deshalb wechseln sie sich ab, ausser der letzte Satz war
   ausdruecklich locker. Dann war schlicht zu wenig dran. */
function steigerung(exId, w, ecc, rir, hauptZuletzt){
  const inc = incOf(exId);
  /* Nicht `eccMax()` allein: am Geraet gilt zusaetzlich der Deckel von
     50 % des Arbeitsgewichts. Ein Vorschlag darueber ist am Geraet nicht
     einstellbar. */
  const frei = ecc > 0 && ecc < eccGrenze(exId, w);
  const locker = rir >= 3;

  if (!ecc) {
    return {weight: snapTo(w + (locker ? 2 : 1) * inc, inc), ecc: ecc,
            why: locker ? "alle Sätze im Ziel, noch Luft" : "alle Sätze im Ziel"};
  }
  if (locker && frei) {
    return {weight: snapTo(w + inc, inc), ecc: ecc + 1,
            why: "alle Sätze im Ziel, noch Luft — beides eine Stufe"};
  }
  if (locker) {
    return {weight: snapTo(w + 2 * inc, inc), ecc: ecc,
            why: "alle Sätze im Ziel, noch Luft — exzentrisch am Anschlag"};
  }
  if (hauptZuletzt && frei) {
    return {weight: w, ecc: ecc + 1,
            why: "alle Sätze im Ziel — diesmal exzentrisch"};
  }
  return {weight: snapTo(w + inc, inc), ecc: ecc, why: "alle Sätze im Ziel"};
}

/* Ob beim letzten Mal das Hauptgewicht gestiegen ist. Daran haengt, wer als
   Naechstes dran ist. Ohne zwei vergleichbare Eintraege: nein. */
function hauptZuletztErhoeht(exId, bisSessionId){
  const list = [];
  for (let i = S.sessions.length - 1; i >= 0 && list.length < 2; i--) {
    const s = S.sessions[i];
    if (bisSessionId && s.id === bisSessionId) continue;
    const e = (s.entries || []).find(x => x.id === exId && x.reps.length);
    if (e) list.push(e);
  }
  if (list.length < 2) return false;
  return (list[0].weight || 0) > (list[1].weight || 0);
}

function gewichtVorschlag(exId, planId){
  const pl = planOf(planId || (S.active && S.active.plan));
  const cfg = pl && (pl.ex || []).find(x => x.id === exId);
  const le = lastEntry(exId);
  if (!cfg || !le) return null;

  /* Ausgangspunkt ist immer das Gewicht der letzten tatsaechlich trainierten
     Einheit — niemals das gerade eingestellte.

     Vom eingestellten aus zu rechnen war die Ursache der Endlosschleife:
     10 kg geschafft, Vorschlag 11, uebernommen — und weil damit 11 eingestellt
     war, rechnete der naechste Aufruf von 11 aus und schlug 12 vor. Die
     Bedingung "alle Saetze im Ziel" prueft ja weiterhin dieselbe, unveraenderte
     letzte Einheit. So liess sich das Gewicht endlos hochklicken, ohne dass
     ein einziger Satz dazu stattgefunden haette.

     Der urspruengliche Zweck bleibt trotzdem erfuellt: hat die Nachbereitung
     das Gewicht schon hochgesetzt, faellt der Vorschlag mit dem eingestellten
     Wert zusammen und die Zeile meldet ihn als uebernommen, statt hinter die
     eigene Entscheidung zurueckzugehen. Ob er schon umgesetzt ist, entscheidet
     `vorschlagZeile` — die kennt das eingestellte Gewicht ohnehin. */
  const w = +le.entry.weight || 0;
  const inc = incOf(exId);
  const reps = le.entry.reps;
  const rir = le.entry.rir;
  const summe = reps.reduce((a,b) => a+b, 0);

  /* Ein Wechsel der Zaehlweise macht die letzte Einheit unvergleichbar: 20 kg
     je Seite sind nicht 20 kg gesamt. Dann lieber nichts sagen.
     Das exzentrische Zusatzgewicht faellt ausdruecklich nicht darunter — es
     ist Teil dessen, worueber der Vorschlag entscheidet. Steht es schon hoeher
     als beim letzten Mal, hat er selbst vorgelegt: dann ist das Hauptgewicht
     an der Reihe und nicht noch einmal die Exzentrik. */
  const jetzt = (S.active && S.active.cfg[exId]) || cfgOf(exId);
  if (!!jetzt.perSide !== !!le.entry.perSide) return null;
  const eccAlt = +le.entry.ecc || 0;
  const eccNun = +jetzt.ecc || 0;
  const eccSchonHoch = eccNun > eccAlt;

  /* Wurde die Uebung letztes Mal wegen Schmerzen abgebrochen, ist mehr Gewicht
     die falsche Antwort — egal wie die Wiederholungen aussahen. Erst wieder
     schmerzfrei durchziehen, dann steigern. */
  if (le.entry.abbruch === "Schmerzen") {
    return {von:w, auf:w, art:"halten",
            warum:"letztes Mal wegen Schmerzen abgebrochen", dazu:""};
  }

  const oben = cfg.total ? summe >= cfg.total[1]
             : (reps.length >= cfg.sets && reps.every(r => r >= cfg.max));

  if (oben) {
    /* Steht das exzentrische Zusatzgewicht schon ueber dem letzten Mal, ist die
       Steigerung fuer diese Uebung erledigt — sonst boete die App direkt danach
       auch noch das Hauptgewicht an und haette beides auf einmal erhoeht.
       Genau das soll der Wechsel verhindern. */
    if (eccSchonHoch) {
      return {von:w, auf:w, eccVon:eccNun, eccAuf:eccNun, art:"hoch",
              warum:"exzentrisch eine Stufe höher", dazu:""};
    }
    const ecc = Math.max(eccAlt, eccNun);
    const st = steigerung(exId, w, ecc, rir, hauptZuletztErhoeht(exId));
    /* Aendert sich gar nichts, ist das kein Vorschlag, sondern eine Sackgasse:
       alles im Ziel und trotzdem nichts zu steigern gibt es nur, wenn das
       Geraet am Anschlag ist. Dann sagt die App das auch so. */
    if (st.weight === w && st.ecc === ecc) {
      return {von:w, auf:w, art:"halten", warum:"alles im Ziel, aber nichts mehr zu steigern", dazu:""};
    }
    return {von:w, auf:st.weight, eccVon:ecc, eccAuf:st.ecc, art:"hoch",
            warum: cfg.total ? summe + " Wdh. gesamt geschafft" : st.why,
            dazu: rir === 0 ? "aber nichts mehr übrig" : ""};
  }

  const frueher = S.sessions.filter(s => s.entries.some(x => x.id === exId && x.reps.length))
    .slice(-3).map(s => s.entries.find(x => x.id === exId));
  /* Ein Abbruch ist kein zu schweres Gewicht. Zaehlte er mit, wuerde die App
     nach drei unterbrochenen Einheiten das Gewicht senken, obwohl die Saetze,
     die stattfanden, sauber waren. */
  const schwach = frueher.filter(x => x.reps.length && !cfg.total && !x.abbruch &&
    x.reps.reduce((a,b) => a+b, 0) / x.reps.length < cfg.min);
  if (schwach.length >= 3 && w > 0) {
    return {von:w, auf:snapTo(w * 0.9, inc), art:"runter", warum:"dreimal unter dem Ziel", dazu:""};
  }

  const fehlt = cfg.total ? (cfg.total[1] - summe) + " Wdh. bis zum Ziel"
              : "noch nicht alle Sätze bei " + cfg.max;
  return {von:w, auf:w, art:"halten", warum:fehlt,
          dazu: rir === 0 ? "und nichts mehr übrig" : ""};
}

/* Ohne feste Trainingstage kann die Serie keine Pflichttage mehr zaehlen.
   Sie zaehlt jetzt aufeinanderfolgende Tage, an denen du entweder trainiert
   oder bewusst eine Pause eingetragen hast — also dran geblieben bist. */
function streak(){
  const done = {};
  S.sessions.forEach(s => done[s.date] = 1);
  const d = new Date();
  let n = 0;
  if (!done[dayKey(d)]) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if (!done[dayKey(d)]) break;
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ====================================================== Muskeln & Erholung */
/* Kein medizinisches Modell, sondern eine Buchhaltung: gewichtete Saetze je
   Muskelgruppe, die ueber ein Zeitfenster linear abgebaut werden. Jede Zahl auf
   der Startseite laesst sich damit in einem Satz erklaeren. */

/* "grip" steht am Ende: neu dazugekommen, und die Reihenfolge bestimmt die
   Staffelung beim Aufleuchten der Karte — vorne einzufuegen haette den
   eingespielten Rhythmus aller anderen Gruppen verschoben. */
const MUSCLES = ["chest","back","delts","biceps","triceps","legs","glutes","core","grip"];
const MUSCLE_LABEL = {
  chest:"Brust", back:"Rücken", delts:"Schultern", biceps:"Bizeps",
  triceps:"Trizeps", legs:"Beine", glutes:"Gesäß", core:"Core",
  grip:"Griff"
};

/* Bewegungsmuster -> Anteil je Muskelgruppe. Greift auf EX[id].pat zu, das es
   schon gibt: dadurch sind auch alle frueher gespeicherten Einheiten auswertbar,
   ohne dass irgendetwas nacherfasst werden muss. */
/* Der Griff haengt an fast jeder Zugbewegung mit und an keiner Druckbewegung.
   Genau darum steht er als eigene Gruppe hier: an einem Push-Tag bleibt er
   unbelastet, und das sieht man der Karte jetzt an. Kreuzheben ist der
   groesste Reiz — dort haelt die Hand alles, was auch der Ruecken haelt. */
const PAT_MUSCLE = {
  bench:   {chest:1.0, triceps:0.5, delts:0.4},
  dip:     {chest:0.8, triceps:0.9, delts:0.4},
  ohp:     {delts:1.0, triceps:0.6, core:0.2},
  lat:     {delts:0.9},
  tri:     {triceps:1.0},
  vpull:   {back:1.0, biceps:0.6, core:0.3, grip:0.9},
  row:     {back:1.0, biceps:0.5, delts:0.3, grip:0.6},
  row1:    {back:1.0, biceps:0.5, delts:0.3, core:0.3, grip:0.6},
  rear:    {delts:0.7, back:0.4},
  curl:    {biceps:1.0, grip:0.4},
  /* Hammer Curls treffen den Oberarmspeichenmuskel, also den Unterarm,
     deutlich staerker als der klassische Curl. */
  hammer:  {biceps:0.9, grip:0.7},
  squat:   {legs:1.0, glutes:0.7, core:0.4},
  hinge:   {glutes:1.0, back:0.7, legs:0.7, core:0.5, grip:1.0},
  split:   {legs:1.0, glutes:0.8, core:0.3, grip:0.3},
  legcurl: {legs:0.8, glutes:0.3},
  /* Getrennt vom Beinbeuger: der Beinstrecker arbeitet allein ueber das Knie,
     das Gesaess ist nicht beteiligt. Vorher teilten sich beide ein Muster und
     der Strecker schrieb dem Gesaess Belastung zu, die es nie gab. */
  legext:  {legs:0.8},
  calf:    {legs:0.4},
  abs:     {core:1.0},
  /* Shrugs liefen bisher unter `row` und zaehlten dadurch Bizeps mit. Der Arm
     bleibt bei der Bewegung gestreckt; belastet wird der Nacken. */
  shrug:   {back:0.8, delts:0.3, grip:0.9},
  /* Wie die Kniebeuge, nur ohne Rumpfanteil: an der Beinpresse traegt die
     Lehne den Oberkoerper. */
  legpress:{legs:1.0, glutes:0.5},
  uprow:   {delts:0.8, back:0.5, biceps:0.3, grip:0.4},
  fly:     {chest:1.0, delts:0.3},
  hyper:   {back:0.9, glutes:0.5, legs:0.3},
  /* Haengen und alles, was nur den Griff fordert. */
  griff:   {grip:1.0, back:0.2}
};
/* Boxen als Ganzkoerper- und Ausdauerbelastung. */
const BOX_MUSCLE = {delts:0.7, core:0.8, legs:0.6, back:0.3, triceps:0.3};

/* Wie lange eine Gruppe braucht, bis eine Belastung rechnerisch abgebaut ist. */
const RECOVERY_H = {
  chest:72, back:72, legs:72, glutes:72,
  delts:48, biceps:48, triceps:48,
  core:36,
  /* Der Unterarm erholt sich am schnellsten — kleine Muskeln, viel
     Ausdauerfaser. Nicht die Muskeln sind die Grenze, sondern die Sehnen am
     Ellenbogen; die halten aber laenger als 24 Stunden nur bei maximalen
     Einheiten, und die stehen nicht taeglich an. */
  grip:24
};
/* Bezugsgroesse fuer die Ampel: so viele gewichtete Saetze gelten als volle Einheit. */
const REF_LOAD = 8;

/* Einheiten kennen nur ein Datum. Fuer alte Eintraege nehmen wir die Tagesmitte
   als neutrale Annahme; neue Einheiten speichern einen echten Zeitstempel. */
const sessionTime = s => s.ts || (parseDay(s.date).getTime() + 12 * 3600000);

/* --- Wann genau trainiert wurde ----------------------------------
   `ts` ist der Zeitpunkt des Abschliessens, `minutes` die Dauer — der
   Beginn ergibt sich also aus beidem. Seit 9.18 steht der Beginn zusaetzlich
   als eigenes Feld in der Einheit; abgeleitet wird nur noch bei Altdaten.

   Warum das ueberhaupt sichtbar sein muss: Whoop traegt eine Einheit nicht
   immer selbst ein. Dann traegt er sie dort von Hand nach — und dafuer
   braucht er die genaue Uhrzeit, nicht nur den Tag. */
function sessionSpanne(s){
  if (!s) return null;
  const dauer = +s.minutes || 0;
  const ende = sessionTime(s);
  const start = s.startedAt ? +s.startedAt : (dauer ? ende - dauer * 60000 : null);
  if (!start) return null;
  return {start: start, ende: s.startedAt && dauer ? start + dauer * 60000 : ende, dauer: dauer};
}
const uhrzeit = ms => new Date(ms).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
/* "18:04 – 19:12". Ohne Dauer nur der Beginn: eine Spanne ohne Ende zu
   behaupten waere geraten. */
function spanneText(s){
  const sp = sessionSpanne(s);
  if (!sp) return "";
  return sp.dauer ? uhrzeit(sp.start) + "–" + uhrzeit(sp.ende) : "ab " + uhrzeit(sp.start);
}

/* Intensitaet: der getippte Wert schlaegt die Schaetzung. Ohne Angabe wird aus
   dem Verhaeltnis zum besten bekannten 1RM geschaetzt. */
function intensityFactor(e, s, best){
  if (s && s.effort) return Math.max(0.6, Math.min(1.3, 0.55 + s.effort * 0.15));
  const top = best && best[e.id] ? best[e.id].e1rm : 0;
  if (!top) return 1;
  const ratio = e1rm(e) / top;
  return Math.max(0.6, Math.min(1.3, 0.3 + ratio * 0.8));
}

/* Gewichtete Saetze je Muskelgruppe fuer eine einzelne Einheit. */
function sessionLoad(s, best){
  const out = {};
  if (!s || s.kind === "rest") return out;

  if (s.kind === "boxing") {
    const units = (s.minutes || 0) / 10 * (0.5 + (s.effort || 3) * 0.2);
    Object.keys(BOX_MUSCLE).forEach(m => { out[m] = (out[m] || 0) + BOX_MUSCLE[m] * units; });
    return out;
  }

  (s.entries || []).forEach(e => {
    if (!e.reps || !e.reps.length) return;
    const pat = (EX[e.id] || {}).pat;
    const map = PAT_MUSCLE[pat];
    if (!map) return;
    const units = e.reps.length * intensityFactor(e, s, best);
    Object.keys(map).forEach(m => { out[m] = (out[m] || 0) + map[m] * units; });
  });
  return out;
}

/* Aktueller Stand je Muskelgruppe: was von der Belastung rechnerisch offen ist. */
/* `extra` sind angenommene, noch nicht stattgefundene Einheiten. Sie zaehlen
   fuer die Belastung mit, aber nie fuer die Rekorde — sonst wuerde eine
   geplante Einheit die Intensitaetsschaetzung der echten verschieben. */
function muscleState(now, extra){
  const t = now || Date.now();
  const best = prsFrom(S.sessions);
  const open = {}, last = {};
  MUSCLES.forEach(m => { open[m] = 0; last[m] = null; });

  (extra && extra.length ? S.sessions.concat(extra) : S.sessions).forEach(s => {
    const load = sessionLoad(s, best);
    const ts = sessionTime(s);
    const hrs = (t - ts) / 3600000;
    if (hrs < 0) return;
    MUSCLES.forEach(m => {
      const l = load[m] || 0;
      if (!l) return;
      open[m] += l * Math.max(0, 1 - hrs / RECOVERY_H[m]);
      if (last[m] === null || ts > last[m]) last[m] = ts;
    });
  });

  return MUSCLES.map(m => {
    const ratio = open[m] / REF_LOAD;
    /* Zwei voneinander unabhaengige Aussagen je Gruppe: `level` sagt, wie
       belastet sie gerade ist, `stale` wie lange sie nichts gesehen hat.
       Beides kann gleichzeitig gelten — erholt und trotzdem ueberfaellig ist
       genau der Zustand, den man sonst uebersieht. */
    const tage = last[m] === null ? 99 : (t - last[m]) / 86400000;
    return {
      id:m, label:MUSCLE_LABEL[m], open:open[m], ratio:ratio,
      level: ratio >= 0.66 ? "rot" : ratio >= 0.33 ? "gelb" : "gruen",
      last: last[m], tage: tage, stale: staleLevel(m, tage)
    };
  });
}
const muscleMap = st => { const o = {}; st.forEach(x => o[x.id] = x); return o; };

/* Welche Muskelgruppen ein Plan ueberhaupt trifft, normiert auf Summe 1. */
function planShare(pid){
  const pl = planOf(pid);
  const out = {};
  if (!pl) return out;
  let total = 0;
  pl.ex.forEach(e => {
    const map = PAT_MUSCLE[(EX[e.id] || {}).pat];
    if (!map) return;
    Object.keys(map).forEach(m => {
      const v = map[m] * (e.sets || 3);
      out[m] = (out[m] || 0) + v; total += v;
    });
  });
  if (total) Object.keys(out).forEach(m => out[m] /= total);
  return out;
}

/* ------------------------------------------------------------- Tagesform */
const FORM_FIELDS = [
  {k:"energy", label:"Energie",     low:"Leer",       mid:"Geht so",   high:"Voll da"},
  {k:"sleep",  label:"Schlaf",      low:"Schlecht",   mid:"Okay",      high:"Gut"},
  {k:"muscle", label:"Muskeln",     low:"Sehr müde",  mid:"Etwas müde",high:"Frisch"},
  {k:"mood",   label:"Motivation",  low:"Keine",      mid:"Mittel",    high:"Hoch"},
  {k:"drain",  label:"Erschöpfung", low:"Stark",      mid:"Etwas",     high:"Keine"}
];
const formScore = f => FORM_FIELDS.reduce((a, x) => a + (+f[x.k] || 2), 0);
const formLevel = score => score >= 12 ? "gruen" : score >= 8 ? "gelb" : "rot";
const formForToday = () => S.form.find(f => f.date === dayKey(new Date())) || null;

/* --------------------------------------------------------- Empfehlung */
function agoPhrase(ts){
  if (!ts) return "";
  const days = Math.floor((Date.now() - ts) / 86400000);
  const k = dayKey(new Date(ts)), today = dayKey(new Date());
  if (k === today) return "heute";
  if (days <= 1) return "gestern";
  return "vor " + (days + 1) + " Tagen";
}
const joinNames = arr => arr.length > 1
  ? arr.slice(0, -1).map(x => x.label).join(", ") + " und " + arr[arr.length-1].label
  : (arr[0] ? arr[0].label : "");

function reasonFor(pid, st, istAeltester){
  const hot = st.filter(x => x.ratio >= 0.33).sort((a,b) => b.ratio - a.ratio).slice(0, 2);
  const share = planShare(pid);
  const fresh = st.filter(x => (share[x.id] || 0) >= 0.10)
                  .sort((a,b) => a.ratio - b.ratio).slice(0, 2);
  const parts = [];
  if (hot.length) {
    const when = agoPhrase(Math.max.apply(null, hot.map(x => x.last || 0)));
    parts.push(joinNames(hot) + (hot.length > 1 ? " wurden " : " wurde ") + when + " stark belastet.");
  }
  if (fresh.length) {
    parts.push(joinNames(fresh) + (fresh.length > 1 ? " sind " : " ist ") + "ausreichend erholt.");
  }
  /* Wenn nichts belastet ist, ist der Rueckstand der eigentliche Grund —
     dann muss er auch dastehen, sonst wirkt die Empfehlung willkuerlich. */
  if (istAeltester) {
    const d = daysSincePlan(pid);
    parts.push(d >= 99
      ? "Und du hast ihn noch nie trainiert."
      : "Und er liegt mit " + Math.floor(d) + " Tagen am längsten zurück.");
  }
  return parts.join(" ") || "Alles erholt. Freie Wahl.";
}

/* Wie viele Tage jede Muskelgruppe nichts abbekommen hat. 99 = noch nie.
   "Erholt" und "vernachlaessigt" sind nicht dasselbe: nach zwei Ruhetagen ist
   alles erholt, aber die Gruppe, die seit drei Wochen nichts gesehen hat, ist
   trotzdem eher dran. Genau das trennt diese Funktion. */
function muscleStale(){
  const out = {};
  MUSCLES.forEach(m => out[m] = 99);
  const best = prsFrom(S.sessions);
  S.sessions.forEach(s => {
    const load = sessionLoad(s, best);
    const d = (Date.now() - sessionTime(s)) / 86400000;
    if (d < 0) return;
    MUSCLES.forEach(m => { if ((load[m] || 0) > 0.2 && d < out[m]) out[m] = d; });
  });
  return out;
}

/* ----------------------------------------------------- Vernachlaessigung */
/* Ab wann eine Gruppe wieder dran ist.
   Die Antwort steht nicht in der Erholungszeit: erholt zu sein heisst nur,
   dass wieder trainiert werden *kann*. Der Reiz einer Einheit haelt rund zwei
   bis drei Tage an; danach passiert nichts mehr, und nach etwa einer Woche
   ohne Reiz haelt man den Stand bestenfalls. Deshalb zwei Schwellen und nicht
   eine: "faellig" heisst, der Rhythmus rutscht; "vernachlaessigt" heisst, der
   Fortschritt in dieser Gruppe steht.
   Der Griff steht enger, weil er sich am schnellsten erholt und deshalb auch
   am haeufigsten drankommen darf. */
const STALE_FAELLIG = {chest:5, back:5, delts:5, biceps:5, triceps:5,
                       legs:5, glutes:5, core:4, grip:4};
const STALE_BRACH = 9;

/* Zustand einer Gruppe in Bezug auf die Zeit, nicht auf die Erholung.
   "neu" ist ausdruecklich kein Vorwurf: was nie trainiert wurde, ist nicht
   vernachlaessigt — es hat nur noch nicht angefangen. */
function staleLevel(m, tage){
  if (tage >= 99) return "neu";
  if (tage >= STALE_BRACH) return "brach";
  if (tage >= (STALE_FAELLIG[m] || 5)) return "faellig";
  return "ok";
}

/* ------------------------------------------------------ Volumen je Woche */
/* Wie viele harte Saetze eine Muskelgruppe in den letzten sieben Tagen gesehen
   hat. Die Anteile aus PAT_MUSCLE zaehlen mit: Bankdruecken ist ein voller
   Satz fuer die Brust und ein halber fuer den Trizeps. Genau so wird in der
   Literatur gezaehlt, und genau deshalb steht hier eine Kommazahl.

   Bewusst *ohne* den Intensitaetsfaktor aus `sessionLoad`: dort geht es um
   Erholung, hier um Menge. Ein leichter Satz ist fuer die Erholung weniger
   wert, fuer die Zaehlung bleibt er ein Satz.

   Sieben rollende Tage statt Kalenderwoche — sonst stuende montags ueberall
   null und der Korridor waere eine Woche lang sinnlos. */
function wochenSaetze(tage){
  const von = Date.now() - (tage || 7) * 86400000;
  const out = {};
  MUSCLES.forEach(m => out[m] = 0);
  S.sessions.forEach(s => {
    if (sessionTime(s) < von || s.kind === "rest") return;
    if (s.kind === "boxing") {
      const einheiten = (s.minutes || 0) / 10;
      Object.keys(BOX_MUSCLE).forEach(m => { out[m] += BOX_MUSCLE[m] * einheiten; });
      return;
    }
    (s.entries || []).forEach(e => {
      if (!e.reps || !e.reps.length) return;
      const map = PAT_MUSCLE[(EX[e.id] || {}).pat];
      if (!map) return;
      Object.keys(map).forEach(m => { out[m] += map[m] * e.reps.length; });
    });
  });
  return out;
}

/* Der Korridor. Zehn bis zwanzig harte Saetze je Muskel und Woche sind der
   Bereich, in dem der Zuwachs mit der Menge steigt; darunter haelt man eher
   den Stand, darueber wird der Gewinn klein und die Erholung teuer.
   Unter sechs Saetzen reicht es nicht einmal zum Halten. */
const VOL_ERHALT = 6, VOL_MIN = 10, VOL_MAX = 20, VOL_SKALA = 26;
function volLevel(n){
  return n < VOL_ERHALT ? "wenig" : n < VOL_MIN ? "erhalt" : n <= VOL_MAX ? "gut" : "viel";
}

/* -------------------------------------------------- systemische Belastung */
/* Muskeln erholen sich je Gruppe, das Nervensystem nicht. Es traegt alles
   zusammen — und es ist der Grund, warum jeden Tag trainieren langsamer
   vorankommt als vier Mal die Woche.
   Messen laesst es sich nicht. Was hier steht, sind vier Anzeichen, die jedes
   fuer sich schwach sind und zusammen etwas taugen. Jedes nennt sich selbst,
   damit die Aussage nachvollziehbar bleibt statt orakelhaft. */
function systemLoad(){
  const gruende = [];
  let punkte = 0;

  /* 1. Tage am Stueck ohne Ruhetag — zaehlt weiter mit, wiegt aber nichts
     mehr. Fuenf Jahre eigene Daten zeigen dafuer keinen Effekt, und in der
        ganzen Zeit gab es vier Tage mit mindestens vier Einheiten in Folge.
        Es war eine Lehrbuchannahme, kein Befund. Die Zahl bleibt sichtbar,
        weil sie interessant ist; sie darf nur nicht mehr mitentscheiden. */
  const tage = {};
  S.sessions.forEach(s => { if (s.kind === "lift") tage[s.date] = true; });
  let folge = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (!tage[dayKey(d)]) { if (i === 0) continue; break; }
    folge++;
  }

  /* 2. Tagesform der letzten drei Tage. Die eigene Wahrnehmung ist beim
        Nervensystem die belastbarste Quelle, die es ueberhaupt gibt. */
  const letzte = [];
  for (let i = 0; i < 3; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const f = S.form.find(x => x.date === dayKey(d));
    if (f) letzte.push(f.score / FORM_FIELDS.length);
  }
  if (letzte.length) {
    const mittel = letzte.reduce((a, b) => a + b, 0) / letzte.length;
    if (mittel <= 1.6) { punkte += 2; gruende.push("Tagesform seit Tagen niedrig"); }
    else if (mittel <= 2.0) { punkte += 1; gruende.push("Tagesform gedämpft"); }
  }

  /* 3. Der geschaetzte Erholungswert. Die drei Einzelabfragen von vorher
        (HRV, Puls, Schlaf) sind hier aufgegangen: das Modell wiegt sie
        ohnehin schon gegeneinander ab, und dreimal dieselbe Nacht zu
        zaehlen hat aus einem schwachen Anzeichen drei gemacht.
        Die Grenzen 35 und 45 sind keine runden Zahlen, sondern die mit den
     besten Trefferquoten aus seinen eigenen Naechten. */
  /* Die Gruende sind Marken, keine Saetze: sie stehen in einer Aufzaehlung
     und im Hinweis auf der Startseite, und dort zaehlt jede Zeile. Die
     Herleitung gehoert ins Blatt, wo Platz dafuer ist. */
  const erh = erholungLage();
  /* Faellt das Hauptmodell aus, weil die HRV fehlt, traegt die Ersatzampel
     die Aussage. Sie kennt die Lage zuverlaessig, nur nicht den Punkt —
     und fuer "Pause oder nicht" reicht die Lage. */
  const ersA = erh ? null : erholungErsatz();
  if (ersA) {
    if (ersA.ampel === "rot") { punkte += 2; gruende.push("Erholung niedrig — geschätzt ohne HRV"); }
    else if (ersA.ampel === "gelb") { punkte += 1; gruende.push("Erholung gedämpft — geschätzt ohne HRV"); }
  }
  if (erh) {
    if (erh.heute <= ERH_ROT) {
      punkte += 2; gruende.push("Erholung geschätzt " + erh.heute);
    } else if (erh.heute <= ERH_GELB) {
      punkte += 1; gruende.push("Erholung geschätzt " + erh.heute);
    }
    /* Und hier die Entrauschung: nicht durch Glaetten des Wertes — das
       macht ihn nachweislich schlechter — sondern dadurch, dass eine
       einzelne schwache Nacht allein nie fuer eine Pause reicht. Erst die
       Haeufung ueber mehrere Naechte wiegt schwer. */
    if (erh.reihe && erh.schwach >= 2) {
      punkte += 1;
      gruende.push(erh.schwach + " von " + erh.n + " Nächten schwach");
    }
  }

  /* 3c. Nachhall einer harten Einheit — zwei Tage lang, dann nicht mehr. */
  const nh = nachhall();
  if (nh) {
    if (nh.tage === 1) punkte += 1;
    gruende.push((nh.box ? "Boxen" : "sehr harte Einheit")
      + (nh.tage === 1 ? " gestern" : " vorgestern"));
  }

  /* 3b. Schlaf getrennt davon, obwohl er im Modell schon steckt: dort ist er
         eine Abweichung vom eigenen Schnitt, hier eine harte Untergrenze.
         Sein Schnitt liegt selbst unter dem Bedarf — eine Nacht "wie immer"
         ist bei ihm keine gute Nacht. */
  const sg = schlafGrenze();
  if (sg) { punkte += 1; gruende.push(sg.art === "rot" ? "unter sechs Stunden Schlaf" : sg.text); }

  /* 4. Volumen der letzten sieben Tage gegen den eigenen Schnitt. Erst ab
        drei vollen Wochen — vorher ist der "eigene Schnitt" eine einzelne
        Woche, und daran gemessen ist jede zweite Woche ein Ausreisser. */
  const wk = weekCounts();
  const wochen = Object.keys(wk).sort();
  if (wochen.length >= 4) {
    const jetzt = wk[wochen[wochen.length - 1]] || 0;
    const vorher = wochen.slice(0, -1).map(k => wk[k]).sort((a, b) => a - b);
    const median = vorher[Math.floor(vorher.length / 2)];
    if (median && jetzt > median * 1.5) {
      punkte += 1; gruende.push("mehr Einheiten als sonst in dieser Woche");
    }
  }

  const level = punkte >= 4 ? "hoch" : punkte >= 2 ? "erhoeht" : "normal";
  return {
    level: level, punkte: punkte, gruende: gruende, folge: folge,
    erh: erh, schlaf: sg, nachhall: nh,
    /* Zwei Fassungen: `kurz` steht in der Zeile neben dem Wort "Nervensystem"
       und darf es nicht wiederholen, `text` traegt das Blatt als Ueberschrift. */
    kurz: level === "hoch" ? "Überzogen" : level === "erhoeht" ? "Gefordert" : "Erholt",
    text: level === "hoch" ? "Nervensystem überzogen"
        : level === "erhoeht" ? "Nervensystem gefordert"
        : "Nervensystem erholt"
  };
}

/* Wie lange ein bestimmter Plan zurueckliegt. 99 = noch nie gemacht. */
function daysSincePlan(pid){
  let latest = null;
  S.sessions.forEach(s => {
    if (s.plan !== pid) return;
    const ts = sessionTime(s);
    if (latest === null || ts > latest) latest = ts;
  });
  return latest === null ? 99 : (Date.now() - latest) / 86400000;
}
const lastPlanLabel = pid => {
  const d = daysSincePlan(pid);
  if (d >= 99) return "noch nie";
  if (d < 1) return "heute";
  if (d < 2) return "gestern";
  return "vor " + Math.floor(d) + " Tagen";
};

/* Eine geplante Einheit als Rechenmodell — nur so viel, wie sessionLoad
   braucht. Anstrengung 3 heisst normale Intensitaet, also Faktor 1: eine
   Annahme darf nicht schwerer wiegen als eine echte Einheit. */
function plannedSession(pid, ts){
  const pl = planOf(pid);
  if (!pl) return null;
  return {
    id:"geplant:"+pid+":"+ts, date:dayKey(new Date(ts)), ts:ts, kind:"lift",
    plan:pid, type:pl.type, minutes:0, effort:3, form:null, note:"",
    entries: pl.ex.map(e => ({
      id:e.id, name:exName(e.id), bw:isBw(e.id),
      weight:+S.weights[e.id] || 0, perSide:false, ecc:0, chain:0,
      variant:"", note:"", skipped:null,
      reps: new Array(Math.max(1, e.sets || 3)).fill(e.min || 8)
    }))
  };
}

/* Sieben Tage vorausgerechnet.
   Der Kniff: jeder angenommene Trainingstag fliesst in die Rechnung des
   naechsten ein. Ohne das stuende an jedem Tag derselbe Vorschlag, weil sich
   die Erholung ohne Belastung nur weiter verbessert. Die Vorschau gilt also
   unter der Annahme, dass man ihr folgt — und genau das steht auch dran. */
function weekAhead(){
  const geplant = [];
  const tage = [];
  const start = new Date();
  start.setHours(18, 0, 0, 0);            /* Trainingszeit als Bezugspunkt */

  /* Wie oft wird tatsaechlich trainiert? Ohne diese Bremse schlaegt das
     Erholungsmodell sieben Tage am Stueck vor — bei einem Split ist die
     Gegenseite naemlich immer frisch. Gerechnet wird deshalb mit dem eigenen
     Rhythmus der letzten drei Wochen, nicht mit dem, was gerade ginge. */
  const jetzt = Date.now();
  const fenster = S.sessions.filter(s => s.kind === "lift"
    && jetzt - sessionTime(s) <= 21 * 86400000);
  /* Durch den tatsaechlichen Zeitraum teilen, nicht durch die vollen drei
     Wochen: wer erst seit acht Tagen erfasst, traininert sonst rechnerisch
     nur halb so oft, wie er es tut. Nach unten auf eine Woche begrenzt, damit
     wenige Tage keinen unrealistisch hohen Schnitt ergeben. */
  const aeltest = fenster.length ? Math.min.apply(null, fenster.map(sessionTime)) : jetzt;
  const spanne = Math.max(7, Math.min(21, (jetzt - aeltest) / 86400000 + 1));
  const proWoche = fenster.length
    ? Math.max(2, Math.min(6, Math.round(fenster.length / spanne * 7)))
    : 3;

  /* Hat er heute schon trainiert, faengt der Plan morgen an. */
  const heuteSchon = S.sessions.some(s => s.kind === "lift" && s.date === dayKey(new Date()));
  const ersterTag = heuteSchon ? 1 : 0;
  const platz = 7 - ersterTag;
  const anzahl = Math.max(1, Math.min(proWoche, platz));
  const trainingstage = {};
  for (let n = 0; n < anzahl; n++) trainingstage[ersterTag + Math.round(n * platz / anzahl)] = true;

  for (let i = 0; i < 7; i++) {
    const t = start.getTime() + i * 86400000;
    if (!trainingstage[i]) { tage.push({ts:t, pid:null, type:null, erledigt:i === 0 && heuteSchon}); continue; }
    const by = muscleMap(muscleState(t, geplant));

    let best = null;
    Object.keys(plans()).forEach(pid => {
      if (planOf(pid).noSuggest) return;
      const share = planShare(pid);
      let frische = 0;
      MUSCLES.forEach(m => {
        const anteil = share[m] || 0;
        if (anteil) frische += anteil * (1 - Math.min(1, by[m].ratio));
      });
      /* Rueckstand zaehlt gegenueber der echten und der geplanten Historie. */
      let letzte = null;
      S.sessions.concat(geplant).forEach(s => {
        if (s.plan !== pid) return;
        const st = sessionTime(s);
        if (st <= t && (letzte === null || st > letzte)) letzte = st;
      });
      const rueckstand = letzte === null ? 1 : Math.min(1, (t - letzte) / 86400000 / 10);
      const score = 0.7 * frische + 0.3 * rueckstand;
      if (!best || score > best.score) best = {pid:pid, score:score, frische:frische};
    });

    /* Ist nichts ausreichend erholt, ist der ehrliche Vorschlag: nichts. */
    if (best && best.frische >= 0.55) {
      tage.push({ts:t, pid:best.pid, type:planOf(best.pid).type});
      geplant.push(plannedSession(best.pid, t));
    } else {
      tage.push({ts:t, pid:null, type:null});
    }
  }
  return tage;
}

function recommend(){
  const st = muscleState();
  const by = muscleMap(st);
  const form = formForToday();
  const lvl = form ? form.level : null;

  const sys = systemLoad();

  if (lvl === "rot") {
    return {kind:"rest", level:lvl, form:form, state:st, sys:sys,
      why:"Du hast heute wenig Energie, schlechten Schlaf oder starke Erschöpfung angegeben. "
        + "Ein Ruhetag oder lockere Bewegung bringt dich weiter als eine erzwungene Einheit."};
  }

  /* Die Muskeln koennen erholt sein und der Kopf trotzdem leer. Diese Lage
     kommt ohne rote Tagesform aus — mehrere schwache Anzeichen zusammen
     reichen. Wer hier weitertrainiert, sammelt Einheiten statt Fortschritt. */
  if (sys.level === "hoch") {
    return {kind:"rest", level:lvl, form:form, state:st, sys:sys,
      why:"Mehrere Zeichen sprechen für eine Pause: " + sys.gruende.join(", ") + ". "
        + "Das Nervensystem trägt alles zusammen, nicht je Muskelgruppe — "
        + "ein Tag Pause bringt hier mehr als eine weitere Einheit."};
  }

  const lastLift = S.sessions.slice().reverse().find(s => s.kind === "lift");
  let best = null;

  /* Zwei Groessen entscheiden, beide auf 0..1 normiert:
     frische  — wie erholt die Muskeln sind, die der Plan trifft
     rueckstand — wie lange der Plan her ist, gesaettigt nach 10 Tagen

     Wichtig: sind alle Muskeln erholt, ist "frische" fuer jeden Plan gleich 1
     (die Anteile summieren sich zu 1). Dann entscheidet allein der Rueckstand —
     also der Plan, der am laengsten liegen geblieben ist. Genau das erwartet man.
     Der fruehere Wochentags-Bonus ist raus: er hat in exakt dieser Lage den
     Kalender wieder bestimmen lassen, was v3 ja gerade abschaffen sollte. */
  const stale = muscleStale();
  Object.keys(plans()).forEach(pid => {
    if (planOf(pid).noSuggest) return;
    const share = planShare(pid);
    let frische = 0, vernachlaessigt = 0;
    MUSCLES.forEach(m => {
      const s = share[m] || 0;
      if (!s) return;
      frische += s * (1 - Math.min(1, by[m].ratio));
      vernachlaessigt += s * Math.min(1, stale[m] / 14);
    });
    const rueckstand = Math.min(1, daysSincePlan(pid) / 21);
    let score = 0.55 * frische + 0.25 * rueckstand + 0.20 * vernachlaessigt;
    if (lastLift && lastLift.plan === pid) score -= 0.3;
    if (!best || score > best.score) best = {pid:pid, score:score};
  });

  if (!best) return {kind:"rest", level:lvl, form:form, state:st, sys:sys, why:"Kein Plan vorhanden."};

  /* Stimmt die Aussage "am laengsten her" wirklich? Nur dann sagen wir es. */
  const alle = Object.keys(plans());
  const maxTage = Math.max.apply(null, alle.map(daysSincePlan));
  const istAeltester = alle.length > 1 && daysSincePlan(best.pid) >= maxTage - 0.01;

  return {
    kind:"plan", planId:best.pid, level:lvl, form:form, state:st, sys:sys,
    why:reasonFor(best.pid, st, istAeltester),
    hint: lvl === "gelb"
      ? "Tagesform gedämpft: einen Satz weniger pro Übung und nicht bis ans Muskelversagen."
      /* Ohne die Aufzaehlung: die Gruende stehen einen Tipp entfernt im
         Nervensystem-Blatt, und die Erholung steht als Zahl schon oben im
         Kopf. Hier zaehlt nur, was das fuer die naechste Stunde heisst. */
      : sys.level === "erhoeht"
      ? "Erhöhte Grundbelastung. Heute nicht bis ans Muskelversagen."
      : null
  };
}

/* Belt maths: which plates make up a target, from what is actually owned. */
function plateHint(target){
  const inv = (S.settings.plates || []).slice().sort((a,b) => b-a);
  let rest = target, used = [];
  inv.forEach(p => { while (rest >= p - 0.001) { used.push(p); rest -= p; } });
  return {plates:used, rest:Math.round(rest*100)/100};
}

const app = document.getElementById("app");

/* Die Einblend-Animation darf nur bei einem echten Ansichtswechsel laufen.
   Sonst zuckt die ganze Seite bei jedem Tippen, weil render() alles neu baut. */
let lastViewKey = null;
/* Zahlen laufen beim Ansichtswechsel hoch. Kein Markup noetig: gesucht werden
   die Stellen, an denen ohnehin nur eine ganze Zahl steht. render() bleibt
   synchron — das Hochzaehlen laeuft danach ueber die Bildwiederholung. */
function countUp(root){
  root.querySelectorAll(".hs-v, .stat .big").forEach(el => {
    const node = el.firstChild;
    if (!node || node.nodeType !== 3) return;
    const text = node.nodeValue.trim();
    if (!/^\d+$/.test(text)) return;
    const ziel = +text;
    if (ziel < 2) return;                       /* unter zwei lohnt es nicht */
    const dauer = Math.min(850, 280 + ziel * 40);
    /* Die Null wird erst im ersten Bild gesetzt, nicht vorher. Laeuft die
       Bildwiederholung nicht — Seite im Hintergrund, gedrosselte Webansicht,
       Testbrowser —, bleibt schlicht die richtige Zahl stehen. Andersherum
       stuende dort fuer immer eine Null. */
    let start = 0;
    const schritt = jetzt => {
      if (!start) start = jetzt;
      const p = Math.min(1, (jetzt - start) / dauer);
      node.nodeValue = String(Math.round(ziel * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(schritt);
    };
    requestAnimationFrame(schritt);
  });
}

const setHTML = (html, flat, key) => {
  const fresh = key !== lastViewKey;
  lastViewKey = key;
  app.innerHTML = '<div class="wrap'+(flat?" flat":"")+(fresh?" anim":"")+'">' + html + '</div>';
  if (fresh) countUp(app);
};
const toTop = () => { scroller.scrollTop = 0; };

const MONATE = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

/* Zeitreihe zu einem Ziel — aber nur, was mit dem heutigen Aufbau
   vergleichbar ist. Wer eine Uebung umstellt (je Seite, exzentrische
   Unterstuetzung), faengt eine neue Reihe an. Sonst liest sich eine
   Umstellung wie ein Einbruch: im echten Verlauf steht Bankdruecken einmal
   mit 55 kg und danach mit 20 kg je Seite plus 7 kg exzentrisch — fuer eine
   Trendlinie waeren das 24 Prozent Rueckschritt, tatsaechlich ist es eine
   andere Uebung. */
function goalSeries(g){
  const punkte = [];
  S.sessions.forEach(s => s.entries.forEach(e => {
    if (goalEx(g).indexOf(e.id) < 0 || !e.reps.length) return;
    /* Zusatzgewicht macht den Satz schwerer, nicht leichter — er zaehlt mit. */
    /* Lastziele: nur Saetze, die die geforderte Laenge erreicht haben. */
    if (g.kind === "load" && Math.max.apply(null, e.reps) < goalReps(g)) return;
    punkte.push({
      t: sessionTime(s),
      wert: g.kind === "reps" ? Math.max.apply(null, e.reps)
                              : (e.perSide ? e.weight * 2 : +e.weight || 0),
      perSide: !!e.perSide, ecc: +e.ecc || 0
    });
  }));
  punkte.sort((a, b) => a.t - b.t);
  if (!punkte.length) return [];
  const heutigerAufbau = punkte[punkte.length - 1];
  return punkte.filter(p => p.perSide === heutigerAufbau.perSide && p.ecc === heutigerAufbau.ecc);
}

/* Wie oft diese Uebung tatsaechlich drankommt, in Einheiten pro Tag. */
function exFrequency(exId){
  const jetzt = Date.now();
  const treffer = S.sessions.filter(s => jetzt - sessionTime(s) <= 42 * 86400000
    && (s.entries || []).some(e => e.id === exId && e.reps.length));
  if (!treffer.length) return 0;
  const aeltest = Math.min.apply(null, treffer.map(sessionTime));
  const spanne = Math.max(7, (jetzt - aeltest) / 86400000 + 1);
  return treffer.length / spanne;
}

/* Termin fuer eine Etappe.
   Es wird immer etwas gesagt — auch am ersten Tag. Nur woher die Steigung
   kommt, aendert sich:

   wenig Daten  → Erwartung aus dem Plan. Die App erhoeht nach jeder Einheit
                  um die Schrittweite der Uebung; mal der tatsaechlichen
                  Haeufigkeit ergibt das einen Zuwachs pro Tag.
   viele Daten  → gemessene Ausgleichsgerade durch den echten Verlauf.

   Dazwischen wird gemischt, mit steigendem Gewicht auf der Messung. Die
   Prognose ist damit von Anfang an da und wird mit jeder Einheit schaerfer,
   statt bis zu einer willkuerlichen Schwelle zu schweigen. */
function goalForecast(g, ziel, standVon){
  const p = goalSeries(g);
  const stand = standVon !== undefined ? standVon
                : (p.length ? p[p.length - 1].wert : 0);
  const n = p.length;

  /* Erwartung aus dem Plan. Bei Wiederholungen gibt es keine Schrittweite —
     eine Wiederholung alle drei Einheiten ist der Anfangswert, den die
     Messung spaeter ersetzt. */
  const proEinheit = g.kind === "reps" ? 1/3 : (incOf(g.ex) || 1);
  const erwartet = proEinheit * (goalEx(g).reduce((m, id) => Math.max(m, exFrequency(id)), 0) || 2/7);

  /* Gemessene Steigung, sobald zwei vergleichbare Punkte ueber mindestens
     einem Tag liegen. */
  let gemessen = null;
  if (n >= 2) {
    const spanne = (p[n-1].t - p[0].t) / 86400000;
    if (spanne >= 1) {
      const x = p.map(q => (q.t - p[0].t) / 86400000);
      const y = p.map(q => q.wert);
      const mx = x.reduce((a,b) => a+b, 0) / n;
      const my = y.reduce((a,b) => a+b, 0) / n;
      let zaehler = 0, nenner = 0;
      for (let i = 0; i < n; i++) { zaehler += (x[i]-mx)*(y[i]-my); nenner += (x[i]-mx)*(x[i]-mx); }
      if (nenner) gemessen = zaehler / nenner;
    }
  }

  /* Ab sechs vergleichbaren Einheiten zaehlt allein die Messung. */
  const gewicht = Math.max(0, Math.min(1, (n - 1) / 5));
  const proTag = gemessen === null ? erwartet : gemessen * gewicht + erwartet * (1 - gewicht);

  const guete = n >= 6 ? "prognose" : n >= 3 ? "schaetzung" : "grob";
  /* Ohne einen einzigen Satz, der den Standard erfuellt, gibt es keinen
     Ausgangspunkt. Der Abstand ist dann nicht in Kilo zu messen, sondern in
     Wiederholungen — eine Hochrechnung waere hier schlicht falsch. */
  if (!n) return {guete:guete, punkte:0, keineBasis:true};
  if (!(proTag > 0)) return {guete:guete, punkte:n, steigend:false, proTag:proTag};

  const tage = (ziel - stand) / proTag;
  if (!isFinite(tage) || tage <= 0) return {guete:guete, punkte:n, steigend:true, proTag:proTag, tage:0};
  if (tage > 3 * 365) return {guete:guete, punkte:n, steigend:true, proTag:proTag, zuWeit:true};
  return {guete:guete, punkte:n, steigend:true, proTag:proTag, tage:Math.round(tage),
          datum:new Date(Date.now() + tage * 86400000)};
}

/* Kurze Zeitangabe fuer die Fusszeile. Wie belastbar sie ist, sagt die
   Farbe — der Zusatz stuende sonst zweimal untereinander. */
function goalWhen(g, ziel, standVon){
  const f = goalForecast(g, ziel, standVon);
  const reif = f.guete !== "grob";
  if (f.keineBasis) {
    return {text: g.kind === "load" ? "erst ab " + goalReps(g) + " Wdh." : "noch keine Daten", reif:false};
  }
  if (!f.steigend) return {text:"kein Anstieg messbar", reif:false};
  if (f.zuWeit) return {text:"über drei Jahre", reif:reif};
  if (f.tage <= 0) return {text:"erreicht", reif:reif};
  if (f.tage < 70) { const w = Math.max(1, Math.round(f.tage / 7));
    return {text:"in " + w + (w === 1 ? " Woche" : " Wochen"), reif:reif}; }
  return {text:MONATE[f.datum.getMonth()] + " " + f.datum.getFullYear(), reif:reif};
}

/* Tempo: wie schnell es auf das Ziel zugeht, und ob das zuletzt schneller
   oder langsamer wurde. Die Richtung ist der Teil, den man beeinflussen kann
   — sie faellt beim Auslassen sofort ab und zieht bei Serien wieder an.
   Verglichen wird die zweite Haelfte der Reihe mit der ersten; unter vier
   Punkten gibt es dafuer keine Grundlage. */
function goalPace(g, standVon){
  const f = goalForecast(g, g.steps[g.steps.length-1], standVon);
  if (f.keineBasis || !(f.proTag > 0)) return null;
  const proWoche = f.proTag * 7;
  const text = (g.kind === "reps" ? (Math.round(proWoche * 10) / 10) : kg(Math.round(proWoche * 10) / 10))
             + " " + g.unit + " / Woche";

  let richtung = null;
  const p = goalSeries(g);
  if (p.length >= 4) {
    const mitte = Math.floor(p.length / 2);
    const steig = teil => {
      const n = teil.length;
      if (n < 2) return null;
      const x = teil.map(q => q.t / 86400000), y = teil.map(q => q.wert);
      const mx = x.reduce((a,b)=>a+b,0)/n, my = y.reduce((a,b)=>a+b,0)/n;
      let z = 0, nn = 0;
      for (let i = 0; i < n; i++) { z += (x[i]-mx)*(y[i]-my); nn += (x[i]-mx)*(x[i]-mx); }
      return nn ? z/nn : null;
    };
    const frueh = steig(p.slice(0, mitte + 1)), spaet = steig(p.slice(mitte));
    if (frueh !== null && spaet !== null && frueh > 0) {
      richtung = spaet > frueh * 1.1 ? "schneller" : spaet < frueh * 0.9 ? "langsamer" : "gleichbleibend";
    }
  }
  return {text:text, richtung:richtung};
}

/* Passt der Plan ueberhaupt zum Ziel?
   Ein Lastziel mit zehn Wiederholungen ist unerreichbar, wenn die Uebung im
   Plan nur mit zwei bis fuenf steht — dann kann man jahrelang trainieren,
   ohne dass sich am Ziel je etwas bewegt. Dasselbe gilt fuer ein
   Wiederholungsziel, dessen erste Etappe ueber der geplanten Satzlaenge
   liegt. Die App sagt das jetzt, statt es den Nutzer merken zu lassen. */
function goalPlanFit(g){
  const noetig = g.kind === "load" ? goalReps(g) : g.steps[0];
  let hoechste = 0, kommtVor = false;
  Object.keys(plans()).forEach(pid => {
    (planOf(pid).ex || []).forEach(e => {
      if (goalEx(g).indexOf(e.id) < 0) return;
      kommtVor = true;
      hoechste = Math.max(hoechste, +e.max || +e.min || 0);
    });
  });
  if (!kommtVor) return {text:"Kommt in keinem Plan vor"};
  if (hoechste < noetig) {
    return {text:"Plan sieht nur bis " + hoechste + " Wdh. vor — Ziel verlangt " + noetig};
  }
  return null;
}

function goalsCard(pr){
  return '<div class="card">' + GOALS.map((g, gi) => {
    const st = goalStep(g, pr);
    const wert = st.value;

    /* Eine Spur je Etappe. Die Fuellung einer Spur ist der Anteil, der von
       der vorigen Etappe bis zu dieser geschafft ist. */
    let vorher = 0;
    const spuren = g.steps.map((stufe, si) => {
      const anteil = Math.max(0, Math.min(1, (wert - vorher) / (stufe - vorher)));
      const laufend = anteil > 0 && anteil < 1;
      vorher = stufe;
      const verzoegerung = (gi * 0.09 + si * 0.07).toFixed(2);
      return '<div class="g2seg'+(anteil >= 1 ? " voll" : laufend ? " jetzt" : "")+'">'
        + '<i style="width:'+(anteil * 100).toFixed(1)+'%;--d:'+verzoegerung+'s"></i></div>';
    }).join("");

    const tempo = goalPace(g, st.value);
    const passt = goalPlanFit(g);
    const marken = g.steps.map(s => '<span>'+s+'</span>').join("");
    /* Je Zeile: was, wie viel, wann. Eine belastbare Angabe leuchtet, eine
       grobe tritt zurueck. */
    const zeile = (was, ziel) => {
      const w = goalWhen(g, ziel, st.value);
      return '<div class="g2row"><span class="g2lbl">'+was+'</span>'
        + '<span class="g2zt">'+ziel+' '+g.unit
        + (g.kind === "load" ? ' × '+goalReps(g)+' Wdh.' : '')+'</span>'
        + '<span class="g2when'+(w.reif ? " reif" : "")+'">'+w.text+'</span></div>';
    };

    /* Die Bewegung, um die es geht — als Zeichnung neben der Leiter. Ohne sie
       stand hier eine Tabelle aus Zahlen; jetzt sieht man auf einen Blick,
       welches Ziel welches ist. Die Uebergaenge laufen bewusst versetzt: alle
       sieben Figuren im Gleichtakt saehen aus wie ein Fehler. Ist die Etappe
       erreicht, faerbt die Figur mit ein (`on`), genau wie die laufende Spur. */
    const zielEx = Array.isArray(g.ex) ? g.ex[0] : g.ex;
    const bild = exArt(zielEx, 46, 61, st.done ? "on" : "");

    return '<div class="goal2" data-a="goalzoom" data-id="'+gi+'">'
      + '<div class="g2top">'
      + (bild ? '<div class="g2art" style="--v:'+(gi * 0.31).toFixed(2)+'s">'+bild+'</div>' : '')
      + '<div class="g2main">'
      + '<div class="g2head"><span class="g2name">'+g.label+'</span>'
      + '<span class="g2val'+(st.done ? " amber" : "")+'">'+kg(wert)+'<small>'+g.unit+'</small></span></div>'
      + '<div class="g2track">'+spuren+'</div>'
      + '<div class="g2marks">'+marken+'</div>'
      + '</div></div>'
      + '<div class="g2foot">' + zeile('Nächste Etappe', st.target, st.target)
      + (st.final !== st.target ? zeile('Endziel', st.final, st.final) : '')
      + (tempo ? '<div class="g2row"><span class="g2lbl">Tempo</span>'
                 + '<span class="g2zt">'+tempo.text+'</span>'
                 + (tempo.richtung ? '<span class="g2when '+tempo.richtung+'">'+tempo.richtung+'</span>' : '')
                 + '</div>' : '')
      + (passt ? '<div class="g2row g2warn"><span>'+passt.text+'</span></div>' : '')
      + '</div></div>';
  }).join("")
  + '<div class="g2note">Zeitangaben sind Schätzungen und werden mit jeder '
  + 'Einheit genauer. Grau heißt: noch wenig Verlauf.</div></div>';
}

const LV_RGB = {
  gruen:[94,158,118], gelb:[233,166,60], rot:[201,106,90], neutral:[118,126,138]
};
const rgbCss = a => 'rgb('+a[0]+','+a[1]+','+a[2]+')';

function silhouette(st, kompakt){
  const by = muscleMap(st);
  /* Feste Reihenfolge der Gruppen ergibt eine gleichbleibende Staffelung —
     die Karte leuchtet immer im selben Rhythmus auf. */
  const order = Object.keys(by);
  const paint = list => list.map(p => {
    const rgb = p[0] === "neutral" ? LV_RGB.neutral : LV_RGB[by[p[0]].level];
    if (p[0] === "neutral") return '<path d="'+p[1]+'" fill="'+rgbCss(rgb)+'" fill-opacity=".5"/>';
    const delay = (0.05 + Math.max(0, order.indexOf(p[0])) * 0.055).toFixed(3);
    return '<path class="mg" style="--d:'+delay+'s" d="'+p[1]+'" fill="'+rgbCss(rgb)+'"/>';
  }).join("");

  const figure = (list, box) =>
    '<svg viewBox="'+box+'" aria-hidden="true">' + paint(list) + '</svg>';

  const front = figure(BODY_FRONT, "0 0 35 93");
  const back = figure(BODY_BACK, "37 0 35 93");

  return '<div class="bodies'+(kompakt ? " klein" : "")+'">'
    + '<div class="body">' + front + '<div class="cap">Vorn</div></div>'
    + '<div class="body">' + back + '<div class="cap">Hinten</div></div>'
    + '</div>'
    + '<div class="legend" style="margin-top:14px">'
    + '<span><i class="dotlv lv-gruen"></i>erholt</span>'
    + '<span><i class="dotlv lv-gelb"></i>teilweise</span>'
    + '<span><i class="dotlv lv-rot"></i>stark belastet</span>'
    + '</div>'
    + '<details class="more"><summary><span>Einzelne Muskelgruppen</span></summary>'
    + '<div class="mlist">'
    /* Sortiert nach Vernachlaessigung, nicht nach Belastung: was oben steht,
       ist das, was als naechstes drankommen sollte. Die Belastung selbst zeigt
       schon die Figur darueber. */
    + st.slice().sort((a,b) => (b.tage >= 99 ? -1 : b.tage) - (a.tage >= 99 ? -1 : a.tage)).map(x =>
        '<div class="mrow"><i class="dotlv lv-'+x.level+'"></i>'
        + '<span class="nm2">'+x.label+'</span>'
        + (x.stale === "brach" ? '<span class="stag brach">Vernachlässigt</span>'
         : x.stale === "faellig" ? '<span class="stag faellig">Fällig</span>'
         : x.stale === "neu" ? '<span class="stag neu">Noch nie</span>' : '')
        + '<span class="when">'+(x.last ? agoPhrase(x.last) : "noch nie")+'</span>'
        + '<span class="mbar"><i style="width:'+Math.min(100, Math.round(x.ratio*100))+'%;background:var(--lv-'+x.level+')"></i></span>'
        + '</div>').join("")
    + '</div></details>';
}

/* Geschaetzte Dauer eines Plans in Minuten.
   Je Satz: rund 20 Sekunden Vorbereitung plus drei Sekunden je Wiederholung,
   dazu die Pause nach jedem Satz ausser dem letzten der Einheit. Der Wert ist
   ein Sollwert, kein Mittel aus dem Verlauf — der Verlauf enthaelt genau die
   Handypausen, die hier vermieden werden sollen. */
function planDuration(pid){
  const pl = planOf(pid);
  if (!pl) return 0;
  let sek = 0, saetze = 0;
  (pl.ex || []).forEach(e => {
    const n = Math.max(1, +e.sets || 3);
    const wdh = e.total ? Math.round((e.total[0] + e.total[1]) / 2 / n) : ((+e.min || 8) + (+e.max || 10)) / 2;
    /* Bei Zeituebungen ist die Zahl schon die Dauer — sie mit drei Sekunden je
       Wiederholung zu multiplizieren machte aus einem Satz Haengen zwei
       Minuten. */
    sek += n * (20 + (istZeit(e.id) ? wdh : wdh * 3)) + n * restFor(e.id);
    saetze += n;
  });
  sek -= restFor((pl.ex[pl.ex.length-1] || {}).id);      /* nach dem letzten Satz keine Pause */
  return {minuten: Math.round(sek / 60), saetze: saetze};
}

function viewHeute(){
  const now = new Date();
  const rec = recommend();
  const doneToday = S.sessions.some(s => s.date === dayKey(now));
  const pr = prsFrom(S.sessions);
  const form = rec.form;
  const recPlan = rec.kind === "plan" ? planOf(rec.planId) : null;

  /* Die Empfehlung als Kopfzeile, das Wort selbst gross: "Heute empfohlen" in
     einer Zeile mit dem Typ waere zweizeilig und wuerde alles nach unten druecken. */
  const detail = recPlan ? recPlan.title.replace(/^[^·]*·\s*/, "") : "";
  /* Die Erholung steht neben dem Titel, nicht in einer eigenen Karte weiter
     unten. Sie ist der einzige gemessene Wert, den die App hat, und die Frage,
     mit der man die App morgens aufmacht — sie darf nicht unter drei Knoepfen
     liegen. Der Ring braucht dafuer keine eigene Flaeche: er nutzt den Platz,
     der neben einem kurzen Wort wie "Push" ohnehin leer war. */
  const erh = erholung();
  const ers = erh ? null : erholungErsatz();
  let h = '<div class="hero"><div class="meta">'
    + DAYS[now.getDay()] + '<i></i>KW ' + isoWeek(now) + '<i></i>Heute empfohlen'
    + '</div><div class="herotop"><div class="herotitle">'
    + '<div class="title '
    + (recPlan ? (recPlan.type==="Beine"?"amber":recPlan.type==="Pull"?"cool":"") : "muted") + '">'
    + (recPlan ? esc(recPlan.type) : 'Pause')
    + '</div>'
    /* Untertitel nur, wenn er etwas hinzufuegt: bei "Ganzkoerper" ist der Titel
       schon der Typ, dann stuende das Wort sonst zweimal untereinander. */
    + (recPlan && detail && detail !== recPlan.type ? '<div class="sub">'+esc(detail)+'</div>' : '')
    + '</div>'
    /* Steht Health zur Verfuegung, steht hier immer etwas: entweder die Zahl
       oder der Grund, warum es sie nicht gibt. Ein leerer Platz an dieser
       Stelle liest sich als kaputt. */
    /* Drei Zustaende: die volle Schaetzung mit Zahl, die Ersatzampel ohne
       Zahl (dann fehlt die HRV), oder der Strich mit dem Grund. */
    + (erh
        ? '<button class="erhmini" data-a="erhsheet">' + erhRing(erh.score, erh.ampel, 58)
          + '<span class="erhminilbl">'+esc(erh.wort)+'<i>geschätzt</i></span></button>'
        : ers
          ? '<button class="erhmini" data-a="erhsheet">' + erhRing(null, ers.ampel, 58)
            + '<span class="erhminilbl">'+esc(ers.wort)+'<i>geschätzt</i></span></button>'
          : healthPossible()
            ? '<button class="erhmini" data-a="erhsheet">'
              + erhRing(null, null, 58)
              + '<span class="erhminilbl">Kein Wert<i>warum?</i></span></button>'
            : '')
    + '</div>'
    + heroStats()
    + '</div>';

  if (!storageOk) h += '<div class="banner warn">'+I.info+'<span>Der Browser speichert gerade nichts – im privaten Modus bleibt nichts erhalten. Öffne die App normal oder sichere über Mehr › Backup.</span></div>';

  /* Empfehlung mit Begruendung — der Kern der Startseite */
  h += '<div class="card stack">'
    + '<div class="recbox">'
    + (recPlan
        ? '<button class="artbtn" data-a="artzoom" data-id="'+recPlan.ex[0].id+'">'
          + exIcon(recPlan.ex[0].id, 66, 88) + '</button>'
        : '<div class="glyph">'+I.timer+'</div>')
    + '<div style="flex:1"><div class="lead">'+esc(rec.why)+'</div>'
    + (rec.hint ? '<div class="banner amber" style="margin:13px 0 0">'+I.info+'<span>'+esc(rec.hint)+'</span></div>' : '')
    + '</div></div>'
    + '<div class="hair"></div>'
    /* Zwei Zeilen, aber ein Block: die Tagesform ist die Frage von heute, das
       Nervensystem die Summe der letzten Tage. Ohne den Abstand stossen die
       beiden Kapseln aneinander und lesen sich als eine kaputte Form. */
    /* Nebeneinander statt untereinander: zwei volle Zeilen mit je einer
       Beschriftung links und einer Kapsel rechts haben 40 px gekostet und
       dabei nichts gesagt, was die Kapsel nicht selbst sagt. */
    + '<div class="statduo">'
    /* Immer ein Knopf, auch wenn heute schon etwas eingetragen ist. Vorher war
       die Zeile danach nur noch Text — und damit war die eigene Tagesform fuer
       den Rest des Tages unveraenderbar. Wer sich morgens mies fuehlt und
       mittags besser, muss das nachtragen koennen. */
    + '<button class="stitem" data-a="formask"><span class="slabel">Tagesform</span>'
    + '<span class="sval">'
    + (form
        ? '<i class="dotlv lv-'+form.level+'"></i>'
          + (form.level === "gruen" ? "Normal" : form.level === "gelb" ? "Zurückstecken" : "Ruhetag")
        : '<i class="dotlv" style="background:var(--lv-none)"></i>Offen')
    + '</span></button>'
    /* Antippbar, weil "gefordert" ohne die Gruende eine Behauptung waere. */
    + '<button class="stitem" data-a="sysinfo"><span class="slabel">Nervensystem</span>'
    + '<span class="sval"><i class="dotlv lv-'
    + (rec.sys.level === "hoch" ? "rot" : rec.sys.level === "erhoeht" ? "gelb" : "gruen")
    + '"></i>' + esc(rec.sys.kurz) + '</span></button>'
    + '</div></div>';

  /* Was die Nacht meldet, gehoert vor die Knoepfe: es aendert, welchen man
     drueckt. Die Kacheln mit den Einzelwerten stehen weiter unten — die sind
     Beleg, nicht Entscheidung. */
  h += warnKarten();

  /* Der Weg ins Training steht vor der Auswertung: erst handeln, dann
     nachsehen. Frueher stand er ganz unten, hinter Muskelkarte und Vorschau. */
  /* Ein Weg fuehrt ins Training, die beiden anderen tragen etwas nach. Sie
     deshalb nebeneinander und schmaler: drei gleich grosse Knoepfe
     untereinander haben behauptet, alle drei seien gleich wichtig — und
     dabei die halbe erste Bildschirmhoehe gekostet. */
  h += '<div class="stack">'
    + '<button class="btn" data-a="choose">Training auswählen</button>'
    + '<div class="btnrow">'
    + '<button class="btn ghost sm" data-a="boxask">Boxen</button>'
    + '<button class="btn ghost sm" data-a="restask">Pause</button>'
    + '</div>'
    + (doneToday ? '<div class="note" style="padding:12px 4px 0">Heute ist schon etwas eingetragen. Eine zweite Einheit ist trotzdem möglich.</div>' : '')
    + '</div>';

  /* Muskelgruppen-Ampel, kompakt — die volle Hoehe zweier Figuren hat die
     Startseite frueher zur Haelfte gefuellt. */
  /* Was zu lange nichts gesehen hat. Erholt zu sein ist kein Ziel — es ist nur
     die Voraussetzung dafuer, wieder dranzukommen. Ohne diese Zeile faellt
     eine Gruppe, die kein Plan gerade trifft, still hinten runter. */
  /* Nach Dauer sortiert und auf drei begrenzt: fuenf Gruppen in einem Satz
     liest keiner zu Ende, und die laengste Pause ist ohnehin die, die zaehlt. */
  const kuerzen = list => list.length <= 3 ? joinNames(list)
    : list.slice(0, 3).map(x => x.label).join(", ") + " und " + (list.length - 3) + " weitere";
  const brach = rec.state.filter(x => x.stale === "brach").sort((a, b) => b.tage - a.tage);
  const faellig = rec.state.filter(x => x.stale === "faellig").sort((a, b) => b.tage - a.tage);
  h += healthKarte();

  h += '<div class="stack"><div class="eyebrow"><span>Beanspruchte Muskelgruppen</span>'
    + '<span class="faint">' + rec.state.filter(x => x.level === "rot").length + ' belastet</span></div>'
    + '<div class="card">' + silhouette(rec.state, true) + '</div>'
    + (brach.length
        ? '<div class="banner warn" style="margin-top:12px">'+I.info+'<span>'
          + kuerzen(brach) + ' seit ' + Math.round(Math.min.apply(null, brach.map(x => x.tage)))
          + ' Tagen ohne Reiz. Nach etwa einer Woche hält man den Stand nur noch.</span></div>'
        : faellig.length
        ? '<div class="banner amber" style="margin-top:12px">'+I.info+'<span>'
          + kuerzen(faellig) + ' wäre wieder dran.</span></div>'
        : '')
    + '</div>';

  /* Die Daten liegen nur auf diesem Geraet. Ohne Erinnerung faellt ein fehlendes
     Backup erst auf, wenn es zu spaet ist. */
  const bTage = backupAlter();
  if (bTage !== null && bTage >= 30 && S.sessions.length >= 3) {
    h += '<div class="banner warn">'+I.info+'<span>'
      + (bTage >= 900 ? 'Du hast noch nie ein Backup gezogen.'
                      : 'Letztes Backup vor ' + bTage + ' Tagen.')
      + ' Deine Daten liegen nur auf diesem Gerät. '
      + '<button class="tag" data-a="export" style="margin-left:6px">Jetzt sichern</button></span></div>';
  }

  if (S.makeup.length) {
    h += '<div class="banner amber">'+I.swap+'<span>Nachzuholen: '
      + S.makeup.map(m => esc(exName(m.id))+' <span class="muted">('+dateShort(m.date)+')</span>').join(", ")
      + '</span></div>';
  }

  if (summary) {
    h += '<div class="card stack" style="border-color:var(--on-line)">'
      + '<div class="row" style="margin-bottom:15px"><div style="font-size:16px;font-weight:640;letter-spacing:-.02em">Nächstes Mal</div>'
      + '<button class="rb xs" data-a="closesum">'+I.x+'</button></div>'
      + (summary.prs.length ? '<div class="banner amber" style="margin:0 0 12px">'+I.trophy+'<span>Neuer Rekord: '+esc(summary.prs.join(", "))+'</span></div>' : '')
      + (summary.duel !== null ? '<div class="banner amber" style="margin:0 0 12px">'+I.bolt
          + '<span>'+(summary.duel >= 0 ? '+' : '')+summary.duel+' % Tonnage gegenüber dem letzten '+esc(summary.planTitle)+'</span></div>' : '')
      + summary.changes.map(c => '<div class="exrow"><div class="body"><div class="nm">'+esc(exName(c.id))+'</div>'
        + '<div class="sc">'+esc(c.why)+'</div></div><div class="num '+(c.to!==c.from?"amber":"muted")+'" style="font-size:14px">'
        + (c.to !== c.from ? kg(c.from)+' → '+kg(c.to) : kg(c.to)) + ' kg</div></div>').join("")
      + '</div>';
  }

  return h;
}
