function importSheet(data){
  const mine = S.sessions.length, theirs = (data.sessions||[]).length;
  openSheet('<h3>Backup einspielen</h3>'
    + '<div class="sh-sub">'+theirs+' Einheiten in der Datei, '+mine+' auf diesem Gerät.</div>'
    + '<button class="btn" data-a="impmerge">Zusammenführen</button>'
    + '<div class="note" style="padding:9px 4px 14px">Fügt nur hinzu, was hier fehlt. Nichts geht verloren.</div>'
    + '<button class="btn ghost" data-a="impreplace">Ersetzen</button>'
    + '<div class="note" style="padding:9px 4px 0">Verwirft alles auf diesem Gerät.</div>'
    + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {data:data});
}

/* =============================================================== actions */
function startSession(id, extra){
  const p = planOf(id), sets = {}, weights = {}, cf = {};
  const list = p.ex.slice();
  (extra || []).forEach(m => { if (!list.some(x => x.id === m.id)) list.push({id:m.id, sets:3, min:6, max:10}); });
  list.forEach(e => {
    sets[e.id] = [];
    for (let i = 0; i < e.sets; i++) sets[e.id].push({reps:e.max, done:false});
    weights[e.id] = S.weights[e.id] || 0;
    cf[e.id] = cfgOf(e.id);
  });
  /* extras are appended to the plan copy for this session only */
  if (extra && extra.length) {
    S.plans = S.plans || JSON.parse(JSON.stringify(DEFAULT_PLANS));
  }
  /* startedAt bleibt leer: die Einheit ist geoeffnet, aber nicht gestartet.
     Vorher lief die Uhr, sobald man nur nachsehen wollte, welche Uebungen
     anstehen — im echten Verlauf standen dadurch 186, 128 und 103 Minuten. */
  S.active = {plan:id, extra:(extra||[]).map(m => m.id), startedAt:0,
              sets:sets, weights:weights, cfg:cf, skipped:{}};
  S.rest = null;
  keepAwake(true);
  save(); render(); toTop();
}

function activeExList(){
  const a = S.active, p = planOf(a.plan);
  /* Ein Tausch gilt nur fuer diese Einheit — der Plan bleibt, wie er ist.
     Die neue Uebung erbt Satzzahl und Wiederholungsbereich der alten: es ist
     derselbe Programmpunkt, nur anders ausgefuehrt. Wer statt Schraegbank-
     druecken Schraegbank-Fliegende macht, macht keine andere Einheit. */
  const ers = a.ersatz || {};
  const list = p.ex.map(e => ers[e.id]
    ? Object.assign({}, e, {id: ers[e.id], statt: e.id})
    : e);
  (a.extra || []).forEach(id => { if (!list.some(x => x.id === id)) list.push({id:id, sets:3, min:6, max:10}); });
  return list;
}

/* Eine Uebung der laufenden Einheit gegen eine andere tauschen.
   Die Saetze der alten bleiben unangetastet stehen, falls sie schon
   angefangen war — sie zaehlen dann fuer die neue, denn getauscht wird
   ueblicherweise vor dem ersten Satz. Ist schon etwas abgehakt, warnt das
   Blatt davor. */
function tauscheUebung(altId, neuId){
  const a = S.active;
  if (!a || altId === neuId) return;
  /* Auf die urspruengliche Uebung des Plans zurueckrechnen: wer zweimal
     tauscht, soll nicht eine Kette aus Ersetzungen erzeugen. */
  const p = planOf(a.plan);
  const ers = a.ersatz || {};
  const wurzel = p.ex.some(e => e.id === altId)
    ? altId
    : Object.keys(ers).find(k => ers[k] === altId) || altId;

  const alteSaetze = a.sets[altId] || [];
  a.ersatz = ers;
  if (neuId === wurzel) delete a.ersatz[wurzel]; else a.ersatz[wurzel] = neuId;

  /* Der Satzstand gehoert zum Programmpunkt, nicht zur Uebung: wer zwei Saetze
     gemacht hat und dann tauscht, hat zwei Saetze gemacht. Er wandert deshalb
     immer mit, statt nur beim ersten Mal angelegt zu werden — sonst stehen
     beim Hin- und Herwechseln die veralteten Staende von vorhin wieder da.
     Das Gewicht wandert ausdruecklich *nicht* mit: 20 kg Fliegende sind nicht
     60 kg Schraegbankdruecken. */
  const cfgP = p.ex.find(e => e.id === wurzel) || {sets:3, max:8};
  a.sets[neuId] = alteSaetze.length
    ? alteSaetze.map(s => ({reps:s.reps, done:s.done}))
    : new Array(cfgP.sets || 3).fill(0).map(() => ({reps:cfgP.max || 8, done:false}));
  /* Die alte Liste faellt weg, sobald die Uebung nicht mehr in der Einheit
     steht — sie waere sonst ein Satzstand ohne Uebung. */
  if (altId !== neuId) delete a.sets[altId];
  if (a.weights[neuId] === undefined) a.weights[neuId] = S.weights[neuId] || 0;
  if (!a.cfg[neuId]) a.cfg[neuId] = cfgOf(neuId);
  save(); render();
  msg(exName(neuId) + " statt " + exName(altId) + " — nur für heute.");
}

function finishSession(){
  const a = S.active, plan = planOf(a.plan);
  const entries = activeExList().map(e => {
    const c = a.cfg[e.id] || {};
    const sk = (a.skipped || {})[e.id];
    return {
      id:e.id, name:exName(e.id), bw:isBw(e.id),
      weight:a.weights[e.id], perSide:!!c.perSide, ecc:+c.ecc||0, chain:+c.chain||0,
      variant:c.variant || "", note:"",
      /* Abstand zum Muskelversagen im letzten Satz. Wandert mit in den Verlauf,
         weil erst er die Wiederholungen einordnet — und weil der Vorschlag
         beim naechsten Mal genau daraus liest. */
      rir:(a.rir || {})[e.id],
      abbruch:(a.abbruch || {})[e.id] || null,
      skipped:sk ? {reason:sk.reason} : null,
      reps:sk ? [] : (a.sets[e.id]||[]).filter(s => s.done).map(s => s.reps)
    };
  }).filter(e => e.reps.length || e.skipped);

  const before = prsFrom(S.sessions);
  const session = {
    id:String(Date.now()), date:dayKey(new Date()), ts:Date.now(),
    /* Der Beginn als eigenes Feld. Ableiten liesse er sich zwar aus `ts`
       minus Dauer, aber nur solange beide stimmen — und genau die Dauer ist
       das, was er von Hand korrigieren will. */
    startedAt: a.startedAt || 0,
    kind:"lift", plan:plan.id, type:plan.type,
    /* Gedeckelt: laeuft eine Einheit ueber Nacht offen weiter, ist die
       gemessene Dauer wertlos. Dann lieber keine Angabe als eine falsche. */
    /* Ohne Start gibt es keine Dauer — 0 heisst "keine Angabe", nicht "null
       Minuten". Die Obergrenze bleibt: eine offen liegengebliebene Einheit
       soll nicht als sechs Stunden im Verlauf stehen. */
    minutes:(() => { if (!a.startedAt) return 0;
                     const m = Math.round((Date.now() - a.startedAt)/60000);
                     return (m >= 1 && m <= 240) ? m : 0; })(),
    effort:null, form:formForToday(), note:"", entries:entries
  };
  const after = prsFrom(S.sessions.concat([session]));
  const prs = [];
  entries.forEach(e => {
    if (!e.reps.length) return;
    const b = before[e.id], c = after[e.id];
    if (!b || c.weight > b.weight || c.reps > b.reps) prs.push(exName(e.id));
  });

  /* duel against the previous run of the same plan */
  const prevSame = S.sessions.slice().reverse().find(x => x.plan === plan.id);
  const curTon = entries.reduce((x,e) => x + tonnage(e), 0);
  const refTon = prevSame ? prevSame.entries.reduce((x,e) => x + tonnage(e), 0) : 0;
  const duel = refTon ? Math.round((curTon - refTon) / refTon * 100) : null;

  const ev = evaluate(plan, entries.filter(e => e.reps.length), a.weights);

  /* queue what fell out, clear what was made up */
  entries.forEach(e => {
    if (e.skipped && !S.makeup.some(m => m.id === e.id)) {
      S.makeup.push({id:e.id, date:session.date, reason:e.skipped.reason});
    }
    if (e.reps.length) S.makeup = S.makeup.filter(m => m.id !== e.id);
  });

  S.sessions.push(session);
  S.weights = Object.assign({}, S.weights, ev.next);
  S.active = null;
  S.rest = null;
  keepAwake(false);
  save();
  summary = {changes:ev.changes, prs:prs, duel:duel, planTitle:plan.title};
  tab = "heute"; route = null;
  buzz(45);
  render(); toTop();
  effortSheet(session.id);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "training-" + dayKey(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  S.settings.lastBackup = dayKey(new Date());
  save();
  msg("Backup gesichert.");
}
function importBackup(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(String(r.result));
        if (!Array.isArray(d.sessions)) throw new Error("format");
        importSheet(d);
      } catch(e) { msg("Datei konnte nicht gelesen werden. Erwartet wird ein Export aus dieser App."); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function applyImport(d, mode){
  const inc = migrate(d);
  if (mode === "replace") {
    S = inc; S.active = null; S.rest = null;
    save(); closeSheet(); render();
    msg(S.sessions.length + " Einheiten eingespielt.");
    return;
  }
  const have = {};
  S.sessions.forEach(s => have[s.id] = 1);
  const dayPlan = {};
  S.sessions.forEach(s => dayPlan[s.date + "|" + s.plan] = 1);
  let added = 0;
  inc.sessions.forEach(s => {
    if (have[s.id] || dayPlan[s.date + "|" + s.plan]) return;
    S.sessions.push(s); added++;
  });
  S.sessions.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  S.cfg = Object.assign({}, inc.cfg || {}, S.cfg);
  save(); closeSheet(); render();
  msg(added ? added + " Einheiten ergänzt." : "Nichts Neues in der Datei.");
}
function msg(t){ const el = document.getElementById("msg"); if (el) el.textContent = t; }
function updMsg(t){ const el = document.getElementById("upd"); if (el) el.textContent = t; }

/* Aktiv nach einer neuen Version fragen, statt auf den Browser zu warten.
   Ein wartender Worker wird uebernommen, danach laedt die Seite neu. */
function checkUpdate(){
  if (!("serviceWorker" in navigator)) { updMsg("Dieser Browser unterstützt keine Updates im Hintergrund."); return; }
  updMsg("Suche nach einer neuen Version …");
  navigator.serviceWorker.getRegistration().then(reg => {
    if (!reg) { location.reload(); return; }
    return reg.update().then(() => {
      const fresh = reg.waiting || reg.installing;
      if (fresh) {
        updMsg("Neue Version gefunden. Starte neu …");
        if (reg.waiting) reg.waiting.postMessage("skipWaiting");
        setTimeout(() => location.reload(), 700);
      } else {
        updMsg("Du bist auf dem aktuellen Stand (Version " + APP_VERSION + ").");
      }
    });
  }).catch(() => updMsg("Prüfung fehlgeschlagen. Bist du online?"));
}

/* ================================================================ events */
document.addEventListener("click", ev => {
  unlockAudio();
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const d = el.dataset.d !== undefined ? parseFloat(el.dataset.d) : NaN;
  const i = el.dataset.i !== undefined ? parseInt(el.dataset.i, 10) : NaN;

  /* ---- sheet plumbing ---- */
  if (a === "sheetclose") { closeSheet(); return; }
  if (a === "artzoom") { buzz(); artSheet(id); return; }
  if (a === "goalzoom") { buzz(); goalSheet(id); return; }
  if (a === "nfq") {
    const f = document.getElementById("nf");
    const v = Math.max(0, (parseFloat(String(f.value).replace(",", ".")) || 0) + d);
    f.value = kg(v);
    if (sheetState) { sheetState.value = v; }
    const holder = sheetEl.querySelector(".plates");
    if (holder && sheetState && sheetState.plates) {
      const hint = plateHint(v);
      holder.innerHTML = '<span class="note" style="margin-right:4px">Auflegen:</span>'
        + (hint.plates.length ? hint.plates.map(p => '<span class="plate">'+kg(p)+'</span>').join("") : '<span class="note">nichts</span>')
        + (hint.rest ? '<span class="note">+ '+kg(hint.rest)+' kg fehlen</span>' : '');
    }
    buzz(); return;
  }
  if (a === "nfok") {
    const f = document.getElementById("nf");
    const v = Math.max(0, parseFloat(String(f.value).replace(",", ".")) || 0);
    const st = sheetState || {};
    closeSheet();
    if (st.apply) st.apply(v);
    return;
  }
  if (a === "vfok") {
    const f = document.getElementById("vf");
    const v = String(f.value || "").trim();
    if (S.active) { S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {variant:v}); }
    setCfg(id, {variant:v});
    closeSheet(); save(); render(); return;
  }
  if (a === "skipask") { skipSheet(id); return; }
  if (a === "skipdo") {
    S.active.skipped[id] = {reason:el.dataset.r};
    closeSheet(); save(); render(); return;
  }
  if (a === "unskip") { delete S.active.skipped[id]; save(); render(); return; }
  if (a === "impmerge") { applyImport(sheetState.data, "merge"); return; }
  if (a === "impreplace") { applyImport(sheetState.data, "replace"); return; }

  /* ---- navigation ---- */
  if (a === "tab") { buzz(); tab = id; route = null; summary = null; render(); toTop(); return; }
  if (a === "open") { route = {view:"session", id:id}; render(); toTop(); return; }
  if (a === "openex") { route = {view:"exercise", id:id}; render(); toTop(); return; }
  if (a === "closeroute") { route = null; render(); toTop(); return; }
  if (a === "closesum") { summary = null; render(); return; }
  if (a === "planlist") { route = {view:"planlist"}; render(); toTop(); return; }
  if (a === "planedit") { route = {view:"planedit", id:id}; render(); toTop(); return; }
  if (a === "planreset") {
    if (confirm("Plan auf die Voreinstellung zurücksetzen?")) { S.plans = null; save(); render(); }
    return;
  }
  /* ---- Einheit nachtragen ---- */
  if (a === "addpast") {
    const heute = dayKey(new Date());
    openSheet('<h3>Einheit nachtragen</h3>'
      + '<div class="sh-sub">Datum wählen, dann den Plan. Die Sätze trägst du danach ein.</div>'
      + '<input class="field text" id="pd" type="date" max="'+heute+'" value="'+heute+'">'
      + '<div style="margin-top:16px">'
      + Object.keys(plans()).map(k => '<button class="pick" data-a="addpastDo" data-x="'+k+'">'
          + exIcon(plans()[k].ex[0].id, 40, 52)
          + '<div class="pbody"><div class="ptitle">'+esc(plans()[k].title)+'</div>'
          + '<div class="pmeta">'+plans()[k].ex.length+' Übungen</div></div></button>').join("")
      + '</div>'
      + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
    return;
  }
  if (a === "addpastDo") {
    const datum = (document.getElementById("pd") || {}).value || dayKey(new Date());
    const pl = planOf(el.dataset.x);
    const sess = {
      id:String(Date.now()), date:datum, ts:parseDay(datum).getTime() + 12*3600000,
      kind:"lift", plan:pl.id, type:pl.type, minutes:60, effort:null, form:null, note:"",
      entries: pl.ex.map(e => {
        const c = cfgOf(e.id);
        return {id:e.id, name:exName(e.id), bw:isBw(e.id), weight:S.weights[e.id] || 0,
          perSide:!!c.perSide, ecc:+c.ecc||0, chain:+c.chain||0, variant:c.variant||"",
          note:"", skipped:null,
          reps: Array.from({length:e.sets || 3}, () => e.max || 8)};
      })
    };
    S.sessions.push(sess);
    S.sessions.sort((x,y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
    save(); closeSheet();
    /* direkt in den Korrekturmodus, dort werden die echten Zahlen eingetragen */
    route = {view:"session", id:sess.id, edit:true};
    render(); toTop();
    return;
  }

  /* ---- Einheit korrigieren ---- */
  if (a === "editsession") { route.edit = true; render(); toTop(); return; }
  if (a === "editdone")    { route.edit = false; render(); toTop(); return; }
  if (a === "ew" || a === "er" || a === "erdel" || a === "eradd" || a === "eexdel" || a === "ew-edit") {
    const s = S.sessions.find(x => x.id === route.id);
    if (!s) return;
    const e = s.entries.find(x => x.id === id);
    if (!e) return;
    if (a === "ew")    { e.weight = Math.max(0, snapTo(e.weight + d, incOf(id))); }
    if (a === "er")    { e.reps[i] = Math.max(0, (e.reps[i]||0) + d); }
    if (a === "erdel") { e.reps.splice(i, 1); }
    if (a === "eradd") { e.reps.push(e.reps.length ? e.reps[e.reps.length-1] : 8); }
    if (a === "eexdel"){
      if (!confirm(exName(id) + " aus dieser Einheit entfernen?")) return;
      s.entries = s.entries.filter(x => x.id !== id);
    }
    if (a === "ew-edit") {
      numSheet({title:exName(id), sub:e.bw ? "Zusatzgewicht" : "Gewicht in Kilogramm",
        value:e.weight, plates:!!e.bw, quick:e.bw ? [-2.5,-1.25,1.25,2.5] : [-5,-1,1,5],
        apply:v => { e.weight = v; save(); render(); }});
      return;
    }
    /* Ohne Saetze traegt die Uebung nichts mehr bei — dann raus aus der Einheit. */
    if (a !== "eexdel" && !e.reps.length && !e.skipped) s.entries = s.entries.filter(x => x.id !== e.id);
    buzz(); save(); render();
    return;
  }
  if (a === "eexadd") {
    const s = S.sessions.find(x => x.id === route.id);
    const pl = planOf(s.plan);
    const drin = s.entries.map(x => x.id);
    const kandidaten = (pl ? pl.ex.map(x => x.id) : []).filter(x => drin.indexOf(x) < 0);
    const liste = kandidaten.length ? kandidaten : Object.keys(EX).filter(x => drin.indexOf(x) < 0);
    openSheet('<h3>Übung hinzufügen</h3><div class="sh-sub">'
      + (kandidaten.length ? 'Fehlt aus '+esc(pl.title) : 'Alle Übungen') + '</div>'
      + liste.map(k => '<button class="pick" data-a="eexaddDo" data-x="'+k+'">'
          + exIcon(k, 40, 52) + '<div class="pbody"><div class="ptitle">'+esc(exName(k))+'</div>'
          + '<div class="pmeta">Schritt '+kg(incOf(k))+' kg</div></div></button>').join("")
      + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
    return;
  }
  if (a === "eexaddDo") {
    const s = S.sessions.find(x => x.id === route.id);
    const x = el.dataset.x, c = cfgOf(x);
    s.entries.push({id:x, name:exName(x), bw:isBw(x), weight:S.weights[x] || 0,
      perSide:!!c.perSide, ecc:+c.ecc||0, chain:+c.chain||0, variant:c.variant||"",
      note:"", skipped:null, reps:[8,8,8]});
    save(); closeSheet(); render();
    return;
  }

  if (a === "delsession") {
    if (confirm("Diese Einheit löschen?")) {
      S.sessions = S.sessions.filter(s => s.id !== id);
      save(); route = null; render(); toTop();
    }
    return;
  }

  /* ---- Tagesform, freie Wahl, Boxen, Pause ---- */
  if (a === "formask") { formSheet(null); return; }
  if (a === "erhsheet") { buzz(); erhSheet(); return; }
  /* Fuehrt in die Health-App. Den Schalter selbst kann keine App umlegen —
     das ist der Sinn der Berechtigung —, aber den Weg dorthin abkuerzen. */
  if (a === "healthapp") {
    buzz();
    if (typeof window !== "undefined" && window.__training_openHealth) window.__training_openHealth();
    return;
  }
  if (a === "schlafsheet") { buzz(); schlafSheet(); return; }
  if (a === "choose") {
    buzz();
    if (!formForToday()) formSheet("pick"); else pickSheet();
    return;
  }
  if (a === "fset") {
    const w = Object.assign({}, sheetState.form);
    w[id] = d; buzz();
    formSheet(sheetState.next, w);
    return;
  }
  /* Loest die Nachfrage von iOS aus. Die Antwort kommt nicht hier zurueck,
     sondern spaeter ueber `training:health` — dort baut sich das Blatt neu auf. */
  if (a === "uhr") { buzz(14); uhrSheet(id, i); return; }
  if (a === "uhrstop") { buzz(45); uhrStop(); return; }
  if (a === "uhrweg") { buzz(); uhrWeg(); return; }
  if (a === "vorok") {
    buzz(13);
    S.active.weights[id] = +d;
    const e = +el.getAttribute("data-e");
    /* Das exzentrische Zusatzgewicht haengt an der Uebung, nicht an dieser
       Einheit — sonst stuende es beim naechsten Mal wieder auf dem alten Wert. */
    if (!isNaN(e)) {
      S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {ecc:e});
      setCfg(id, {ecc:e});
    }
    save(); render(); return;
  }
  if (a === "rir") {
    buzz();
    S.active.rir = S.active.rir || {};
    S.active.rir[id] = +d;
    save();
    /* Nur die eine Zeile neu setzen: ein Neuaufbau waehrend der Einheit
       kostet Scrollstand und Eingabefokus. */
    const zeile = document.querySelector('[data-a="rir"][data-id="'+id+'"]');
    if (zeile) zeile.parentNode.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", +b.getAttribute("data-d") === +d));
    return;
  }
  if (a === "startnow") { buzz(14); unlockAudio(); startNow(); return; }
  if (a === "warmup") { buzz(13); unlockAudio(); startWarmup(); return; }
  if (a === "sysinfo") { buzz(); sysSheet(); return; }
  if (a === "healthask") {
    buzz();
    /* Der Knopf steht nur, wenn die Huelle da ist — aber ein alter Knopf in
       einem offenen Blatt ueberlebt einen Neustart der Bruecke. Ohne diese
       Zeile bliebe danach "Liest …" stehen, fuer immer. */
    if (!healthPossible()) { healthLaeuft = false; healthStumm = true; render(); return; }
    /* Ausserhalb eines Blattes kommt der Tipp von der Karte auf der Startseite. */
    const vonKarte = !sheetEl.contains(el);
    healthWartet = {next: vonKarte ? null : sheetState.next, vonKarte: vonKarte};
    healthLaeuft = true;
    window.__training_healthRequest();
    /* Kommt nichts zurueck, muss das Blatt es sagen. Vorher passierte
       sichtbar gar nichts — man tippt dann immer wieder auf denselben Knopf
       und haelt ihn fuer kaputt. */
    clearTimeout(healthUhr);
    healthUhr = setTimeout(() => {
      healthLaeuft = false;
      healthStumm = true;
      if (healthWartet) {
        const w = healthWartet; healthWartet = null;
        if (w.vonKarte) render(); else formSheet(w.next);
      }
    }, 6000);
    if (vonKarte) render(); else formSheet(sheetState.next, sheetState.form);
    return;
  }
  if (a === "formok") {
    const next = sheetState.next;
    saveForm(sheetState.form);
    closeSheet();
    if (next === "pick") pickSheet(); else { render(); }
    return;
  }
  if (a === "boxask") { boxSheet(); return; }
  if (a === "boxdur") { buzz(); boxSheet(Object.assign({}, sheetState.box, {minutes:d})); return; }
  if (a === "boxint") { buzz(); boxSheet(Object.assign({}, sheetState.box, {effort:d})); return; }
  if (a === "boxok") {
    const st = sheetState.box;
    S.sessions.push({
      id:String(Date.now()), date:dayKey(new Date()), ts:Date.now(), kind:"boxing",
      plan:null, type:"Boxen", minutes:st.minutes, effort:st.effort,
      form:formForToday(), note:"", entries:[]
    });
    save(); closeSheet(); buzz(30); summary = null; render(); toTop();
    return;
  }
  if (a === "restask") { restSheet(); return; }
  if (a === "restok") {
    S.sessions.push({
      id:String(Date.now()), date:dayKey(new Date()), ts:Date.now(), kind:"rest",
      plan:null, type:"Pause", minutes:0, effort:null,
      form:formForToday(), note:"", entries:[]
    });
    save(); closeSheet(); render(); toTop();
    return;
  }
  if (a === "effset") {
    const s = S.sessions.find(x => x.id === id);
    if (s) { s.effort = d; save(); }
    closeSheet(); buzz(); render();
    return;
  }

  /* ---- start ---- */
  if (a === "start") { buzz(14); closeSheet(); startSession(id, S.makeup.slice()); return; }

  /* ---- calendar / filter ---- */
  if (a === "mon") {
    calMonth = d < 0
      ? (calMonth.m === 0 ? {y:calMonth.y-1, m:11} : {y:calMonth.y, m:calMonth.m-1})
      : (calMonth.m === 11 ? {y:calMonth.y+1, m:0} : {y:calMonth.y, m:calMonth.m+1});
    render(); return;
  }
  if (a === "filter") { filter = id; render(); return; }

  /* ---- settings ---- */
  if (a === "bw" || a === "rest" || a === "eccmax") {
    buzz();
    const key = a === "bw" ? "bodyweight" : a === "rest" ? "rest" : "eccMax";
    let v = (a === "eccmax" ? eccMax() : S.settings[key]) + d;
    v = key === "rest" ? Math.min(600, Math.max(15, v))
      : key === "eccMax" ? Math.min(50, Math.max(0, v))
      : Math.max(0, v);
    S.settings[key] = v; save(); render(); return;
  }
  if (a === "bw-edit" || a === "rest-edit") {
    const key = a === "bw-edit" ? "bodyweight" : "rest";
    numSheet({
      title: key === "rest" ? "Satzpause" : "Körpergewicht",
      sub: key === "rest" ? "in Sekunden" : "in Kilogramm",
      value:S.settings[key], quick: key === "rest" ? [-30,-15,15,30] : [-1,-0.5,0.5,1],
      apply:v => { S.settings[key] = key === "rest" ? Math.min(600, Math.max(15, v)) : v; save(); render(); }
    });
    return;
  }
  if (a === "sound") { S.settings.sound = id === "1"; save(); render(); return; }
  if (a === "plate") {
    const p = parseFloat(id);
    const arr = (S.settings.plates || []).slice();
    const k = arr.indexOf(p);
    if (k >= 0) arr.splice(k, 1); else arr.push(p);
    S.settings.plates = arr.sort((x,y) => x-y);
    save(); render(); return;
  }
  if (a === "export") { exportBackup(); return; }
  if (a === "import") { importBackup(); return; }
  if (a === "update") { checkUpdate(); return; }
  if (a === "reset") {
    if (confirm("Alle Einheiten, Gewichte und Einstellungen löschen? Das lässt sich nicht rückgängig machen.")) {
      S = EMPTY(); save(); route = null; render(); msg("Alles zurückgesetzt.");
    }
    return;
  }

  /* ---- plan editing ---- */
  if (a === "exmove") {
    const pl = editablePlans()[id];
    const j = i + d;
    if (j < 0 || j >= pl.ex.length) return;
    const t = pl.ex[i]; pl.ex[i] = pl.ex[j]; pl.ex[j] = t;
    save(); buzz(); render(); return;
  }
  if (a === "exdel") {
    const pl = editablePlans()[id];
    if (pl.ex.length <= 1) return;
    if (confirm(exName(pl.ex[i].id) + " aus " + pl.title + " entfernen?")) { pl.ex.splice(i,1); save(); render(); }
    return;
  }
  if (a === "extune") { tuneSheet(id, i); return; }
  if (a === "exswap") { swapSheet(id, i, "swap"); return; }
  if (a === "exadd") { swapSheet(id, 0, "add"); return; }
  if (a === "exswapDo") {
    const pl = editablePlans()[id];
    pl.ex[i] = Object.assign({}, pl.ex[i], {id:el.dataset.x});
    save(); closeSheet(); render(); return;
  }
  if (a === "exaddDo") {
    const pl = editablePlans()[id];
    pl.ex.push({id:el.dataset.x, sets:3, min:8, max:12});
    save(); closeSheet(); render(); return;
  }
  if (a === "tmode") {
    const st = sheetState, pl = editablePlans()[st.planId], e = pl.ex[st.i];
    if (d === 1 && !e.total) e.total = [Math.max(8, e.sets*e.min), Math.max(12, e.sets*e.max)];
    else if (d === 0 && e.total) delete e.total;
    save(); tuneSheet(st.planId, st.i); render(); return;
  }
  if (a === "tsets" || a === "tmin" || a === "tmax" || a === "tlo" || a === "thi" || a === "tinc") {
    const st = sheetState, pl = editablePlans()[st.planId], e = pl.ex[st.i];
    if (a === "tsets") e.sets = Math.max(1, Math.min(12, e.sets + d));
    if (a === "tmin")  e.min  = Math.max(1, Math.min(50, e.min + d));
    if (a === "tmax")  e.max  = Math.max(e.min, Math.min(60, e.max + d));
    if (a === "tlo")   e.total[0] = Math.max(1, e.total[0] + d);
    if (a === "thi")   e.total[1] = Math.max(e.total[0], e.total[1] + d);
    if (a === "tinc")  setCfg(e.id, {inc:Math.max(0.25, Math.round((incOf(e.id) + d)*100)/100)});
    if (e.min > e.max) e.max = e.min;
    save(); buzz(); tuneSheet(st.planId, st.i); render(); return;
  }

  /* ---- Uhrzeit und Dauer einer gespeicherten Einheit ---- */
  if (a === "zeitedit") { buzz(); zeitSheet(id); return; }
  if (a === "zstd" || a === "zmin" || a === "zdauer") {
    const s = S.sessions.find(x => x.id === id);
    if (!s) return;
    const sp = sessionSpanne(s);
    const start = new Date(sp ? sp.start
      : (() => { const x = parseDay(s.date); x.setHours(18, 0, 0, 0); return x.getTime(); })());
    if (a === "zstd") {
      /* Rundherum statt anschlagen: von 23 auf 0 ist eine Stunde weiter, und
         wer eine Nachtschicht eintraegt, soll nicht bei 23 haengenbleiben. */
      start.setHours((start.getHours() + d + 24) % 24);
    }
    if (a === "zmin") {
      const m = start.getMinutes() + d;
      start.setMinutes((m + 60) % 60);
    }
    if (a === "zdauer") s.minutes = Math.max(0, Math.min(240, (+s.minutes || 0) + d));
    /* Der Tag bleibt der Tag der Einheit — an der Uhrzeit zu drehen darf sie
       nicht in den Nachbartag schieben. */
    const tag = parseDay(s.date);
    start.setFullYear(tag.getFullYear(), tag.getMonth(), tag.getDate());
    s.startedAt = start.getTime();
    /* `ts` bleibt der Zeitpunkt des Abschliessens und wird mitgezogen, damit
       die Reihenfolge im Verlauf zur Uhrzeit passt. */
    s.ts = s.startedAt + (+s.minutes || 0) * 60000;
    save(); buzz(); zeitSheet(id); render(); return;
  }

  /* ---- per-exercise config ---- */
  if (a === "exopts") { exOptsSheet(id); return; }
  if (a === "tauschask") { buzz(); tauschSheet(id); return; }
  if (a === "tauschDo") {
    buzz(13); closeSheet();
    tauscheUebung(id, el.dataset.x);
    return;
  }
  /* Aufwaermstufe abhaken. Nochmal auf dieselbe hebt sie wieder auf — wer
     sich vertippt, muss nicht die ganze Uebung neu anfangen. Der Stand geht
     mit in den Zustand, sonst waere er beim naechsten Rendern weg; in den
     Verlauf geht er nie. */
  if (a === "warmstufe") {
    if (!S.active) return;
    buzz(11);
    S.active.warm = S.active.warm || {};
    const stufe = +el.dataset.i + 1;
    S.active.warm[id] = S.active.warm[id] === stufe ? stufe - 1 : stufe;
    save();
    const box = document.querySelector('[data-sets="'+id+'"]');
    if (box && box.parentElement) {
      const alt = box.parentElement.querySelector(".warmzeile");
      if (alt) alt.outerHTML = aufwaermZeile(id, S.active.weights[id]);
    }
    return;
  }
  if (a === "ps") {
    const v = d === 1;
    if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {perSide:v});
    setCfg(id, {perSide:v});
    exOptsSheet(id); render(); return;
  }
  if (a === "ecc" || a === "chain") {
    const key = a;
    const cur = (S.active && S.active.cfg[id] ? +S.active.cfg[id][key] : +cfgOf(id)[key]) || 0;
    const v = Math.max(0, cur + d);
    if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {[key]:v});
    setCfg(id, {[key]:v});
    buzz(); exOptsSheet(id); render(); return;
  }
  if (a === "ecc-edit" || a === "chain-edit") {
    const key = a === "ecc-edit" ? "ecc" : "chain";
    const cur = (S.active && S.active.cfg[id] ? +S.active.cfg[id][key] : +cfgOf(id)[key]) || 0;
    numSheet({title: key === "ecc" ? "Exzentrisch zusätzlich" : "Kette", sub:"in Kilogramm", value:cur,
      quick:[-5,-1,1,5],
      apply:v => {
        if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {[key]:v});
        setCfg(id, {[key]:v}); render();
      }});
    return;
  }

  /* ---- live session ---- */
  if (!S.active) return;
  const list = activeExList();
  const cfg = id ? list.find(x => x.id === id) : null;

  if (a === "weight") {
    buzz();
    const v = Math.max(0, snapTo(S.active.weights[id] + d, incOf(id)));
    S.active.weights[id] = v; save();
    const holder = el.parentNode.querySelector("[data-a$='-edit']");
    if (holder) holder.innerHTML = kg(v) + ((isBw(id) && v === 0) ? '' : '<small>kg</small>');
    updateDuel(); return;
  }
  if (a === "weight-edit") {
    numSheet({
      title:exName(id), sub:isBw(id) ? "Zusatzgewicht am Gürtel" : "Gewicht in Kilogramm",
      value:S.active.weights[id], plates:isBw(id),
      quick:isBw(id) ? [-2.5,-1.25,1.25,2.5] : [-5,-1,1,5],
      apply:v => { S.active.weights[id] = v; save(); render(); }
    });
    return;
  }
  if (a === "reps") {
    buzz();
    const s = S.active.sets[id][i];
    s.reps = Math.max(0, s.reps + d); save();
    const row = document.querySelector('[data-row="'+id+':'+i+'"]');
    /* innerHTML statt textContent: bei Zeitübungen haengt die Einheit mit im
       Feld, und textContent wuerde sie beim ersten Tippen entfernen. */
    if (row) row.querySelector(".reps").innerHTML = s.reps + (istZeit(id) ? '<small>s</small>' : '');
    updateSub(cfg); updateDuel(); return;
  }
  if (a === "log") {
    /* Wer den ersten Satz abhakt, hat angefangen — auch ohne auf Start zu
       tippen. Sonst stuende am Ende eine Einheit ohne Dauer. */
    const erster = !S.active.startedAt;
    const s = S.active.sets[id][i];
    s.done = !s.done; save(); buzz(13);
    if (erster) {
      startNow(false);
      if (s.done) startRest(id);
      return;
    }
    const row = document.querySelector('[data-row="'+id+':'+i+'"]');
    if (row) {
      row.classList.toggle("done", s.done);
      row.querySelector('[data-a="log"]').classList.toggle("on", s.done);
    }
    if (s.done) startRest(id);
    updateSub(cfg); updateCount(); updateDuel(); updateBody();
    updateRir(id, cfg);
    return;
  }
  if (a === "addset") {
    const arr = S.active.sets[id];
    arr.push({reps: arr.length ? arr[arr.length-1].reps : (cfg ? cfg.max : 8), done:false});
    save();
    const box = document.querySelector('[data-sets="'+id+'"]');
    if (box) box.insertAdjacentHTML("beforeend", setRow(cfg, arr[arr.length-1], arr.length-1));
    updateCount(); return;
  }
  if (a === "skiprest") { S.rest = null; save(); renderRest(); return; }
  if (a === "finish") { abschlussPruefen(); return; }
  if (a === "abbruchdo") {
    buzz();
    S.active.abbruch = S.active.abbruch || {};
    /* Nochmal derselbe Grund hebt ihn wieder auf — sonst kommt man aus einer
       versehentlichen Angabe nicht mehr heraus. */
    S.active.abbruch[id] = S.active.abbruch[id] === el.dataset.r ? null : el.dataset.r;
    save(); abschlussSheet(); return;
  }
  if (a === "abbruchok") { closeSheet(); finishSession(); return; }
  if (a === "cancel") {
    if (confirm("Training verwerfen? Die Sätze gehen verloren.")) {
      S.active = null; S.rest = null; keepAwake(false); save(); route = null; render(); toTop();
    }
    return;
  }
});

/* Die Frage nach dem letzten Satz sofort einblenden, sobald die Uebung durch
   ist — und einmal dorthin scrollen, damit sie nicht unbemerkt unter dem
   Daumen entsteht. Nur beim Uebergang von "offen" auf "fertig": bei jedem
   weiteren Abhaken wuerde die Ansicht sonst dauernd springen. */
function updateRir(exId, cfg){
  if (!S.active || !S.active.sets[exId]) return;
  const box = document.querySelector('[data-rir="'+exId+'"]');
  if (!box) return;
  const vorher = !!box.querySelector(".rirrow");
  const html = rirZeile(exId, S.active.sets[exId]);
  if (vorher === !!html) return;
  box.innerHTML = html;
  if (html) {
    /* Nicht mitten in die Zeile springen: `nearest` holt sie gerade so ins
       Bild und laesst den Satz, den man eben abgehakt hat, sichtbar. */
    const z = box.querySelector(".rirrow");
    if (z && z.scrollIntoView) z.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
}

/* Laufende Summe der abgehakten Wiederholungen. Genau das will man beim
   Klimmzugsatz sehen, ohne im Kopf mitzurechnen. */
function updateSub(cfg){
  if (!cfg || !S.active || !S.active.sets[cfg.id]) return;
  const sum = S.active.sets[cfg.id].filter(s => s.done).reduce((a,s) => a + s.reps, 0);
  const c = document.querySelector('[data-cnt="'+cfg.id+'"]');
  if (c) { c.textContent = sum; c.classList.toggle("on", sum > 0); }
  if (cfg.total) {
    const el = document.querySelector('[data-sub="'+cfg.id+'"]');
    if (el) el.textContent = 'Ziel ' + cfg.total[0] + '–' + cfg.total[1] + ' Wdh. gesamt';
  }
}
/* Sets belonging to a skipped exercise must leave the denominator, otherwise the
   ring can never close and the count reads unfinished for the rest of the session. */
function sessionProgress(){
  const a = S.active;
  let done = 0, total = 0;
  activeExList().forEach(e => {
    if ((a.skipped || {})[e.id]) return;
    (a.sets[e.id] || []).forEach(s => { total++; if (s.done) done++; });
  });
  return {done:done, total:total};
}
/* Nur die Figur neu zeichnen, nicht die Ansicht — render() waehrend einer
   Einheit wuerde Eingabefokus und Scrollstand verlieren. */
function updateBody(){
  const el = document.getElementById("sessbody");
  if (el && S.active) el.innerHTML = silhouette(sessionBodyState(), true);
  const u = document.getElementById("uebrig");
  if (u && S.active) u.textContent = sessionLeftMin();
  const d = document.getElementById("shdots");
  if (d && S.active) d.innerHTML = muscleDots(sessionBodyState());
}

function updateCount(){
  const prog = sessionProgress();
  const done = prog.done, total = prog.total;
  const el = document.getElementById("cnt");
  if (el) el.textContent = done + ' / ' + total;
  ringZeigen(null);
  const btn = document.querySelector('[data-a="finish"]');
  if (btn) done ? btn.removeAttribute("disabled") : btn.setAttribute("disabled", "");
  liveMelden();
}
/* Before the first set is logged a percentage would always read -100 %, which is
   true but useless. Show the target to beat instead, and switch to the delta
   once there is something to compare. */
function duelLabel(cur, ref){
  if (!ref) return "erste Einheit";
  if (!cur) return "zu schlagen: " + (Math.round(ref/100)/10) + " t";
  const p = Math.round((cur - ref) / ref * 100);
  return (p >= 0 ? '+' : '') + p + ' % vs. letztes Mal';
}
function updateDuel(){
  const a = S.active;
  if (!a) return;
  let cur = 0, ref = 0;
  activeExList().forEach(e => {
    const c = a.cfg[e.id] || {};
    cur += tonnage({id:e.id, bw:isBw(e.id), weight:a.weights[e.id], perSide:!!c.perSide,
                    reps:(a.sets[e.id]||[]).filter(s => s.done).map(s => s.reps)});
    const le = lastEntry(e.id);
    if (le) ref += tonnage(le.entry);
  });
  const el = document.getElementById("duel");
  if (!el) return;
  el.textContent = duelLabel(cur, ref);
  el.classList.toggle("on", !!(ref && cur && cur >= ref));
}

/* ================================================================== boot */
load();
/* Die Huelle kann die Nacht schon gesetzt haben, bevor die Seite ueberhaupt
   ihren Zuhoerer haengt — dann kaeme das Ereignis nie an und der Verlauf
   bliebe leer. Deshalb hier einmal nachtragen, was schon dasteht. */
healthLogSchreiben(healthNow());
askPersist();
render();
tickRest();
if ("serviceWorker" in navigator) {
  /* When a new worker takes over, reload once so the user actually sees the update
     instead of the previously cached shell. All state lives in localStorage, so a
     reload mid-session loses nothing. Guarded on there having been a controller
     before, otherwise the very first visit would reload for no reason. */
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
