function updMsg(t){ const el = document.getElementById("upd"); if (el) el.textContent = t; }

/* Aktiv nach einer neuen Version fragen, statt auf den Browser zu warten.
   Ein wartender Worker wird uebernommen, danach laedt die Seite neu. */
function checkUpdate(){
  if (!("serviceWorker" in navigator)) { updMsg("Dieser Browser unterstützt keine Updates im Hintergrund."); return; }
  updMsg("Suche nach einer neuen Version …");
  navigator.serviceWorker.getRegistration().then(reg => {
    if (!reg) { location.reload(); return; }
    return reg.update().then(() => {
      const fresh = reg.waiting || reg.installing;
      if (fresh) {
        updMsg("Neue Version gefunden. Starte neu …");
        if (reg.waiting) reg.waiting.postMessage("skipWaiting");
        setTimeout(() => location.reload(), 700);
      } else {
        updMsg("Du bist auf dem aktuellen Stand (Version " + APP_VERSION + ").");
      }
    });
  }).catch(() => updMsg("Prüfung fehlgeschlagen. Bist du online?"));
}

/* ================================================================ events */
document.addEventListener("click", ev => {
  unlockAudio();
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const d = el.dataset.d !== undefined ? parseFloat(el.dataset.d) : NaN;
  const i = el.dataset.i !== undefined ? parseInt(el.dataset.i, 10) : NaN;

  /* ---- sheet plumbing ---- */
  if (a === "sheetclose") { closeSheet(); return; }
  if (a === "artzoom") { buzz(); artSheet(id); return; }
  if (a === "goalzoom") { buzz(); goalSheet(id); return; }
  if (a === "nfq") {
    const f = document.getElementById("nf");
    const v = Math.max(0, (parseFloat(String(f.value).replace(",", ".")) || 0) + d);
    f.value = kg(v);
    if (sheetState) { sheetState.value = v; }
    const holder = sheetEl.querySelector(".plates");
    if (holder && sheetState && sheetState.plates) {
      const hint = plateHint(v);
      holder.innerHTML = '<span class="note" style="margin-right:4px">Auflegen:</span>'
        + (hint.plates.length ? hint.plates.map(p => '<span class="plate">'+kg(p)+'</span>').join("") : '<span class="note">nichts</span>')
        + (hint.rest ? '<span class="note">+ '+kg(hint.rest)+' kg fehlen</span>' : '');
    }
    buzz(); return;
  }
  if (a === "nfok") {
    const f = document.getElementById("nf");
    const v = Math.max(0, parseFloat(String(f.value).replace(",", ".")) || 0);
    const st = sheetState || {};
    closeSheet();
    if (st.apply) st.apply(v);
    return;
  }
  if (a === "vfok") {
    const f = document.getElementById("vf");
    const v = String(f.value || "").trim();
    if (S.active) { S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {variant:v}); }
    setCfg(id, {variant:v});
    closeSheet(); save(); render(); return;
  }
  if (a === "skipask") { skipSheet(id); return; }
  if (a === "skipdo") {
    S.active.skipped[id] = {reason:el.dataset.r};
    closeSheet(); save(); render(); return;
  }
  if (a === "unskip") { delete S.active.skipped[id]; save(); render(); return; }
  if (a === "impmerge") { applyImport(sheetState.data, "merge"); return; }
  if (a === "impreplace") { applyImport(sheetState.data, "replace"); return; }

  /* ---- navigation ---- */
  if (a === "tab") { buzz(); tab = id; route = null; summary = null; render(); toTop(); return; }
  if (a === "open") { route = {view:"session", id:id}; render(); toTop(); return; }
  if (a === "openex") { route = {view:"exercise", id:id}; render(); toTop(); return; }
  if (a === "closeroute") { route = null; render(); toTop(); return; }
  if (a === "closesum") { summary = null; render(); return; }
  if (a === "planlist") { route = {view:"planlist"}; render(); toTop(); return; }
  if (a === "planedit") { route = {view:"planedit", id:id}; render(); toTop(); return; }
  if (a === "planreset") {
    if (confirm("Plan auf die Voreinstellung zurücksetzen?")) { S.plans = null; save(); render(); }
    return;
  }
  /* ---- Einheit nachtragen ---- */
  if (a === "addpast") {
    const heute = dayKey(new Date());
    openSheet('<h3>Einheit nachtragen</h3>'
      + '<div class="sh-sub">Datum wählen, dann den Plan. Die Sätze trägst du danach ein.</div>'
      + '<input class="field text" id="pd" type="date" max="'+heute+'" value="'+heute+'">'
      + '<div style="margin-top:16px">'
      + Object.keys(plans()).map(k => '<button class="pick" data-a="addpastDo" data-x="'+k+'">'
          + exIcon(plans()[k].ex[0].id, 40, 52)
          + '<div class="pbody"><div class="ptitle">'+esc(plans()[k].title)+'</div>'
          + '<div class="pmeta">'+plans()[k].ex.length+' Übungen</div></div></button>').join("")
      + '</div>'
      + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
    return;
  }
  if (a === "addpastDo") {
    const datum = (document.getElementById("pd") || {}).value || dayKey(new Date());
    const pl = planOf(el.dataset.x);
    const sess = {
      id:String(Date.now()), date:datum, ts:parseDay(datum).getTime() + 12*3600000,
      kind:"lift", plan:pl.id, type:pl.type, minutes:60, effort:null, form:null, note:"",
      entries: pl.ex.map(e => {
        const c = cfgOf(e.id);
        return {id:e.id, name:exName(e.id), bw:isBw(e.id), weight:S.weights[e.id] || 0,
          perSide:!!c.perSide, ecc:+c.ecc||0, chain:+c.chain||0, variant:c.variant||"",
          note:"", skipped:null,
          reps: Array.from({length:e.sets || 3}, () => e.max || 8)};
      })
    };
    S.sessions.push(sess);
    S.sessions.sort((x,y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
    save(); closeSheet();
    /* direkt in den Korrekturmodus, dort werden die echten Zahlen eingetragen */
    route = {view:"session", id:sess.id, edit:true};
    render(); toTop();
    return;
  }

  /* ---- Einheit korrigieren ---- */
  if (a === "editsession") { route.edit = true; render(); toTop(); return; }
  if (a === "editdone")    { route.edit = false; render(); toTop(); return; }
  if (a === "ew" || a === "er" || a === "erdel" || a === "eradd" || a === "eexdel" || a === "ew-edit") {
    const s = S.sessions.find(x => x.id === route.id);
    if (!s) return;
    const e = s.entries.find(x => x.id === id);
    if (!e) return;
    if (a === "ew")    { e.weight = Math.max(0, snapTo(e.weight + d, incOf(id))); }
    if (a === "er")    { e.reps[i] = Math.max(0, (e.reps[i]||0) + d); }
    if (a === "erdel") { e.reps.splice(i, 1); }
    if (a === "eradd") { e.reps.push(e.reps.length ? e.reps[e.reps.length-1] : 8); }
    if (a === "eexdel"){
      if (!confirm(exName(id) + " aus dieser Einheit entfernen?")) return;
      s.entries = s.entries.filter(x => x.id !== id);
    }
    if (a === "ew-edit") {
      numSheet({title:exName(id), sub:e.bw ? "Zusatzgewicht" : "Gewicht in Kilogramm",
        value:e.weight, plates:!!e.bw, quick:e.bw ? [-2.5,-1.25,1.25,2.5] : [-5,-1,1,5],
        apply:v => { e.weight = v; save(); render(); }});
      return;
    }
    /* Ohne Saetze traegt die Uebung nichts mehr bei — dann raus aus der Einheit. */
    if (a !== "eexdel" && !e.reps.length && !e.skipped) s.entries = s.entries.filter(x => x.id !== e.id);
    buzz(); save(); render();
    return;
  }
  if (a === "eexadd") {
    const s = S.sessions.find(x => x.id === route.id);
    const pl = planOf(s.plan);
    const drin = s.entries.map(x => x.id);
    const kandidaten = (pl ? pl.ex.map(x => x.id) : []).filter(x => drin.indexOf(x) < 0);
    const liste = kandidaten.length ? kandidaten : Object.keys(EX).filter(x => drin.indexOf(x) < 0);
    openSheet('<h3>Übung hinzufügen</h3><div class="sh-sub">'
      + (kandidaten.length ? 'Fehlt aus '+esc(pl.title) : 'Alle Übungen') + '</div>'
      + liste.map(k => '<button class="pick" data-a="eexaddDo" data-x="'+k+'">'
          + exIcon(k, 40, 52) + '<div class="pbody"><div class="ptitle">'+esc(exName(k))+'</div>'
          + '<div class="pmeta">Schritt '+kg(incOf(k))+' kg</div></div></button>').join("")
      + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
    return;
  }
  if (a === "eexaddDo") {
    const s = S.sessions.find(x => x.id === route.id);
    const x = el.dataset.x, c = cfgOf(x);
    s.entries.push({id:x, name:exName(x), bw:isBw(x), weight:S.weights[x] || 0,
      perSide:!!c.perSide, ecc:+c.ecc||0, chain:+c.chain||0, variant:c.variant||"",
      note:"", skipped:null, reps:[8,8,8]});
    save(); closeSheet(); render();
    return;
  }

  if (a === "delsession") {
    if (confirm("Diese Einheit löschen?")) {
      S.sessions = S.sessions.filter(s => s.id !== id);
      save(); route = null; render(); toTop();
    }
    return;
  }

  /* ---- Tagesform, freie Wahl, Boxen, Pause ---- */
  if (a === "formask") { formSheet(null); return; }
  if (a === "choose") {
    buzz();
    if (!formForToday()) formSheet("pick"); else pickSheet();
    return;
  }
  if (a === "fset") {
    const w = Object.assign({}, sheetState.form);
    w[id] = d; buzz();
    formSheet(sheetState.next, w);
    return;
  }
  if (a === "formok") {
    const next = sheetState.next;
    saveForm(sheetState.form);
    closeSheet();
    if (next === "pick") pickSheet(); else { render(); }
    return;
  }
  if (a === "boxask") { boxSheet(); return; }
  if (a === "boxdur") { buzz(); boxSheet(Object.assign({}, sheetState.box, {minutes:d})); return; }
  if (a === "boxint") { buzz(); boxSheet(Object.assign({}, sheetState.box, {effort:d})); return; }
  if (a === "boxok") {
    const st = sheetState.box;
    S.sessions.push({
      id:String(Date.now()), date:dayKey(new Date()), ts:Date.now(), kind:"boxing",
      plan:null, type:"Boxen", minutes:st.minutes, effort:st.effort,
      form:formForToday(), note:"", entries:[]
    });
    save(); closeSheet(); buzz(30); summary = null; render(); toTop();
    return;
  }
  if (a === "restask") { restSheet(); return; }
  if (a === "restok") {
    S.sessions.push({
      id:String(Date.now()), date:dayKey(new Date()), ts:Date.now(), kind:"rest",
      plan:null, type:"Pause", minutes:0, effort:null,
      form:formForToday(), note:"", entries:[]
    });
    save(); closeSheet(); render(); toTop();
    return;
  }
  if (a === "effset") {
    const s = S.sessions.find(x => x.id === id);
    if (s) { s.effort = d; save(); }
    closeSheet(); buzz(); render();
    return;
  }

  /* ---- start ---- */
  if (a === "start") { buzz(14); closeSheet(); startSession(id, S.makeup.slice()); return; }

  /* ---- calendar / filter ---- */
  if (a === "mon") {
    calMonth = d < 0
      ? (calMonth.m === 0 ? {y:calMonth.y-1, m:11} : {y:calMonth.y, m:calMonth.m-1})
      : (calMonth.m === 11 ? {y:calMonth.y+1, m:0} : {y:calMonth.y, m:calMonth.m+1});
    render(); return;
  }
  if (a === "filter") { filter = id; render(); return; }

  /* ---- settings ---- */
  if (a === "bw" || a === "rest") {
    buzz();
    const key = a === "bw" ? "bodyweight" : "rest";
    let v = S.settings[key] + d;
    v = key === "rest" ? Math.min(600, Math.max(15, v)) : Math.max(0, v);
    S.settings[key] = v; save(); render(); return;
  }
  if (a === "bw-edit" || a === "rest-edit") {
    const key = a === "bw-edit" ? "bodyweight" : "rest";
    numSheet({
      title: key === "rest" ? "Satzpause" : "Körpergewicht",
      sub: key === "rest" ? "in Sekunden" : "in Kilogramm",
      value:S.settings[key], quick: key === "rest" ? [-30,-15,15,30] : [-1,-0.5,0.5,1],
      apply:v => { S.settings[key] = key === "rest" ? Math.min(600, Math.max(15, v)) : v; save(); render(); }
    });
    return;
  }
  if (a === "sound") { S.settings.sound = id === "1"; save(); render(); return; }
  if (a === "plate") {
    const p = parseFloat(id);
    const arr = (S.settings.plates || []).slice();
    const k = arr.indexOf(p);
    if (k >= 0) arr.splice(k, 1); else arr.push(p);
    S.settings.plates = arr.sort((x,y) => x-y);
    save(); render(); return;
  }
  if (a === "export") { exportBackup(); return; }
  if (a === "import") { importBackup(); return; }
  if (a === "update") { checkUpdate(); return; }
  if (a === "reset") {
    if (confirm("Alle Einheiten, Gewichte und Einstellungen löschen? Das lässt sich nicht rückgängig machen.")) {
      S = EMPTY(); save(); route = null; render(); msg("Alles zurückgesetzt.");
    }
    return;
  }

  /* ---- plan editing ---- */
  if (a === "exmove") {
    const pl = editablePlans()[id];
    const j = i + d;
    if (j < 0 || j >= pl.ex.length) return;
    const t = pl.ex[i]; pl.ex[i] = pl.ex[j]; pl.ex[j] = t;
    save(); buzz(); render(); return;
  }
  if (a === "exdel") {
    const pl = editablePlans()[id];
    if (pl.ex.length <= 1) return;
    if (confirm(exName(pl.ex[i].id) + " aus " + pl.title + " entfernen?")) { pl.ex.splice(i,1); save(); render(); }
    return;
  }
  if (a === "extune") { tuneSheet(id, i); return; }
  if (a === "exswap") { swapSheet(id, i, "swap"); return; }
  if (a === "exadd") { swapSheet(id, 0, "add"); return; }
  if (a === "exswapDo") {
    const pl = editablePlans()[id];
    pl.ex[i] = Object.assign({}, pl.ex[i], {id:el.dataset.x});
    save(); closeSheet(); render(); return;
  }
  if (a === "exaddDo") {
    const pl = editablePlans()[id];
    pl.ex.push({id:el.dataset.x, sets:3, min:8, max:12});
    save(); closeSheet(); render(); return;
  }
  if (a === "tmode") {
    const st = sheetState, pl = editablePlans()[st.planId], e = pl.ex[st.i];
    if (d === 1 && !e.total) e.total = [Math.max(8, e.sets*e.min), Math.max(12, e.sets*e.max)];
    else if (d === 0 && e.total) delete e.total;
    save(); tuneSheet(st.planId, st.i); render(); return;
  }
  if (a === "tsets" || a === "tmin" || a === "tmax" || a === "tlo" || a === "thi" || a === "tinc") {
    const st = sheetState, pl = editablePlans()[st.planId], e = pl.ex[st.i];
    if (a === "tsets") e.sets = Math.max(1, Math.min(12, e.sets + d));
    if (a === "tmin")  e.min  = Math.max(1, Math.min(50, e.min + d));
    if (a === "tmax")  e.max  = Math.max(e.min, Math.min(60, e.max + d));
    if (a === "tlo")   e.total[0] = Math.max(1, e.total[0] + d);
    if (a === "thi")   e.total[1] = Math.max(e.total[0], e.total[1] + d);
    if (a === "tinc")  setCfg(e.id, {inc:Math.max(0.25, Math.round((incOf(e.id) + d)*100)/100)});
    if (e.min > e.max) e.max = e.min;
    save(); buzz(); tuneSheet(st.planId, st.i); render(); return;
  }

  /* ---- per-exercise config ---- */
  if (a === "exopts") { exOptsSheet(id); return; }
  if (a === "ps") {
    const v = d === 1;
    if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {perSide:v});
    setCfg(id, {perSide:v});
    exOptsSheet(id); render(); return;
  }
  if (a === "ecc" || a === "chain") {
    const key = a;
    const cur = (S.active && S.active.cfg[id] ? +S.active.cfg[id][key] : +cfgOf(id)[key]) || 0;
    const v = Math.max(0, cur + d);
    if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {[key]:v});
    setCfg(id, {[key]:v});
    buzz(); exOptsSheet(id); render(); return;
  }
  if (a === "ecc-edit" || a === "chain-edit") {
    const key = a === "ecc-edit" ? "ecc" : "chain";
    const cur = (S.active && S.active.cfg[id] ? +S.active.cfg[id][key] : +cfgOf(id)[key]) || 0;
    numSheet({title: key === "ecc" ? "Exzentrisch zusätzlich" : "Kette", sub:"in Kilogramm", value:cur,
      quick:[-5,-1,1,5],
      apply:v => {
        if (S.active) S.active.cfg[id] = Object.assign(S.active.cfg[id] || {}, {[key]:v});
        setCfg(id, {[key]:v}); render();
      }});
    return;
  }

  /* ---- live session ---- */
  if (!S.active) return;
  const list = activeExList();
  const cfg = id ? list.find(x => x.id === id) : null;

  if (a === "weight") {
    buzz();
    const v = Math.max(0, snapTo(S.active.weights[id] + d, incOf(id)));
    S.active.weights[id] = v; save();
    const holder = el.parentNode.querySelector("[data-a$='-edit']");
    if (holder) holder.innerHTML = kg(v) + ((isBw(id) && v === 0) ? '' : '<small>kg</small>');
    updateDuel(); return;
  }
  if (a === "weight-edit") {
    numSheet({
      title:exName(id), sub:isBw(id) ? "Zusatzgewicht am Gürtel" : "Gewicht in Kilogramm",
      value:S.active.weights[id], plates:isBw(id),
      quick:isBw(id) ? [-2.5,-1.25,1.25,2.5] : [-5,-1,1,5],
      apply:v => { S.active.weights[id] = v; save(); render(); }
    });
    return;
  }
  if (a === "reps") {
    buzz();
    const s = S.active.sets[id][i];
    s.reps = Math.max(0, s.reps + d); save();
    const row = document.querySelector('[data-row="'+id+':'+i+'"]');
    if (row) row.querySelector(".reps").textContent = s.reps;
    updateSub(cfg); updateDuel(); return;
  }
  if (a === "log") {
    const s = S.active.sets[id][i];
    s.done = !s.done; save(); buzz(13);
    const row = document.querySelector('[data-row="'+id+':'+i+'"]');
    if (row) {
      row.classList.toggle("done", s.done);
      row.querySelector('[data-a="log"]').classList.toggle("on", s.done);
    }
    if (s.done) startRest(id);
    updateSub(cfg); updateCount(); updateDuel(); updateBody(); return;
  }
  if (a === "addset") {
    const arr = S.active.sets[id];
    arr.push({reps: arr.length ? arr[arr.length-1].reps : (cfg ? cfg.max : 8), done:false});
    save();
    const box = document.querySelector('[data-sets="'+id+'"]');
    if (box) box.insertAdjacentHTML("beforeend", setRow(cfg, arr[arr.length-1], arr.length-1));
    updateCount(); return;
  }
  if (a === "skiprest") { S.rest = null; save(); renderRest(); return; }
  if (a === "finish") { finishSession(); return; }
  if (a === "cancel") {
    if (confirm("Training verwerfen? Die Sätze gehen verloren.")) {
      S.active = null; S.rest = null; keepAwake(false); save(); route = null; render(); toTop();
    }
    return;
  }
});

/* Laufende Summe der abgehakten Wiederholungen. Genau das will man beim
   Klimmzugsatz sehen, ohne im Kopf mitzurechnen. */
function updateSub(cfg){
  if (!cfg || !S.active || !S.active.sets[cfg.id]) return;
  const sum = S.active.sets[cfg.id].filter(s => s.done).reduce((a,s) => a + s.reps, 0);
  const c = document.querySelector('[data-cnt="'+cfg.id+'"]');
  if (c) { c.textContent = sum; c.classList.toggle("on", sum > 0); }
  if (cfg.total) {
    const el = document.querySelector('[data-sub="'+cfg.id+'"]');
    if (el) el.textContent = 'Ziel ' + cfg.total[0] + '–' + cfg.total[1] + ' Wdh. gesamt';
  }
}
/* Sets belonging to a skipped exercise must leave the denominator, otherwise the
   ring can never close and the count reads unfinished for the rest of the session. */
function sessionProgress(){
  const a = S.active;
  let done = 0, total = 0;
  activeExList().forEach(e => {
    if ((a.skipped || {})[e.id]) return;
    (a.sets[e.id] || []).forEach(s => { total++; if (s.done) done++; });
  });
  return {done:done, total:total};
}
/* Nur die Figur neu zeichnen, nicht die Ansicht — render() waehrend einer
   Einheit wuerde Eingabefokus und Scrollstand verlieren. */
function updateBody(){
  const el = document.getElementById("sessbody");
  if (el && S.active) el.innerHTML = silhouette(sessionBodyState(), true);
  const u = document.getElementById("uebrig");
  if (u && S.active) u.textContent = sessionLeftMin();
  const d = document.getElementById("shdots");
  if (d && S.active) d.innerHTML = muscleDots(sessionBodyState());
}

function updateCount(){
  const prog = sessionProgress();
  const done = prog.done, total = prog.total;
  const el = document.getElementById("cnt");
  if (el) el.textContent = done + ' / ' + total;
  if (!S.rest) ringZeigen(null);
  const btn = document.querySelector('[data-a="finish"]');
  if (btn) done ? btn.removeAttribute("disabled") : btn.setAttribute("disabled", "");
}
/* Before the first set is logged a percentage would always read -100 %, which is
   true but useless. Show the target to beat instead, and switch to the delta
   once there is something to compare. */
function duelLabel(cur, ref){
  if (!ref) return "erste Einheit";
  if (!cur) return "zu schlagen: " + (Math.round(ref/100)/10) + " t";
  const p = Math.round((cur - ref) / ref * 100);
  return (p >= 0 ? '+' : '') + p + ' % vs. letztes Mal';
}
function updateDuel(){
  const a = S.active;
  if (!a) return;
  let cur = 0, ref = 0;
  activeExList().forEach(e => {
    const c = a.cfg[e.id] || {};
    cur += tonnage({id:e.id, bw:isBw(e.id), weight:a.weights[e.id], perSide:!!c.perSide,
                    reps:(a.sets[e.id]||[]).filter(s => s.done).map(s => s.reps)});
    const le = lastEntry(e.id);
    if (le) ref += tonnage(le.entry);
  });
  const el = document.getElementById("duel");
  if (!el) return;
  el.textContent = duelLabel(cur, ref);
  el.classList.toggle("on", !!(ref && cur && cur >= ref));
}

/* ================================================================== boot */
load();
askPersist();
render();
tickRest();
if ("serviceWorker" in navigator) {
  /* When a new worker takes over, reload once so the user actually sees the update
     instead of the previously cached shell. All state lives in localStorage, so a
     reload mid-session loses nothing. Guarded on there having been a controller
     before, otherwise the very first visit would reload for no reason. */
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
