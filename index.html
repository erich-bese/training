/* Alles, was die Einheiten vorbereitet: was als Naechstes ansteht, woraus die
   Plaene bestehen, wie lange sie dauern. Frueher lag das verstreut auf der
   Startseite und unter "Mehr". */
function viewPlan(){
  let h = '<h1>Plan</h1>';

  /* Wochenvorschau — nur wenn ueberhaupt etwas vorgeschlagen wird */
  const vorschau = weekAhead();
  if (vorschau.some(t => t.pid)) {
    h += '<div class="stack"><div class="eyebrow"><span>Nächste sieben Tage</span>'
      + '<span class="faint">Vorschau</span></div><div class="card"><div class="week7">'
      + vorschau.map((t, i) => {
          const klasse = t.type === "Pull" ? "pull" : t.type === "Push" ? "push"
                       : t.type === "Beine" ? "beine" : "frei";
          return '<div class="w7d '+klasse+(i === 0 ? " heute" : "")+'">'
            + '<span class="w7n">'+(i === 0 ? "Heute" : DAYS_SHORT[new Date(t.ts).getDay()])+'</span>'
            + '<i></i><span class="w7p">'+(t.type || (t.erledigt ? "Fertig" : "Frei"))+'</span></div>';
        }).join("")
      + '</div><div class="note" style="margin-top:13px">'
      + 'Gerechnet unter der Annahme, dass du dem Vorschlag folgst — jede Einheit '
      + 'verschiebt die folgenden. Tagesform und Lust schlagen die Rechnung.'
      + '</div></div></div>';
  }


  h += '<div class="stack"><div class="eyebrow"><span>Deine Pläne</span>'
    + '<span class="faint">Dauer · Sätze</span></div><div class="card">'
    + Object.keys(plans()).map((pid, i) => {
        const pl = planOf(pid), d = planDuration(pid);
        return '<div class="planrow'+(i ? " tr" : "")+'" data-a="planedit" data-id="'+pid+'">'
          + exIcon(pl.ex[0].id, 34, 45)
          + '<div class="body"><div class="nm">'+esc(pl.title)+'</div>'
          + '<div class="sc">'+pl.ex.length+' Übungen · zuletzt '+lastPlanLabel(pid)+'</div></div>'
          + '<div class="pdur"><span class="num">'+d.minuten+'</span><small>min</small>'
          + '<div class="foot">'+d.saetze+' Sätze</div></div></div>';
      }).join("")
    + '</div><div class="note" style="margin-top:13px">'
    + 'Die Dauer ist ein Sollwert: Satzzeit plus die Pausen der Übungen. '
    + 'Wer zwischendurch am Handy hängt, braucht länger — genau das ist der Punkt.'
    + '</div></div>';

  h += '<div class="stack"><button class="btn ghost" data-a="planlist">Trainingsplan bearbeiten</button></div>';
  return h;
}

/* ---------------------------------------------------------- view: verlauf */
/* Drei Werte unter dem Titel. Sie beantworten beim Aufschlagen der App die
   Fragen, die man sich ohnehin zuerst stellt: Bin ich dran? Wie lief die
   Woche? Wann war ich zuletzt da? */
function heroStats(){
  const wochen = weekCounts();
  const woche = wochen[weekKey(new Date())] || 0;
  /* sessionTime statt s.ts: Einheiten aus der Zeit vor den Zeitstempeln haben
     nur ein Datum und wuerden sonst als "nie" gelten. */
  const letzte = S.sessions.reduce((m, s) => Math.max(m, sessionTime(s)), 0);
  const herTage = letzte ? Math.max(0, Math.floor((Date.now() - letzte) / 86400000)) : null;

  const cell = (wert, einheit, label, farbe) =>
    '<div class="hstat"><span class="hs-v'+(farbe ? " "+farbe : "")+'">' + wert
    + (einheit ? '<small>'+einheit+'</small>' : '') + '</span>'
    + '<span class="hs-l">'+label+'</span></div>';

  return '<div class="herostats">'
    + cell(streak(), streak() === 1 ? "Tag" : "Tage", "Serie", "amber")
    + cell(woche, woche === 1 ? "Einheit" : "Einheiten", "Diese Woche", "cool")
    + cell(herTage === null ? "—" : herTage === 0 ? "heute" : herTage,
           herTage === null || herTage === 0 ? "" : herTage === 1 ? "Tag" : "Tage",
           "Zuletzt", herTage === 0 ? "word" : "")
    + '</div>';
}

function weekCounts(){
  const w = {};
  S.sessions.forEach(s => { const k = weekKey(parseDay(s.date)); w[k] = (w[k]||0) + 1; });
  return w;
}

function viewVerlauf(){
  if (!calMonth) { const n = new Date(); calMonth = {y:n.getFullYear(), m:n.getMonth()}; }
  const byDay = {};
  S.sessions.forEach(s => byDay[s.date] = s);
  const first = new Date(calMonth.y, calMonth.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
  const todayK = dayKey(new Date());

  let cells = "";
  for (let i = 0; i < offset; i++) cells += '<div></div>';
  for (let i = 1; i <= days; i++) {
    const k = dayKey(new Date(calMonth.y, calMonth.m, i));
    const s = byDay[k];
    /* Die ganze Zelle traegt die Farbe, nicht ein Punkt von vier Pixeln
       darunter. Der war auf dem Telefon schlicht nicht zu erkennen — und
       ein Kalender, dessen Kennzeichnung man suchen muss, sagt nichts aus.
       Die Farbe kommt als eigene Variable herein, damit die Regeln im
       Stylesheet stehen koennen: Inline-Stile schlagen jede spaetere Regel,
       und genau das hat hier schon einmal Aerger gemacht. */
    const farbe = s ? (TYPE_COLOR[s.type] || "var(--bone)") : "";
    /* Ruhetag ist etwas anderes als "nichts": bewusst pausiert, nicht
       ausgefallen. Er bekommt deshalb ein eigenes, ruhiges Zeichen. */
    const art = !s ? "" : s.kind === "rest" ? " ruht" : " has";
    const kurz = !s ? "" : s.kind === "rest" ? ""
      : (s.kind === "boxing" ? TYPE_KURZ.Boxen : (TYPE_KURZ[s.type] || (s.type || "").slice(0, 2)));
    cells += '<div class="day'+art+(k===todayK?" today":"")+'"'
      + (farbe ? ' style="--tc:'+farbe+'"' : '')
      + (s?' data-a="open" data-id="'+s.id+'"':'')+'>'
      + '<span>'+i+'</span>'
      + (kurz ? '<i class="tag7">'+esc(kurz)+'</i>' : s ? '<i class="ruhepunkt"></i>' : '')
      + '</div>';
  }

  const list = S.sessions.filter(s => filter === "Alle" || s.type === filter).slice().reverse();

  return '<h1>Verlauf</h1>'
    + '<div class="card stack"><div class="row" style="margin-bottom:17px">'
    + '<button class="rb xs" data-a="mon" data-d="-1">'+I.left+'</button>'
    + '<div style="font-size:14.5px;font-weight:620;letter-spacing:-.01em">'
    + first.toLocaleDateString("de-DE",{month:"long", year:"numeric"})+'</div>'
    + '<button class="rb xs" data-a="mon" data-d="1">'+I.right+'</button></div>'
    + '<div class="cal">' + ["M","D","M","D","F","S","S"].map(d => '<div class="dow">'+d+'</div>').join("")
    + cells + '</div>'
    + '<div class="hair"></div>'
    /* Die Legende zeigt dasselbe Zeichen wie der Kalender selbst — vorher
       standen dort drei duenne Striche ueber drei Woertern, die man nicht
       zueinander zuordnen konnte. */
    + '<div class="calleg">'
    + ['Pull','Push','Beine','Boxen'].map(t =>
        '<div class="callegp" style="--tc:'+TYPE_COLOR[t]+'">'
        + '<i class="callegk">'+TYPE_KURZ[t]+'</i>'
        + '<span>'+t+'</span></div>').join("")
    + '<div class="callegp"><i class="callegr"></i><span>Pause</span></div>'
    + '</div></div>'
    + '<div class="chips">' + ["Alle","Pull","Push","Beine","Ganzkörper","Boxen"].map(f =>
        '<button class="chip'+(filter===f?" on":"")+'" data-a="filter" data-id="'+f+'">'+f+'</button>').join("") + '</div>'
    + (list.length ? list.map(s => sessionCard(s)).join("")
      : '<div class="note" style="padding:12px 4px">Noch keine Trainings gespeichert.</div>')
    + '<button class="btn ghost" data-a="addpast" style="margin-top:16px">Einheit nachtragen</button>'
    + '<div class="note" style="padding:11px 4px 0">Für Trainings, die du vergessen hast einzutragen.</div>';
}

function sessionCard(s){
  if (s.kind === "rest" || s.kind === "boxing") {
    const isBox = s.kind === "boxing";
    return '<div class="card tight" data-a="open" data-id="'+s.id+'" style="margin-bottom:9px">'
      + '<div class="row"><div style="min-width:0">'
      + '<div style="font-size:15px;font-weight:620;letter-spacing:-.018em">'
      + (isBox ? 'Boxen' : 'Pause') + '</div>'
      + '<div class="note" style="margin-top:4px">'+dateShort(s.date)
      + (spanneText(s) ? ' · '+spanneText(s) : '')
      + (isBox ? ' · '+s.minutes+' min · Intensität '+(s.effort||3)+'/5' : ' · bewusster Ruhetag')+'</div></div>'
      + '<div style="text-align:right;flex-shrink:0;margin-left:12px">'
      + '<i class="dotlv" style="background:'+(TYPE_COLOR[s.type]||"var(--faint)")+'"></i>'
      + '<div class="faint" style="font-size:11px;margin-top:6px">ansehen ›</div>'
      + '</div></div></div>';
  }
  const logged = s.entries.filter(e => e.reps.length);
  const sets = logged.reduce((a,e) => a + e.reps.length, 0);
  const ton = logged.reduce((a,e) => a + tonnage(e), 0);
  const skipped = s.entries.filter(e => e.skipped).length;
  return '<div class="card tight" data-a="open" data-id="'+s.id+'" style="margin-bottom:9px">'
    + '<div class="row"><div style="min-width:0">'
    + '<div style="font-size:15px;font-weight:620;letter-spacing:-.018em">'+esc((planOf(s.plan)||{}).title || s.type)+'</div>'
    + '<div class="note" style="margin-top:4px">'+dateShort(s.date)
    + (spanneText(s) ? ' · '+spanneText(s) : '')
    + (s.minutes ? ' · '+s.minutes+' min' : '')+' · '+sets+' Sätze'
    + (skipped ? ' · <span class="amber">'+skipped+' offen</span>' : '')+'</div></div>'
    + '<div style="text-align:right;flex-shrink:0;margin-left:12px">'
    + '<div class="num dim" style="font-size:15px">'+Math.round(ton/1000*10)/10+'<span class="muted" style="font-size:11px;font-family:var(--sans);letter-spacing:0"> t</span></div>'
    + '<div class="faint" style="font-size:11px;margin-top:4px">ansehen ›</div>'
    + '</div></div></div>';
}

/* -------------------------------------------------- view: session details */
/* Korrektur einer bereits gespeicherten Einheit. Bewusst dieselben Bedienelemente
   wie im Training, damit nichts neu gelernt werden muss. */
function editSessionView(s){
  let h = '<div class="topbar"><button class="back" data-a="editdone">'+I.left+' Fertig</button>'
    + '<span class="tag on">Korrekturmodus</span></div>'
    + '<div style="font-size:25px;font-weight:700;letter-spacing:-.035em">'
    + esc((planOf(s.plan)||{}).title || s.type)+'</div>'
    + '<div class="note" style="margin:8px 0 16px">'+dateLong(s.date)+'</div>'
    /* Beginn und Dauer stehen ganz oben und sind antippbar. Whoop traegt eine
       Einheit nicht immer selbst ein; dann traegt er sie dort nach und braucht
       dafuer die genaue Uhrzeit. Ohne diese Zeile war sie nirgends zu sehen —
       gespeichert war sie die ganze Zeit. */
    + '<button class="card zeitkarte" data-a="zeitedit" data-id="'+s.id+'">'
    + '<div class="zeitrow"><span class="note">Trainiert</span>'
    + '<span class="zeitwert">'+(spanneText(s) || 'keine Uhrzeit')+'</span></div>'
    + '<div class="zeitrow"><span class="note">Dauer</span>'
    + '<span class="zeitwert">'+(s.minutes ? s.minutes + ' min' : 'keine Angabe')+'</span></div>'
    + '<div class="hnote" style="margin-top:9px">Antippen zum Ändern — etwa wenn '
    + 'du eine Einheit in Whoop nachtragen willst.</div></button>';

  if (!s.entries.length) {
    h += '<div class="card stack"><div class="lead">Noch keine Übung erfasst.</div>'
      + '<div class="note" style="margin-top:6px">Füge unten die Übungen des Plans hinzu.</div></div>';
  }

  h += s.entries.map(e => {
    const step = incOf(e.id);
    return '<div class="card" style="margin-bottom:9px">'
      + '<div class="exhead">' + exIcon(e.id, 42, 56)
      + '<div class="body"><div class="nm">'+esc(exName(e.id))+'</div>'
      + (e.variant ? '<div class="var">'+esc(e.variant)+'</div>' : '')
      + '<div class="sub">'+(e.skipped ? 'ausgefallen · '+esc(e.skipped.reason) : e.reps.length+' Sätze')+'</div></div>'
      + '<button class="rb xs" data-a="eexdel" data-id="'+e.id+'">'+I.trash+'</button></div>'
      + '<div class="row" style="margin-bottom:13px"><span class="note">'
      + (e.bw ? 'Zusatzgewicht' : e.perSide ? 'pro Seite' : 'Gewicht')+'</span>'
      + '<div class="step">'
      + '<button class="rb xs" data-a="ew" data-id="'+e.id+'" data-d="-'+step+'">'+I.minus+'</button>'
      + '<button class="val num" data-a="ew-edit" data-id="'+e.id+'">'+kg(e.weight)
      + (e.bw && !e.weight ? '' : '<small>kg</small>')+'</button>'
      + '<button class="rb xs" data-a="ew" data-id="'+e.id+'" data-d="'+step+'">'+I.plus+'</button></div></div>'
      + e.reps.map((r,i) =>
          '<div class="set"><span class="idx">'+(i+1)+'</span><div class="mid">'
          + '<button class="rb xs" data-a="er" data-id="'+e.id+'" data-i="'+i+'" data-d="-1">'+I.minus+'</button>'
          + '<div class="reps num">'+r+'</div>'
          + '<button class="rb xs" data-a="er" data-id="'+e.id+'" data-i="'+i+'" data-d="1">'+I.plus+'</button></div>'
          + '<button class="rb xs" data-a="erdel" data-id="'+e.id+'" data-i="'+i+'">'+I.x+'</button></div>').join("")
      + '<button class="addset" data-a="eradd" data-id="'+e.id+'">+ Satz</button>'
      + '</div>';
  }).join("");

  h += '<div class="stack" style="margin-top:18px">'
    + '<button class="btn ghost" data-a="eexadd">Übung hinzufügen</button>'
    + '<button class="btn danger" data-a="delsession" data-id="'+s.id+'" style="margin-top:10px">Einheit löschen</button>'
    + '</div>';
  return h;
}

function viewSessionDetail(id){
  const s = S.sessions.find(x => x.id === id);
  if (!s) { route = null; return viewVerlauf(); }

  /* Boxen und Pausen haben keine Saetze — eigene, kurze Ansicht */
  if (s.kind === "rest" || s.kind === "boxing") {
    const isBox = s.kind === "boxing";
    const load = sessionLoad(s, prsFrom(S.sessions));
    const hit = MUSCLES.filter(m => (load[m] || 0) > 0.2)
                       .sort((a,b) => (load[b]||0) - (load[a]||0));
    return '<div class="topbar"><button class="back" data-a="closeroute">'+I.left+' Verlauf</button>'
      + '<button class="rb xs" data-a="delsession" data-id="'+s.id+'">'+I.trash+'</button></div>'
      + '<div style="font-size:29px;font-weight:700;letter-spacing:-.038em">'+(isBox?'Boxen':'Pause')+'</div>'
      + '<div class="note" style="margin:9px 0 24px">'+dateLong(s.date)+'</div>'
      + (isBox
        ? '<div class="grid2 stack">'
          + '<div class="card stat"><div class="lbl">'+I.clock+' Dauer</div>'
          + '<span class="big num" style="font-size:27px">'+(s.minutes || '—')+'</span>'+(s.minutes ? '<span class="unit">min</span>' : '')+'</div>'
          + '<div class="card stat"><div class="lbl">'+I.bolt+' Intensität</div>'
          + '<span class="big num" style="font-size:27px">'+(s.effort||3)+'</span><span class="unit">/ 5</span></div>'
          + '</div>'
          + (hit.length ? '<div class="stack"><div class="eyebrow">Belastet vor allem</div><div class="card">'
              + hit.map(m => '<div class="mrow"><span class="nm2">'+MUSCLE_LABEL[m]+'</span>'
                + '<span class="num muted" style="font-size:12.5px">'+(Math.round(load[m]*10)/10)+' Sätze</span></div>').join("")
              + '</div></div>' : '')
        : '<div class="card"><div class="lead">Bewusster Ruhetag. Zählt für deine Serie und erzeugt keine Belastung.</div></div>');
  }

  const idx = S.sessions.indexOf(s);
  const prev = S.sessions.slice(0, idx).reverse().find(x => x.plan === s.plan);
  const logged = s.entries.filter(e => e.reps.length);
  const ton = logged.reduce((a,e) => a + tonnage(e), 0);
  const prevTon = prev ? prev.entries.reduce((a,e) => a + tonnage(e), 0) : 0;
  const delta = prevTon ? Math.round((ton - prevTon) / prevTon * 100) : null;
  const reps = logged.reduce((a,e) => a + e.reps.reduce((x,r)=>x+r,0), 0);

  /* Korrekturmodus: eine falsch getippte Zahl hat sonst dauerhaft Bestand und
     verfaelscht ueber die Steigerungslogik auch alle folgenden Einheiten. */
  if (route.edit) return editSessionView(s);

  let h = '<div class="topbar"><button class="back" data-a="closeroute">'+I.left+' Verlauf</button>'
    + '<div style="display:flex;gap:6px">'
    + '<button class="tag" data-a="editsession">Korrigieren</button>'
    + '<button class="rb xs" data-a="delsession" data-id="'+s.id+'">'+I.trash+'</button></div></div>'
    + '<div style="font-size:29px;font-weight:700;letter-spacing:-.038em;line-height:1.05">'
    + esc((planOf(s.plan)||{}).title || s.type)+'</div>'
    + '<div class="note" style="margin:9px 0 24px">'+dateLong(s.date)+'</div>';

  h += '<div class="grid2 stack">'
    + '<div class="card stat"><div class="lbl">'+I.scale+' Tonnage</div><span class="big num" style="font-size:27px">'
    + Math.round(ton/1000*10)/10+'</span><span class="unit">t</span>'
    + '<div class="foot">'+(delta === null ? 'kein Vergleich' : (delta>=0?'+':'')+delta+' % vs. letztes Mal')+'</div></div>'
    + '<div class="card stat"><div class="lbl">'+I.clock+' Dauer</div><span class="big num" style="font-size:27px">'
    + (s.minutes || '—')+'</span>'+(s.minutes ? '<span class="unit">min</span>' : '')+'<div class="foot">'+reps+' Wiederholungen</div></div>'
    + '</div>';

  h += '<div class="stack"><div class="eyebrow"><span>Übungen</span><span class="faint">tippen für Verlauf</span></div>';
  h += s.entries.map(e => {
    const c = prev ? prev.entries.find(x => x.id === e.id && x.reps.length) : null;
    const badges = [];
    if (e.perSide) badges.push('<span class="tag">pro Seite</span>');
    if (e.ecc) badges.push('<span class="tag on">Exz. +'+kg(e.ecc)+'</span>');
    if (e.chain) badges.push('<span class="tag on">Kette +'+kg(e.chain)+'</span>');
    if (e.skipped) {
      return '<div class="card tight" style="margin-bottom:9px"><div class="exrow skip" style="padding:0">'
        + exIcon(e.id, 38, 50) + '<div class="body"><div class="nm">'+esc(exName(e.id))+'</div>'
        + '<div class="sc" style="text-decoration:none">Ausgefallen · '+esc(e.skipped.reason || "kein Grund")+'</div></div></div></div>';
    }
    if (!e.reps.length) return "";
    const sum = e.reps.reduce((a,r)=>a+r,0);
    return '<div class="card tight" data-a="openex" data-id="'+e.id+'" style="margin-bottom:9px">'
      + '<div class="exhead" style="margin-bottom:11px">'+exIcon(e.id, 42, 56)
      + '<div class="body"><div class="nm">'+esc(exName(e.id))+'</div>'
      + (e.variant ? '<div class="var">'+esc(e.variant)+'</div>' : '')
      + '<div class="sub">'+e.reps.length+' Sätze · '+sum+' Wdh. · '
      + (e.bw && !e.weight ? 'Körpergewicht' : kg(e.weight)+' kg'+(e.perSide?'/Seite':''))+'</div>'
      + (badges.length ? '<div class="badges">'+badges.join("")+'</div>' : '')
      + '</div></div>'
      + '<div class="num dim" style="font-size:15px;letter-spacing:-.02em">'+e.reps.join(' · ')+'</div>'
      + (e.note ? '<div class="note" style="margin-top:9px">'+esc(e.note)+'</div>' : '')
      + (c ? '<div class="lasttime">'+I.clock+'<span>Letztes Mal <b>'+c.reps.join('·')+'</b> @ <b>'+kg(c.weight)+' kg</b></span></div>' : '')
      + '</div>';
  }).join("");
  h += '</div>';

  if (s.note) h += '<div class="stack"><div class="eyebrow">Notiz</div><div class="card"><div class="lead">'+esc(s.note)+'</div></div></div>';
  return h;
}

/* ------------------------------------------------- view: exercise details */
function viewExercise(exId){
  const hist = historyOf(exId);
  const pr = prsFrom(S.sessions)[exId] || {};
  const c = cfgOf(exId);

  let h = '<div class="topbar"><button class="back" data-a="closeroute">'+I.left+' Zurück</button></div>'
    /* exIcon statt glyph: die Detailansicht hat die Zeichnung frueher gar
       nicht erst versucht und immer das Ersatzsymbol gezeigt. */
    + '<div style="display:flex;gap:15px;align-items:center;margin-bottom:24px">'
    + '<button class="artbtn" data-a="artzoom" data-id="'+exId+'">'+exIcon(exId,52,68,"lg")+'</button>'
    + '<div><div style="font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.1">'+esc(exName(exId))+'</div>'
    + '<div class="note" style="margin-top:4px">'+(c.variant ? esc(c.variant)+' · ' : '')
    + hist.length+(hist.length === 1 ? ' Einheit' : ' Einheiten')
    + ' · Schritt '+kg(incOf(exId))+' kg</div></div></div>';

  if (!hist.length) {
    h += '<div class="card"><div class="lead">Noch keine Daten für diese Übung.</div></div>';
    return h;
  }

  /* sparkline over estimated 1RM */
  const vals = hist.map(x => x.e1rm);
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const flat = mx - mn < 0.001;
  const span = flat ? 1 : mx - mn;
  const W = 300, H = 40;
  /* A single data point still has to draw something: stretch it into a flat line
     across the full width. A flat series sits on the middle, not on the floor. */
  const raw = vals.length === 1 ? [vals[0], vals[0]] : vals;
  const pts = raw.map((v,i) => {
    const x = i / (raw.length - 1) * W;
    return [x, flat ? H/2 : H - (v - mn) / span * H];
  });
  const line = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ' L'+W+' '+H+' L0 '+H+' Z';

  h += '<div class="card stack"><div class="row" style="margin-bottom:14px">'
    + '<span class="eyebrow" style="padding:0">Geschätztes 1RM</span>'
    + '<span class="num amber" style="font-size:15px">'+kg(Math.round(mx))+' kg</span></div>'
    + '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="rgba(233,166,60,.22)"/><stop offset="1" stop-color="rgba(233,166,60,0)"/>'
    + '</linearGradient></defs>'
    + '<path class="area" d="'+area+'"/><path d="'+line+'"/>'
    + '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="2.6"/>'
    + '</svg>'
    + '<div class="row note" style="margin-top:10px"><span>'+dateShort(hist[0].date)+'</span><span>'+dateShort(hist[hist.length-1].date)+'</span></div>'
    + '</div>';

  h += '<div class="grid2 stack">'
    + '<div class="card stat"><div class="lbl">Beste Last</div><span class="big num" style="font-size:25px">'+kg(Math.max(0, pr.weight||0))+'</span><span class="unit">kg</span></div>'
    + '<div class="card stat"><div class="lbl">Beste Wdh.</div><span class="big num" style="font-size:25px">'+(pr.reps||0)+'</span><span class="unit">Wdh.</span></div>'
    + '</div>';

  h += '<div class="stack"><div class="eyebrow">Jede Einheit</div>';
  h += hist.slice().reverse().map(x =>
      '<div class="card tight" data-a="open" data-id="'+x.sid+'" style="margin-bottom:8px"><div class="row">'
      + '<div><div style="font-size:14px;font-weight:580">'+dateShort(x.date)+'</div>'
      + '<div class="num muted" style="font-size:12.5px;margin-top:4px">'+x.entry.reps.join(' · ')+'</div></div>'
      + '<div style="text-align:right"><div class="num dim" style="font-size:14px">'
      + (x.entry.bw && !x.entry.weight ? 'KG' : kg(x.entry.weight)+' kg')+'</div>'
      + '<div class="faint num" style="font-size:11px;margin-top:4px">1RM '+kg(Math.round(x.e1rm))+'</div></div>'
      + '</div></div>').join("");
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------- view: ziele */
function viewZiele(){
  const pr = prsFrom(S.sessions);
  const wkNow = weekCounts();
  const dieseWoche = wkNow[weekKey(new Date())] || 0;
  const wk = weekCounts();
  const keys = Object.keys(wk).sort().slice(-8);
  const maxW = Math.max.apply(null, [5].concat(keys.map(k => wk[k])));
  const nowKey = weekKey(new Date());
  let volume = 0, reps = 0;
  S.sessions.forEach(s => s.entries.forEach(e => {
    volume += tonnage(e);
    /* Gehaltene Sekunden sind keine Wiederholungen — sie wuerden den Zaehler
       vervielfachen, ohne dass eine einzige dazugekommen waere. */
    if (!istZeit(e.id)) reps += e.reps.reduce((a,r)=>a+r,0);
  }));

  const rec = [
    ["pullup","Meiste Klimmzüge", (pr.pullup||{}).repsAtBw || 0, "Wdh."],
    ["bench","Schwerstes Bankdrücken", (pr.bench||{}).weight || 0, "kg"],
    ["deadlift","Schwerstes Kreuzheben", (pr.deadlift||{}).weight || 0, "kg"],
    ["squat","Schwerste Kniebeuge", (pr.squat||{}).weight || 0, "kg"],
    ["dips","Schwerste Dips", (pr.dips||{}).weight || 0, "kg"]
  ];

  let h = '<h1>Fortschritt</h1>'
    + '<div class="grid2 stack">'
    + '<div class="card stat"><div class="lbl">'+I.flame+' Serie</div><span class="big num">'+streak()+'</span>'
    + '<span class="unit">Tage</span><div class="foot">am Ball geblieben</div></div>'
    + '<div class="card stat"><div class="lbl">'+I.cal+' Diese Woche</div><span class="big num">'+dieseWoche+'</span>'
    + '<span class="unit">Einheiten</span><div class="foot">'+S.sessions.length+' insgesamt</div></div>'
    + '</div>'
    + '<div class="stack"><div class="eyebrow"><span>Hauptziele</span><span class="faint">Etappen</span></div>' + goalsCard(pr) + '</div>';

  h += '<div class="stack"><div class="eyebrow"><span>Einheiten pro Kalenderwoche</span><span class="faint">Ziel 5</span></div>'
    + '<div class="card">'
    + (keys.length
      ? '<div class="weeks">'
        + '<div class="target-line" style="bottom:'+(5/maxW*80+18)+'px"><span>ZIEL 5</span></div>'
        + keys.map(k => {
            const n = wk[k], hgt = n / maxW * 80;
            return '<div class="col"><div class="n">'+n+'</div>'
              + '<b class="'+(k===nowKey?"now":"")+'" style="height:'+Math.max(3,hgt)+'px"></b>'
              + '<div class="lb">KW '+k.split("-")[1]+'</div></div>';
          }).join("")
        + '</div>'
      : '<div class="note">Noch keine Daten.</div>')
    + '</div></div>';

  /* Volumen je Muskelgruppe. Die Karte beantwortet die Frage, die eine
     Faustregel wie "zwei Saetze statt vier" nur behauptet: wie viel kommt
     tatsaechlich an. */
  const vol = wochenSaetze(7);
  h += '<div class="stack"><div class="eyebrow"><span>Sätze je Muskelgruppe</span>'
    + '<span class="faint">letzte 7 Tage</span></div><div class="card">'
    + '<div class="volskala"><span style="left:'+(VOL_MIN/VOL_SKALA*100)+'%">'+VOL_MIN+'</span>'
    + '<span style="left:'+(VOL_MAX/VOL_SKALA*100)+'%">'+VOL_MAX+'</span></div>'
    + MUSCLES.slice().sort((a,b) => vol[b] - vol[a]).map(m => {
        const n = Math.round(vol[m] * 10) / 10;
        const lv = volLevel(n);
        return '<div class="volrow"><span class="nm2">'+MUSCLE_LABEL[m]+'</span>'
          + '<span class="volbar">'
          + '<i class="ziel" style="left:'+(VOL_MIN/VOL_SKALA*100)+'%;right:'
          + (100 - VOL_MAX/VOL_SKALA*100)+'%"></i>'
          + '<b class="'+lv+'" style="width:'+Math.min(100, n/VOL_SKALA*100)+'%"></b></span>'
          + '<span class="volnum '+lv+'">'+kg(n)+'</span></div>';
      }).join("")
    + '<div class="note" style="margin-top:14px;line-height:1.5">'
    + 'Zehn bis zwanzig harte Sätze je Muskel und Woche — das ist der Bereich, in dem '
    + 'der Zuwachs mit der Menge steigt. Nebenarbeit zählt anteilig: Bankdrücken ist '
    + 'ein ganzer Satz für die Brust und ein halber für den Trizeps.</div>'
    + '</div></div>';

  h += '<div class="stack"><div class="eyebrow">Zahlen</div><div class="grid2">'
    + '<div class="card stat"><div class="lbl">Wiederholungen</div><span class="big num" style="font-size:26px">'+reps+'</span></div>'
    + '<div class="card stat"><div class="lbl">Tonnage</div><span class="big num" style="font-size:26px">'
    + (Math.round(volume/1000*10)/10)+'</span><span class="unit">t</span></div></div></div>';

  h += '<div class="stack"><div class="eyebrow">Rekorde</div><div class="card">'
    + rec.map((r,i) => '<div class="exrow"'+(r[2]?' data-a="openex" data-id="'+r[0]+'"':'')+'>'
      + exIcon(r[0], 40, 52, r[2]?"on":"") + '<div class="body"><div class="nm">'+r[1]+'</div>'
      + '<div class="sc">'+(r[2]?'tippen für Verlauf':'noch offen')+'</div></div>'
      + '<div class="num '+(r[2]?"":"faint")+'" style="font-size:15px">'+(r[2] ? kg(r[2])+' '+r[3] : '–')+'</div></div>').join("")
    + '</div></div>';
  return h;
}

/* -------------------------------------------------------- view: session */
/* Was in dieser Einheit bisher gearbeitet wurde, je Muskelgruppe — gemessen
   an dem, was der ganze Plan bringen wuerde. Damit fuellt sich die Figur ueber
   die Einheit hinweg von grau nach rot: man sieht die eigene Arbeit entstehen,
   statt nur Haken zu setzen. */
/* Muskelgruppen als Punktreihe: in der klebenden Kopfzeile ist kein Platz
   fuer zwei Figuren, die Farbe allein traegt die Information aber schon. */
function muscleDots(st){
  return st.filter(x => x.level !== "neutral").map(x =>
    '<span class="shdot"><i style="background:'+rgbCss(LV_RGB[x.level])+'"></i>'
    + MUSCLE_LABEL[x.id] + '</span>').join("");
}

function sessionBodyState(){
  const a = S.active, plan = planOf(a.plan);
  const best = prsFrom(S.sessions);
  const mach = auswahl => ({
    kind:"lift", effort:3,
    entries: (plan.ex || []).map(e => {
      const c = a.cfg[e.id] || {};
      const saetze = (a.sets[e.id] || []).filter(auswahl);
      return {id:e.id, bw:isBw(e.id), weight:a.weights[e.id], perSide:!!c.perSide,
              reps:saetze.map(s => s.reps)};
    })
  });
  const jetzt = sessionLoad(mach(s => s.done), best);
  const ganz  = sessionLoad(mach(() => true), best);

  return MUSCLES.map(m => {
    const soll = ganz[m] || 0;
    const ist = jetzt[m] || 0;
    const ratio = soll ? Math.min(1, ist / soll) : 0;
    return {id:m, label:MUSCLE_LABEL[m], open:ist, ratio:ratio,
            /* Was der Plan nicht trifft, bleibt neutral — sonst faerbte sich
               die halbe Figur gruen, obwohl dort gar nichts vorgesehen ist. */
            level: !soll ? "neutral" : ratio >= 0.66 ? "rot" : ratio >= 0.33 ? "gelb" : "gruen",
            last:null};
  });
}

/* Verbleibende Zeit: offene Saetze mal Satzzeit plus ihre Pausen. */
function sessionLeftMin(){
  const a = S.active, plan = planOf(a.plan);
  let sek = 0;
  (plan.ex || []).forEach(e => {
    const offen = (a.sets[e.id] || []).filter(s => !s.done);
    offen.forEach(s => { sek += 20 + (s.reps || 8) * 3 + restFor(e.id); });
  });
  return Math.max(0, Math.round(sek / 60));
}

function viewSession(){
  const a = S.active, plan = planOf(a.plan);
  const prog = sessionProgress();
  const done = prog.done, total = prog.total;

  /* live duel: tonnage so far against the same plan last time */
  let cur = 0, ref = 0;
  plan.ex.forEach(e => {
    const c = a.cfg[e.id] || {};
    const mk = {id:e.id, bw:isBw(e.id), weight:a.weights[e.id], perSide:!!c.perSide,
                reps:(a.sets[e.id]||[]).filter(s => s.done).map(s => s.reps)};
    cur += tonnage(mk);
    const le = lastEntry(e.id);
    if (le) ref += tonnage(le.entry);
  });
  const ringR = 22, circ = 2 * Math.PI * ringR;

  let h = '<div class="topbar"><button class="back" data-a="cancel">'+I.left+' Abbrechen</button>'
    + '<span class="tag" id="duel">'+duelLabel(cur, ref)+'</span></div>';

  /* Beim Scrollen durch die Saetze verschwand bisher alles, woran man sich
     orientiert: Plan, Zeit, Restzeit, Satzzahl, Muskeln. Die Kopfzeile bleibt
     deshalb oben stehen und traegt genau das — die Muskelgruppen als Punkte,
     weil die Figuren dafuer zu hoch sind. */
  h += '<div class="sesshead"><div class="card">'
    + '<div class="shrow">'
    + '<svg class="ring" viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="'+ringR+'"/>'
    + '<circle class="val" id="ring" cx="26" cy="26" r="'+ringR+'" stroke-dasharray="'+circ.toFixed(1)+'" '
    + 'stroke-dashoffset="'+(circ * (1 - (total?done/total:0))).toFixed(1)+'"/></svg>'
    + '<div style="flex:1;min-width:0">'
    + '<div class="shtitle">'+esc(plan.title)+'</div>'
    + '<div class="note" style="margin-top:3px"><span id="cnt">'+done+' / '+total+'</span> Sätze · '
    + (laeuft()
        ? '<span id="elapsed">'+elapsedText()+'</span> · noch <span id="uebrig">'+sessionLeftMin()+'</span> min'
        : 'rund '+sessionLeftMin()+' min')
    + '</div></div></div>'
    + '<div class="shdots" id="shdots">'+muscleDots(sessionBodyState())+'</div>'
    /* Vor dem Start traegt die Kopfzeile den Start statt der Uhr. Danach ist
       die Stelle frei fuer die Pause — beide gleichzeitig braeuchte niemand. */
    + (laeuft() ? '' :
        '<div class="startrow">'
        + '<button class="btn" data-a="startnow">Training starten</button>'
        + '<button class="btn ghost" data-a="warmup">Aufwärmen · 3 min</button>'
        + '</div>')
    + '<div id="restslot"></div>'
    + '</div></div>';

  /* Die Arbeit sichtbar machen, waehrend sie passiert. */

  h += plan.ex.map(e => {
    const rows = a.sets[e.id] || [];
    const c = Object.assign({perSide:false, ecc:0, chain:0, variant:""}, a.cfg[e.id] || {});
    const skip = (a.skipped || {})[e.id];
    const sum = rows.filter(s => s.done).reduce((x,s) => x + s.reps, 0);
    const le = lastEntry(e.id);
    const badges = [];
    if (c.perSide) badges.push('<span class="tag">pro Seite</span>');
    if (c.ecc) badges.push('<span class="tag on">Exz. +'+kg(c.ecc)+'</span>');
    if (c.chain) badges.push('<span class="tag on">Kette +'+kg(c.chain)+'</span>');

    if (skip) {
      return '<div class="card tight" style="margin-bottom:9px"><div class="exrow skip" style="padding:0">'
        + exIcon(e.id, 38, 50)+'<div class="body"><div class="nm">'+esc(exName(e.id))+'</div>'
        + '<div class="sc" style="text-decoration:none">Fällt aus · '+esc(skip.reason)+'</div></div>'
        + '<button class="tag" data-a="unskip" data-id="'+e.id+'">zurück</button></div></div>';
    }

    return '<div class="card" style="margin-bottom:9px"><div class="exhead">'+exIcon(e.id, 54, 72)
      + '<div class="body"><div class="nm">'+esc(exName(e.id))+'</div>'
      + (c.variant ? '<div class="var">'+esc(c.variant)+'</div>' : '')
      + '<div class="sub" data-sub="'+e.id+'">'
      + (e.total ? 'Ziel '+e.total[0]+'–'+e.total[1]+' Wdh. gesamt'
                 : e.sets+' × '+(e.min===e.max?e.min:e.min+'–'+e.max)+(istZeit(e.id)?' s':'')) + '</div>'
      + (badges.length ? '<div class="badges">'+badges.join("")+'</div>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:7px;flex-shrink:0">'
      + '<span class="repcount'+(sum?" on":"")+'" data-cnt="'+e.id+'">'+sum+'</span>'
      + '<button class="rb xs" data-a="exopts" data-id="'+e.id+'">'+I.dots+'</button></div></div>'
      + '<div class="row" style="margin-bottom:13px">'
      + '<span class="note">'+(isBw(e.id) ? 'Zusatzgewicht' : c.perSide ? 'pro Seite' : 'Gewicht')+'</span>'
      + stepper("weight", e.id, a.weights[e.id], incOf(e.id), (isBw(e.id) && a.weights[e.id] === 0) ? "" : "kg")
      + '</div>'
      + vorschlagZeile(e.id, a.weights[e.id])
      + aufwaermZeile(e.id, a.weights[e.id])
      + '<div data-sets="'+e.id+'">' + rows.map((s,i) => setRow(e, s, i)).join("") + '</div>'
      + '<button class="addset" data-a="addset" data-id="'+e.id+'">+ Satz</button>'
      /* Eigener Behaelter, damit die Frage sofort nach dem letzten Satz
         erscheinen kann. Vorher entstand sie nur beim naechsten vollstaendigen
         Rendern — und das kam erst nach der Pause, wenn die Ansicht ohnehin
         schon bei der naechsten Uebung stand. Gefragt wurde also nach einem
         Satz, an den man sich kaum noch erinnert. */
      + '<div data-rir="'+e.id+'">' + rirZeile(e.id, rows) + '</div>'
      /* Die Historie haengt an der Uebung, nicht am Plan: Klimmzuege sind in
         Pull Kraft und Pull Volumen dieselbe Uebung. Deshalb muss dastehen, aus
         welcher Einheit die Zahlen stammen — sonst wirkt es widerspruechlich,
         wenn ein "noch nie gemachter" Plan Werte von letztem Mal zeigt. */
      + (le ? '<div class="lasttime">'+I.clock+'<span>Letztes Mal <b>'+le.entry.reps.join('·')+'</b> @ <b>'
          + (le.entry.bw && !le.entry.weight ? 'KG' : kg(le.entry.weight)+' kg')+'</b> · '
          + dateShort(le.session.date)
          + (le.session.plan && le.session.plan !== a.plan
              ? ' · aus ' + esc((planOf(le.session.plan) || {}).title || le.session.type) : '')
          + (le.entry.abbruch ? ' · <b>abgebrochen: '+esc(le.entry.abbruch)+'</b>' : '')
          + '</span></div>' : '')
      + '</div>';
  }).join("");

  /* Die Figur steht am Ende, nicht am Anfang: oben wuerde sie den Weg zu den
     Saetzen versperren, und die Punkte in der Kopfzeile sagen waehrend der
     Einheit dasselbe. Unten ist sie das Bild der geleisteten Arbeit. */
  h += '<div class="stack"><div class="eyebrow"><span>Geleistet</span></div>'
    + '<div class="card sessbody" id="sessbody">' + silhouette(sessionBodyState(), true) + '</div></div>';

  h += '<div style="margin-top:22px"><button class="btn" data-a="finish"'+(done?"":" disabled")+'>Training abschließen</button></div>';
  return h;
}
function setRow(e, s, i){
  return '<div class="set'+(s.done?" done":"")+'" data-row="'+e.id+':'+i+'">'
    + '<span class="idx">'+(i+1)+'</span><div class="mid">'
    + '<button class="rb xs" data-a="reps" data-id="'+e.id+'" data-i="'+i+'" data-d="-'+schrittVon(e.id)+'">'+I.minus+'</button>'
    + '<div class="reps num">'+s.reps+(istZeit(e.id) ? '<small>s</small>' : '')+'</div>'
    + '<button class="rb xs" data-a="reps" data-id="'+e.id+'" data-i="'+i+'" data-d="'+schrittVon(e.id)+'">'+I.plus+'</button></div>'
    + (istZeit(e.id) && !s.done
        ? '<button class="rb uhrbtn" data-a="uhr" data-id="'+e.id+'" data-i="'+i+'">'+I.timer+'</button>'
        : '')
    + '<button class="rb'+(s.done?" on":"")+'" data-a="log" data-id="'+e.id+'" data-i="'+i+'">'+I.check+'</button></div>';
}

/* Der Vorschlag steht direkt unter dem Gewicht — dort, wo die Frage entsteht.
   Steht das Gewicht schon auf dem Vorschlag, verschwindet die Zeile: eine
   Empfehlung, die man bereits befolgt hat, ist nur noch Rauschen. */
function vorschlagZeile(exId, aktuell){
  const v = gewichtVorschlag(exId);
  if (!v) return "";
  if (v.art === "halten") {
    return '<div class="vor halten"><span>' + esc(v.warum)
      + (v.dazu ? ' ' + esc(v.dazu) : '') + ' — Gewicht halten</span></div>';
  }
  const eccJetzt = +(((S.active && S.active.cfg[exId]) || cfgOf(exId)).ecc) || 0;
  const eccZiel = v.eccAuf === undefined ? eccJetzt : v.eccAuf;
  /* Erreicht, nicht gleich. Wer selbst noch hoeher stellt als vorgeschlagen,
     hat den Vorschlag erst recht befolgt — bei reiner Gleichheit stuende dann
     wieder "Vorschlag 11 kg" da, waehrend 15 eingestellt sind. */
  const jetzt = aktuell || 0;
  const erreicht = v.art === "hoch"
    ? jetzt >= v.auf - 0.001 && eccJetzt >= eccZiel
    : Math.abs(jetzt - v.auf) < 0.001 && eccJetzt === eccZiel;
  /* Beide Groessen in einer Zeile — sie gehoeren zusammen, und getrennt
     stuenden zwei Vorschlaege untereinander, von denen man einen uebersieht. */
  const ziel = kg(v.auf) + ' kg'
    + (eccZiel !== eccJetzt ? ' · exzentrisch +' + kg(eccZiel) : '');

  if (erreicht) {
    return '<div class="vor an"><span>' + kg(jetzt) + ' kg'
      + (eccJetzt ? ' · exz. +' + kg(eccJetzt) : '') + ' übernommen · ' + esc(v.warum) + '</span></div>';
  }
  return '<button class="vor ' + v.art + '" data-a="vorok" data-id="' + exId + '" data-d="' + v.auf + '"'
    + ' data-e="' + eccZiel + '">'
    + '<span><b>' + (v.art === "hoch" ? "Vorschlag " : "Zurück auf ") + ziel + '</b> · '
    + esc(v.warum) + (v.dazu ? ' ' + esc(v.dazu) : '') + '</span>'
    + '<span class="vortag">Übernehmen</span></button>';
}

/* Die Aufwaermstufen ueber dem ersten Arbeitssatz — dort, wo man sie braucht.
   Sie verschwinden, sobald der erste Arbeitssatz steht: danach sind sie
   erledigt und nur noch im Weg. Abgehakt wird zum Mitzaehlen, gespeichert
   wird nichts davon; ins Volumen und in die Erholungsrechnung geht kein
   Aufwaermsatz ein. */
function aufwaermZeile(exId, gewicht){
  if (!S.active) return "";
  const rows = S.active.sets[exId] || [];
  if (rows.some(s => s.done)) return "";
  const plan = aufwaermPlan(exId, gewicht);
  if (!plan) return "";
  const fertig = (S.active.warm || {})[exId] || 0;
  return '<div class="warmzeile"><div class="warmkopf">Aufwärmen'
    + '<span>zählt nicht mit</span></div>'
    + '<div class="warmstufen">'
    + plan.map((s, i) =>
        '<button class="warmchip'+(i < fertig ? " on" : "")+'" data-a="warmstufe" '
        + 'data-id="'+esc(exId)+'" data-i="'+i+'">'
        + '<b>'+kg(s.gewicht)+' kg</b><span>'+s.wdh+' Wdh.</span></button>').join("")
    + '</div></div>';
}

/* Beginn und Dauer einer gespeicherten Einheit korrigieren.
   Beides getrennt: die Uhrzeit sagt, wann es losging, die Dauer wie lange es
   dauerte. Das Ende ergibt sich — es einzeln einstellbar zu machen hiesse,
   drei Zahlen konsistent halten zu muessen, von denen eine immer falsch ist. */
function zeitSheet(id){
  const s = S.sessions.find(x => x.id === id);
  if (!s) return;
  const sp = sessionSpanne(s);
  const start = sp ? new Date(sp.start) : (() => { const d = parseDay(s.date); d.setHours(18, 0, 0, 0); return d; })();
  const std = start.getHours(), min = start.getMinutes();
  const dauer = +s.minutes || 0;
  openSheet('<h3>Wann war das Training?</h3>'
    + '<div class="sh-sub">'+esc(dateLong(s.date))+'</div>'
    + '<div class="opt"><div class="lbl2"><div>Beginn</div>'
    + '<div class="d">Stunde und Minute, in Fünf-Minuten-Schritten.</div></div></div>'
    + '<div class="zeitsteller">'
    + stepper("zstd", id, std, 1, "h", {xs:true})
    + stepper("zmin", id, min, 5, "min", {xs:true})
    + '</div>'
    + '<div class="opt" style="margin-top:14px"><div class="lbl2"><div>Dauer</div>'
    + '<div class="d">'+(dauer ? 'Ende dann ' + uhrzeit(start.getTime() + dauer * 60000)
                               : 'Ohne Dauer steht nur der Beginn.')+'</div></div>'
    + stepper("zdauer", id, dauer, 5, "min", {xs:true}) + '</div>'
    + '<button class="btn" style="margin-top:18px" data-a="sheetclose">Fertig</button>', {});
}

/* Wie nah der letzte Satz am Muskelversagen war. Eine Frage je Uebung, nicht
   je Satz — je Satz wuerde niemand ausfuellen, und der letzte Satz traegt die
   Aussage ohnehin. Sie erscheint erst, wenn die Uebung durch ist. */
const RIR_STUFEN = [[3,"Locker"],[2,"1–2 übrig"],[0,"Am Limit"]];
function rirZeile(exId, rows){
  if (!S.active) return "";
  const fertig = rows.length && rows.every(s => s.done);
  if (!fertig) return "";
  const cur = (S.active.rir || {})[exId];
  /* Beschriftung ueber den Knoepfen, nicht daneben: nebeneinander brach
     "1–2 übrig" auf zwei Zeilen und die drei Felder wurden ungleich hoch. */
  return '<div class="rirrow"><div class="note">Wie war der letzte Satz?</div>'
    + '<div class="seg">' + RIR_STUFEN.map(o =>
        '<button data-a="rir" data-id="'+exId+'" data-d="'+o[0]+'" class="'+(cur === o[0] ? "on" : "")+'">'
        + o[1] + '</button>').join("") + '</div></div>';
}

/* ------------------------------------------------------------- Stoppuhr */
/* Fuer Uebungen, deren Zahl Sekunden sind. Ohne sie schaetzt man die Zeit am
   Ende — und aus 35, 25, 15 Sekunden wird eine Zahlenreihe, die nichts misst.

   Der Ablauf folgt dem, was am Geraet tatsaechlich passiert: fuenf Sekunden
   Vorlauf, um an die Stange zu kommen, dann laeuft sie. Am Ende zieht sie
   zwei Sekunden ab — so lange braucht der Weg vom Loslassen zurueck zum
   Telefon. Ohne diesen Abzug staende dort dauerhaft zu viel. */
const UHR_VORLAUF = 5, UHR_REAKTION = 2;
let uhr = null;          /* {exId, i, phase:"vor"|"laeuft", ab, ziel, gesagt} */
let uhrTakt = null;

function uhrSheet(exId, i){
  if (!S.active) return;
  /* Das Ziel des Satzes, damit die Uhr die letzten fuenf Sekunden davor
     ansagen kann. Steht keines im Plan, bleibt es bei den Zehnersekunden. */
  const pl = planOf(S.active.plan);
  const cfg = pl && (pl.ex || []).find(x => x.id === exId);
  const satz = S.active.sets[exId] && S.active.sets[exId][i];
  const ziel = (satz && +satz.reps) || (cfg && (cfg.max || cfg.min)) || 0;
  uhr = {exId:exId, i:i, phase:"vor", ab:Date.now() + UHR_VORLAUF * 1000, ziel:ziel, gesagt:0};
  unlockAudio();
  uhrZeichnen();
  if (uhrTakt) clearInterval(uhrTakt);
  uhrTakt = setInterval(uhrTick, 100);
}

/* Der Zaehler laeuft auf Zeitstempeln, nicht auf einer hochgezaehlten Zahl:
   ein Fenster im Hintergrund drosselt den Takt, die Uhrzeit bleibt richtig. */
function uhrStand(){
  if (!uhr) return 0;
  return uhr.phase === "vor"
    ? Math.max(0, Math.ceil((uhr.ab - Date.now()) / 1000))
    : Math.max(0, Math.floor((Date.now() - uhr.ab) / 1000));
}

function uhrZeichnen(){
  if (!uhr) return;
  const wert = uhrStand();
  const vor = uhr.phase === "vor";
  openSheet('<h3>'+esc(exName(uhr.exId))+'</h3>'
    + '<div class="sh-sub">'+(vor ? 'Gleich geht es los — an die Stange.'
        : 'Halten. Sobald du loslässt, auf Stopp.')+'</div>'
    + '<div class="uhr'+(vor ? " vor" : "")+'" id="uhrwert">'+(vor ? wert : uhrText(wert))+'</div>'
    + (vor
        ? '<button class="btn ghost" data-a="uhrweg">Abbrechen</button>'
        : '<button class="btn" data-a="uhrstop">Stopp</button>'
          + '<div class="note" style="padding:12px 4px 0;text-align:center">'
          + 'Die letzten '+UHR_REAKTION+' Sekunden bis zum Telefon werden abgezogen.</div>')
    , {});
}
const uhrText = sek => Math.floor(sek/60) + ":" + String(sek % 60).padStart(2, "0");

function uhrTick(){
  if (!uhr) { clearInterval(uhrTakt); uhrTakt = null; return; }
  const wert = uhrStand();
  if (uhr.phase === "vor") {
    if (wert <= 0) {
      uhr.phase = "laeuft"; uhr.ab = Date.now(); uhr.gesagt = 0;
      buzz(45); ton("ende"); uhrZeichnen(); return;
    }
    const el = document.getElementById("uhrwert");
    if (el && el.textContent !== String(wert)) { el.textContent = wert; buzz(10); ton("count"); }
    return;
  }
  const el = document.getElementById("uhrwert");
  const t = uhrText(wert);
  if (el && el.textContent !== t) el.textContent = t;

  /* An der Stange sieht man das Telefon nicht — deshalb sagt die Uhr an, wo
     man steht: alle zehn Sekunden ein Ton, und in den letzten fuenf Sekunden
     vor dem Ziel je einer, damit man weiss, wann es geschafft ist.
     `gesagt` merkt sich die letzte angesagte Sekunde: der Takt laeuft
     schneller als einmal je Sekunde, sonst haette dieselbe Marke mehrfach
     geklungen. */
  if (uhr.gesagt === undefined) uhr.gesagt = 0;
  if (wert > uhr.gesagt) {
    const ziel = uhr.ziel || 0;
    const rest = ziel - wert;
    /* Auf dem Ziel ein voller Ton — danach laeuft sie weiter, laenger halten
       ist erlaubt und soll nicht abgewuergt werden. */
    if (ziel && wert === ziel) { buzz(45); ton("ende"); }
    else if (ziel && rest > 0 && rest <= 5) { buzz(14); ton("count"); }
    else if (wert % 10 === 0) { buzz(12); ton("tick"); }
    uhr.gesagt = wert;
  }
}

function uhrWeg(){
  uhr = null;
  if (uhrTakt) { clearInterval(uhrTakt); uhrTakt = null; }
  closeSheet();
}

/* Uebernimmt den Wert und hakt den Satz gleich ab — genau dafuer stand man ja
   mit dem Telefon in der Hand da. Damit laeuft auch die Pause an. */
function uhrStop(){
  if (!uhr || uhr.phase !== "laeuft") { uhrWeg(); return; }
  const roh = Math.floor((Date.now() - uhr.ab) / 1000);
  const wert = Math.max(0, roh - UHR_REAKTION);
  const exId = uhr.exId, i = uhr.i;
  const satz = S.active && S.active.sets[exId] && S.active.sets[exId][i];
  uhrWeg();
  if (!satz) return;
  satz.reps = wert;
  satz.done = true;
  if (!S.active.startedAt) { save(); startNow(false); startRest(exId); return; }
  save(); buzz(13);
  render();
  startRest(exId);
}

/* ================================================================== tabs */
/* Fuenf Reiter, jeder mit genau einer Aufgabe. "Fortschritt" heisst "Ziele",
   damit die Beschriftungen bei fuenf Spalten nicht umbrechen. */
const TABS = [["heute","Heute",I.dumbbell],["plan","Plan",I.list],["verlauf","Verlauf",I.cal],
              ["ziele","Ziele",I.target],["mehr","Mehr",I.cog]];
function renderTabs(){
  if (S.active || route) { tabsEl.innerHTML = ""; return; }
  tabsEl.innerHTML = '<div class="tabbar"><div class="inner">' + TABS.map(t =>
    '<button class="tab'+(tab===t[0]?" on":"")+'" data-a="tab" data-id="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>'
  ).join("") + '</div></div>';
}

/* Bewusst synchron: View Transitions wuerden render() asynchron machen, und
   mehrere Stellen greifen unmittelbar danach aufs DOM zu (Meldungstexte,
   Satzzaehler). Der optische Gewinn waere ein kurzes Ueberblenden, das Risiko
   schwer auffindbare Folgefehler. */
function render(){
  let html, flat = false;
  if (S.active) { html = viewSession(); flat = false; }
  else if (route && route.view === "session") { html = viewSessionDetail(route.id); flat = true; }
  else if (route && route.view === "exercise") { html = viewExercise(route.id); flat = true; }
  else if (route && route.view === "planlist") { html = viewPlanList(); flat = true; }
  else if (route && route.view === "planedit") { html = viewPlanEdit(route.id); flat = true; }
  else if (tab === "heute") html = viewHeute();
  else if (tab === "plan") html = viewPlan();
  else if (tab === "verlauf") html = viewVerlauf();
  else if (tab === "ziele") html = viewZiele();
  else html = viewMehr();
  const key = S.active ? "session:" + S.active.plan
            : route ? route.view + ":" + (route.id || "")
            : tab;
  setHTML(html, flat, key);
  renderTabs();
  renderRest();
}

/* ================================================================== rest */
/* Stored as an absolute end time. Backgrounding, locking the phone or killing
   the app no longer matters: the remaining time is always recomputed. */
const restLeft = () => {
  if (!S.rest) return 0;
  return Math.max(0, Math.ceil((S.rest.endsAt - Date.now()) / 1000));
};
let restDone = false;

/* Der Balken wird einmal gebaut und danach nur noch beschriftet. Vorher wurde
   er jede Sekunde komplett neu erzeugt — dadurch lief die Einblend-Animation
   im Sekundentakt neu, das war das Flackern des Countdowns. */
/* Der Ring zeigt eines: wie weit die Einheit ist. Ihn zwischendurch fuer die
   Pause umzuwidmen war verwirrend — man liest ihn als Fortschritt. */
function ringZeigen(){
  const ring = document.getElementById("ring");
  if (!ring) return;
  const prog = sessionProgress();
  const f = prog.total ? prog.done / prog.total : 0;
  ring.setAttribute("stroke-dashoffset", (2 * Math.PI * 22 * (1 - f)).toFixed(1));
}

function renderRest(){
  /* Waehrend einer Einheit gehoert die Pause nach oben zur Kopfzeile: dort
     steht schon alles andere, und beim Scrollen durch die Saetze bleibt sie
     sichtbar. Ohne laufende Einheit bleibt der schwebende Balken unten. */
  const ziel = document.getElementById("restslot") || restEl;
  if (ziel !== restEl) restEl.innerHTML = "";
  if (!S.active || !S.rest) { ziel.innerHTML = ""; return; }
  const left = restLeft();
  const over = left <= 0;
  const totalSec = S.rest.total || S.settings.rest || 1;
  const frac = Math.max(0, Math.min(1, left / totalSec));
  const m = Math.floor(left/60), sec = String(left%60).padStart(2,"0");

  let bar = ziel.querySelector(".restbar");
  if (!bar) {
    ziel.innerHTML = '<div class="restbar"><div class="inner" style="position:relative">'
      + '<div class="muted" id="restlbl" style="display:flex;align-items:center;gap:9px;font-size:12.5px">'
      + I.timer + '<span>Pause</span></div>'
      + '<div class="t num" id="restt">0:00</div>'
      + '<button class="tag" data-a="skiprest" id="restbtn">Fertig</button>'
      + '<div class="prog"><i id="restprog"></i></div>'
      + '</div></div>';
    bar = ziel.querySelector(".restbar");
  }
  bar.classList.toggle("over", over);
  const t = document.getElementById("restt");
  const txt = over ? "00:00" : m + ":" + sec;
  if (t && t.textContent !== txt) t.textContent = txt;
  const lbl = document.querySelector("#restlbl span");
  /* Dieselbe Zeile traegt drei Dinge: Aufwaermen vor dem Start, die Pause
     zwischen Saetzen und den kuerzeren Uebergang zwischen zwei Uebungen.
     Ein eigenes Bauteil je Fall waere dreimal derselbe Balken. */
  const ltxt = S.rest.warm ? (over ? "Aufgewärmt" : "Aufwärmen")
             : S.rest.wechsel ? (over ? "Weiter" : "Übergang")
             : (over ? "Pause vorbei" : "Pause");
  if (lbl && lbl.textContent !== ltxt) lbl.textContent = ltxt;
  const btn = document.getElementById("restbtn");
  const btxt = over ? "OK" : "Fertig";
  if (btn && btn.textContent !== btxt) btn.textContent = btxt;
  const p = document.getElementById("restprog");
  if (p) p.style.width = (frac*100).toFixed(1) + "%";
}
/* Was nach diesem Satz noch offen ist — daran haengt, wie lange die Pause
   ueberhaupt sein soll. Drei Faelle, drei Antworten:
   nichts mehr offen  -> gar keine Pause. Die Einheit ist vorbei.
   nur noch anderswo  -> Uebergang statt Pause. Das Umbauen dauert ohnehin,
                         und der naechste Muskel ist ein anderer.
   dieselbe Uebung    -> die volle Pause. Nur hier zaehlt sie wirklich. */
function restArt(exId){
  if (!S.active) return {art:"voll"};
  const offenHier = (S.active.sets[exId] || []).some(x => !x.done);
  if (offenHier) return {art:"voll"};
  const plan = planOf(S.active.plan);
  const offenSonst = (plan ? plan.ex : []).some(e =>
    e.id !== exId && !(S.active.skipped || {})[e.id]
    && (S.active.sets[e.id] || []).some(x => !x.done));
  return {art: offenSonst ? "wechsel" : "ende"};
}

function startRest(exId){
  const art = exId ? restArt(exId).art : "voll";
  if (art === "ende") { S.rest = null; restDone = true; save(); renderRest(); liveMelden(); return; }
  const voll = exId ? restFor(exId) : (S.settings.rest || 120);
  /* Der Uebergang ist die halbe Pause, aber nie unter 45 und nie ueber 90
     Sekunden: darunter kommt man nicht ans Geraet, darueber steht man nur rum. */
  const dauer = art === "wechsel" ? Math.max(45, Math.min(90, Math.round(voll / 2))) : voll;
  S.rest = {endsAt: Date.now() + dauer * 1000, total: dauer, wechsel: art === "wechsel"};
  restDone = false;
  save();
  renderRest();
  liveMelden();
}
/* Ist die Pause um, gehoert der naechste Satz vor Augen. Ohne das sucht man
   nach jeder Pause selbst die Stelle wieder — und genau dabei landet man im
   Handy. Der Satz wird mittig gestellt, weil die klebende Kopfzeile den
   oberen Rand verdeckt. */
function zumNaechstenSatz(){
  if (!S.active) return;
  const plan = planOf(S.active.plan);
  if (!plan) return;
  for (const e of plan.ex) {
    const saetze = S.active.sets[e.id] || [];
    const i = saetze.findIndex(s => !s.done);
    if (i < 0) continue;
    const row = document.querySelector('[data-row="'+e.id+':'+i+'"]');
    if (row) {
      row.scrollIntoView({block:"center", behavior:"smooth"});
      row.classList.add("dran");
      setTimeout(() => row.classList.remove("dran"), 2200);
    }
    return;
  }
}

/* ---------------------------------------------------------- Live Activity */
/* Nur in der iOS-Huelle. Gemeldet wird der vollstaendige Stand, nicht die
   Aenderung — dann kann nichts auseinanderlaufen. Die Huelle verwirft
   Wiederholungen selbst, deshalb darf das hier aus dem Sekundentakt kommen.

   Die Pause geht als Zeitpunkt hinueber, nicht als Restsekunden: der
   Sperrbildschirm zaehlt daraus selbst herunter, ohne dass die App auch nur
   einmal geweckt wird. */
function naechsterOffenerSatz(){
  if (!S.active) return null;
  const plan = planOf(S.active.plan);
  if (!plan) return null;
  for (const e of plan.ex) {
    const saetze = S.active.sets[e.id] || [];
    const i = saetze.findIndex(s => !s.done);
    if (i >= 0) return {id:e.id, nr:i + 1, von:saetze.length};
  }
  return null;
}
function liveMelden(){
  if (typeof window === "undefined" || !window.__training_live) return;
  if (!S.active) { window.__training_live(null); return; }
  const prog = sessionProgress();
  const s = naechsterOffenerSatz();
  const pl = planOf(S.active.plan);
  const laeuft = S.rest && restLeft() > 0;
  window.__training_live({
    plan: (pl && pl.title) || "Training",
    ex: s ? exName(s.id) : "Alle Sätze erledigt",
    satz: s ? ("Satz " + s.nr + " von " + s.von) : "",
    done: prog.done, total: prog.total,
    restEnds: laeuft ? S.rest.endsAt : 0,
    restFrom: laeuft ? S.rest.endsAt - S.rest.total * 1000 : 0,
    /* Der Beginn, damit die Insel die laufende Zeit selbst hochzaehlen kann.
       Als Zeitpunkt, nicht als Dauer — dann tickt das System, ohne dass die
       App dafuer einmal geweckt werden muss. 0 heisst: geoeffnet, aber noch
       nicht gestartet, und dann laeuft auch keine Uhr. */
    startedAt: S.active.startedAt || 0
  });
}

function tickRest(){
  const el = document.getElementById("elapsed");
  if (el && S.active) { const t = elapsedText(); if (el.textContent !== t) el.textContent = t; }
  liveMelden();
  if (!S.active || !S.rest) return;
  const left = restLeft();
  if (left <= 0 && !restDone) { restDone = true; buzz(70); ton("ende"); zumNaechstenSatz(); }
  renderRest();
}
setInterval(tickRest, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (S.active) keepAwake(true);   /* die Sperre faellt beim Wegschalten weg */
  tickRest(); render();
});

/* iOS gibt Audio nur frei, wenn der Kontext waehrend einer echten Beruehrung
   entsteht. Frueher wurde er erst beim Ablauf des Timers erzeugt — also aus
   einem Timer heraus, und blieb damit stumm. Jetzt wird er beim ersten Tippen
   angelegt und danach nur noch fortgesetzt. */
let actx = null;
/* Der Stummschalter am iPhone macht Web-Audio stumm — auch den Pausenton, und
   sein Handy steht immer auf lautlos. Seit Safari 16.4 laesst sich die Absicht
   erklaeren: `playback` heisst "das ist Inhalt, kein Effekt" und geht am
   Schalter vorbei. Gibt es die Schnittstelle nicht, aendert sich nichts.
   In der nativen Huelle ist dasselbe ueber AVAudioSession schon gesetzt. */
function audioSitzung(){
  try {
    if (navigator.audioSession && navigator.audioSession.type !== "playback") {
      navigator.audioSession.type = "playback";
    }
  } catch(e){}
}
function unlockAudio(){
  if (!S.settings.sound) return;
  try {
    audioSitzung();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch(e){}
}
/* Drei Toene, drei Anlaesse: `tick` markiert eine verstrichene Zehnersekunde
   beim Halten, `count` die letzten Sekunden davor, `ende` das Ende von Pause
   oder Satz. In der Huelle kommen sie nativ — Web Audio war auf dem Telefon
   schlicht nicht zu hoeren, weil ein ablaufender Zeitgeber keine Nutzergeste
   ist und der Kontext einschlaeft, sobald die Ansicht nicht vorn ist. */
function ton(art){
  if (!S.settings.sound) return;
  if (typeof window !== "undefined" && window.__training_sound) {
    try { window.__training_sound(art); return; } catch(e){}
  }
  beep(art);
}

function beep(art){
  if (!S.settings.sound) return;
  const folge = art === "tick" ? [880] : art === "count" ? [1046] : [880, 1320];
  try {
    audioSitzung();
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    folge.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = actx.currentTime + i * 0.16;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.24);
    });
  } catch(e){}
}

/* iOS raeumt Websitedaten auf, wenn der Platz knapp wird oder eine App laenger
   nicht benutzt wurde. Diese Anfrage bittet um Schutz davor. Sie ersetzt kein
   Backup — gegen ein verlorenes Geraet hilft sie nicht —, nimmt aber die
   haeufigere Gefahr weg. Safari beantwortet sie erst nach echter Nutzung. */
let storagePersisted = null;
function askPersist(){
  try {
    if (!navigator.storage || !navigator.storage.persist) { storagePersisted = "nicht unterstützt"; return; }
    navigator.storage.persisted().then(p => {
      if (p) { storagePersisted = true; return; }
      return navigator.storage.persist().then(ok => { storagePersisted = !!ok; });
    }).catch(() => { storagePersisted = null; });
  } catch(e) { storagePersisted = null; }
}

/* Tage seit dem letzten Backup; 999 heisst: noch nie eines gezogen. */
function backupAlter(){
  const l = S.settings.lastBackup;
  if (!l) return 999;
  return Math.floor((Date.now() - parseDay(l).getTime()) / 86400000);
}

/* Laufzeit der Einheit, im Kopf mitgefuehrt. */
const laeuft = () => !!(S.active && S.active.startedAt);
function elapsedText(){
  if (!S.active || !S.active.startedAt) return "0 min";
  const min = Math.max(0, Math.round((Date.now() - S.active.startedAt) / 60000));
  return min < 60 ? min + " min" : Math.floor(min/60) + " h " + String(min%60).padStart(2,"0");
}

/* -------------------------------------------------------- Start der Einheit */
/* Aufwaermen laeuft ueber denselben Zeitstempel-Timer wie die Satzpause, traegt
   aber `warm` — dadurch heisst die Zeile anders und die Zeit zaehlt nicht zur
   Einheit. Der Start ist ein eigener Griff: erst dann laeuft die Uhr. */
const WARMUP_S = 180;

function startWarmup(){
  S.rest = {endsAt: Date.now() + WARMUP_S * 1000, total: WARMUP_S, warm: true};
  restDone = false;
  save(); renderRest(); liveMelden();
}
function startNow(nachOben){
  if (!S.active || S.active.startedAt) return;
  S.active.startedAt = Date.now();
  /* Ein laufendes Aufwaermen endet mit dem Start — sonst liefe die
     Aufwaermzeile in die erste Satzpause hinein. */
  if (S.rest && S.rest.warm) { S.rest = null; restDone = true; }
  keepAwake(true);
  save();
  /* Der einzige Neuaufbau waehrend einer Einheit: die Kopfzeile tauscht den
     Start gegen die Uhr. Ohne `nachOben` bleibt der Scrollstand, weil der
     Start hier vom ersten abgehakten Satz kommt und nicht von oben. */
  render();
  if (nachOben !== false) toTop();
  liveMelden();
}

/* ------------------------------------------------- Bildschirm wach halten */
/* Waehrend einer laufenden Einheit soll das Display nicht abschalten. Die Sperre
   geht beim Wegschalten der App verloren und wird bei Rueckkehr neu angefordert.
   In installierten Web-Apps unter iOS funktioniert das seit 18.4. */
let wakeLock = null;
function keepAwake(on){
  try {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(l => {
        wakeLock = l;
        l.addEventListener("release", () => { wakeLock = null; });
      }).catch(() => {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  } catch(e){}
}

/* ================================================================ sheets */
let sheetState = null;
function closeSheet(){ sheetState = null; sheetEl.innerHTML = ""; }
/* Ist bereits ein Sheet offen, wird nur der Inhalt getauscht. Baut man den
   Rahmen jedes Mal neu, startet die Einblend-Animation bei jedem Tippen von
   vorn — das ist das Flackern in der Tagesform- und Auswahlansicht. */
/* `fokus` nur dort, wo wirklich getippt werden soll. Vorher bekam jedes
   Eingabefeld in jedem Sheet sofort den Cursor — auf dem iPhone faehrt dann
   die Tastatur hoch und die Ansicht springt, obwohl man nur eine Einstellung
   antippen wollte. */
function openSheet(html, state, fokus){
  sheetState = state || {};
  const inner = sheetEl.querySelector(".sheet .inner");
  if (inner) {
    const top = inner.scrollTop;
    inner.innerHTML = html;
    inner.scrollTop = top;
  } else {
    sheetEl.innerHTML = '<div class="scrim" data-a="sheetclose"></div><div class="sheet"><div class="inner">'+html+'</div></div>';
  }
  if (!fokus) return;
  const f = sheetEl.querySelector(".field");
  if (f) { f.focus(); try { f.select(); } catch(e){} }
}

/* Die Zeichnung in Ruhe ansehen. Auf 40 Pixel in einer Liste ist von der
   Bewegung wenig zu erkennen; gross laeuft sie sichtbar durch. */
/* Verlauf eines Ziels zum Hineinschauen: wann ging es hoch, wann zurueck,
   wo war das Tempo hoch. Die Kurve zeigt den Stand, die Liste jeden Schritt
   mit Veraenderung und Tempo im jeweiligen Abschnitt. */
function goalSheet(gi){
  const g = GOALS[+gi];
  if (!g) return;
  const p = goalSeries(g);
  const kopf = '<h3>'+esc(g.label)+'</h3><div class="sh-sub">'
    + (g.kind === "load" ? 'Schwerste Last mit '+goalReps(g)+' Wiederholungen'
                         : 'Längster Satz am Stück, Zusatzgewicht zählt mit')
    + '</div>';

  if (p.length < 2) {
    openSheet(kopf + '<div class="lead" style="margin-bottom:18px">'
      + (p.length ? 'Bisher ein Eintrag. Ab dem zweiten zeigt sich hier der Verlauf.'
                  : 'Noch kein Satz, der den Standard erfüllt.')
      + '</div><button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
    return;
  }

  /* Kurve. Der Wertebereich beginnt bei der ersten Etappe darunter, damit
     kleine Schritte nicht als Sprung ueber die halbe Hoehe erscheinen. */
  const werte = p.map(q => q.wert);
  const oben = Math.max.apply(null, werte), unten = Math.min.apply(null, werte);
  const spanneW = Math.max(1, oben - unten);
  const t0 = p[0].t, spanneT = Math.max(1, p[p.length-1].t - t0);
  const punkte = p.map(q => {
    const x = 4 + (q.t - t0) / spanneT * 92;
    const y = 40 - (q.wert - unten) / spanneW * 32;
    return x.toFixed(2) + "," + y.toFixed(2);
  });
  const kurve = '<svg class="g3chart" viewBox="0 0 100 46" preserveAspectRatio="none">'
    + '<polyline points="'+punkte.join(" ")+'"/>'
    + p.map((q, i) => { const c = punkte[i].split(",");
        return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="1.5"/>'; }).join("")
    + '</svg>';

  /* Liste rueckwaerts: der letzte Schritt zuerst. */
  const zeilen = p.map((q, i) => {
    const vor = i ? p[i-1] : null;
    const delta = vor ? q.wert - vor.wert : null;
    const tage = vor ? Math.max(1, Math.round((q.t - vor.t) / 86400000)) : null;
    const tempo = (delta !== null && tage) ? (delta / tage * 7) : null;
    const richtung = delta === null ? "" : delta > 0 ? "hoch" : delta < 0 ? "runter" : "gleich";
    return '<div class="g3row">'
      + '<span class="g3d">'+new Date(q.t).toLocaleDateString("de-DE",{day:"2-digit",month:"short"})+'</span>'
      + '<span class="g3v">'+kg(q.wert)+' '+g.unit+'</span>'
      + '<span class="g3k '+richtung+'">'
      + (delta === null ? 'Start'
         : (delta > 0 ? '+' : '') + kg(delta) + ' in ' + tage + (tage === 1 ? ' Tag' : ' Tagen'))
      + '</span></div>'
      + (tempo !== null && tempo !== 0
         ? '<div class="g3t">Tempo ' + (tempo > 0 ? '+' : '') + kg(Math.round(tempo*10)/10)
           + ' ' + g.unit + ' / Woche</div>' : '');
  }).reverse().join("");

  openSheet(kopf + kurve + '<div class="g3list">' + zeilen + '</div>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

/* Zeichnung gross, darunter die Ausfuehrung. Die Schritte sind nummeriert, weil
   die Reihenfolge zaehlt; die Technikhinweise nicht, weil sie ueber die ganze
   Bewegung gelten. Die Herkunft steht darunter — die Lizenz verlangt sie, und
   sie gehoert an denselben Ort wie der Text. */
function artSheet(exId){
  const gd = GUIDE[exId];
  /* Mit Text darunter faellt die Zeichnung kleiner aus: sonst steht der erste
     Schritt unter der Falz und man haelt das Blatt fuer ein reines Bild. */
  const art = gd ? exArt(exId, 176, 232) : exArt(exId, 232, 306);
  if (!art && !gd) return;
  const teil = (titel, eintraege, tag) => (eintraege && eintraege.length)
    ? '<div class="ghd">'+titel+'</div><'+tag+' class="glist">'
      + eintraege.map(z => '<li>'+esc(z)+'</li>').join("") + '</'+tag+'>'
    : '';
  openSheet('<h3>'+esc(exName(exId))+'</h3>'
    + (art ? '<div class="sh-sub">'
             + ((EX[exId] || {}).standbild !== undefined
                ? 'Die Haltung, um die es geht.'
                : 'Entspannt und angespannt im Wechsel.')
             + '</div><div class="artbig">'+art+'</div>' : '')
    + (gd ? teil("Ausführung", gd.steps, "ol") + teil("Technik", gd.tips, "ul")
          + '<div class="gsrc">'
          + (gd.eigen ? 'Zeichnung: Everkinetic, CC BY-SA 4.0'
                      : 'Zeichnung und Beschreibung: Everkinetic, CC BY-SA 4.0')
          + '</div>' : '')
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

const SKIP_REASONS = ["Gerät belegt","Gerät fehlt","Schmerzen","Keine Zeit","Bewusst weggelassen"];
/* Gruende fuer eine Uebung, die begonnen und nicht zu Ende gebracht wurde.
   Enger als die Liste oben: wer schon angefangen hat, hat das Geraet. */
const ABBRUCH_GRUENDE = ["Schmerzen","Kraft am Ende","Keine Zeit","Bewusst so"];

/* Uebungen, bei denen Saetze stehen geblieben sind. Nicht angefangene zaehlen
   nicht dazu — die sind nicht abgebrochen, sondern gar nicht erst passiert,
   und dafuer gibt es die Nachhol-Liste. */
function angefangenOffen(){
  const a = S.active;
  if (!a) return [];
  return activeExList().filter(e => {
    if ((a.skipped || {})[e.id]) return false;
    const rows = a.sets[e.id] || [];
    const fertig = rows.filter(x => x.done).length;
    return fertig > 0 && fertig < rows.length;
  }).map(e => {
    const rows = a.sets[e.id];
    return {id:e.id, fertig:rows.filter(x => x.done).length, gesamt:rows.length};
  });
}

/* Vor dem Abschliessen einmal nachfragen — aber nur, wenn es etwas zu fragen
   gibt. Ohne diesen Grund steht im Verlauf spaeter nur ein Einbruch, und ein
   halbes Jahr weiter weiss niemand mehr, ob die Schulter weh tat oder die Zeit
   fehlte. */
function abschlussPruefen(){
  if (!angefangenOffen().length) { finishSession(); return; }
  abschlussSheet();
}

function abschlussSheet(){
  const offen = angefangenOffen();
  if (!offen.length) { closeSheet(); finishSession(); return; }
  const gr = (S.active.abbruch || {});
  openSheet('<h3>Nicht alles geschafft</h3>'
    + '<div class="sh-sub">Bei '+(offen.length === 1 ? 'einer Übung' : offen.length+' Übungen')
    + ' sind Sätze offen geblieben. Der Grund hilft dir beim nächsten Mal — '
    + 'die App liest ihn mit, bevor sie mehr Gewicht vorschlägt.</div>'
    + offen.map(o =>
        '<div class="frow"><div class="fq">'+esc(exName(o.id))
        + ' <span class="faint">'+o.fertig+' von '+o.gesamt+' Sätzen</span></div>'
        + '<div class="chips umbruch" style="margin:0">'
        + ABBRUCH_GRUENDE.map(r => '<button class="chip'+(gr[o.id] === r ? " on" : "")+'"'
            + ' data-a="abbruchdo" data-id="'+o.id+'" data-r="'+esc(r)+'">'+r+'</button>').join("")
        + '</div></div>').join("")
    + '<button class="btn" style="margin-top:18px" data-a="abbruchok">Einheit abschließen</button>'
    + '<button class="btn ghost" data-a="sheetclose">Zurück zum Training</button>', {});
}
