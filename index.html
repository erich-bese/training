function swapSheet(planId, i, mode){
  const pl = plans()[planId];
  const used = pl.ex.map(x => x.id);
  const list = Object.keys(EX).filter(k => mode === "add" ? used.indexOf(k) < 0 : true);
  /* Die Uebungen des eigenen Plans stehen oben. Alles Weitere — Langhantel und
     Varianten, die es am Geraet nicht gibt — kommt darunter in einen eigenen
     Block, sonst muss man an dreizehn Zeilen vorbeiscrollen, die man nie waehlt. */
  const zeile = k => '<div class="exrow" data-a="'+(mode==="add"?"exaddDo":"exswapDo")+'" data-id="'+planId+'" data-i="'+i+'" data-x="'+k+'">'
        + exIcon(k, 44, 58) + '<div class="body"><div class="nm">'+esc(EX[k].name)+'</div>'
        + '<div class="sc">'+geraetZeichen(k)+'Schritt '+kg(EX[k].inc)+' kg'+(EX[k].bw?' · Körpergewicht':'')+'</div></div>'
        + '<span class="faint">'+I.right+'</span></div>';
  const mehr = list.filter(k => EX[k].mehr);
  openSheet('<h3>'+(mode === "add" ? 'Übung hinzufügen' : 'Übung tauschen')+'</h3>'
    + '<div class="sh-sub">'+esc(pl.title)+'</div>'
    + list.filter(k => !EX[k].mehr).map(zeile).join("")
    + (mehr.length ? '<div class="ghd">Weitere Übungen</div>' + mehr.map(zeile).join("") : "")
    + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
}

/* Dieselbe Auswahl, aber fuer die laufende Einheit statt fuer den Plan.
   Bewusst ein eigenes Blatt: `swapSheet` schreibt in `plans()` und wuerde den
   Plan dauerhaft aendern — hier soll der Tausch nur heute gelten.
   Uebungen mit derselben Bewegung stehen oben: wer Schraegbankdruecken
   tauscht, will fast immer etwas anderes fuer die Brust. */
function tauschSheet(exId){
  if (!S.active) return;
  const drin = activeExList().map(x => x.id);
  const pat = (EX[exId] || {}).pat;
  const list = Object.keys(EX).filter(k => k === exId || drin.indexOf(k) < 0);
  const zeile = k => '<div class="exrow" data-a="tauschDo" data-id="'+esc(exId)+'" data-x="'+k+'">'
    + exIcon(k, 44, 58) + '<div class="body"><div class="nm">'+esc(EX[k].name)+'</div>'
    + '<div class="sc">'+geraetZeichen(k)+'Schritt '+kg(EX[k].inc)+' kg'+(EX[k].bw?' · Körpergewicht':'')
    + (k === exId ? ' · steht gerade' : '') + '</div></div>'
    + '<span class="faint">'+I.right+'</span></div>';
  const nah = list.filter(k => EX[k].pat === pat);
  const rest = list.filter(k => EX[k].pat !== pat);
  const gemacht = (S.active.sets[exId] || []).filter(s => s.done).length;
  openSheet('<h3>Übung tauschen</h3>'
    + '<div class="sh-sub">Statt '+esc(exName(exId))+' — nur für diese Einheit. '
    + 'Dein Plan bleibt, wie er ist.</div>'
    + (gemacht
        ? '<div class="banner warn">'+I.info+'<span>'+gemacht+' Satz'+(gemacht===1?'':'e')
          + ' schon abgehakt. Die zählen dann für die neue Übung.</span></div>'
        : '')
    + (nah.length ? '<div class="ghd">Gleiche Bewegung</div>' + nah.map(zeile).join("") : "")
    + (rest.length ? '<div class="ghd">Alle anderen</div>' + rest.map(zeile).join("") : "")
    + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
}

/* ------------------------------------------------------------ Apple Health */
/* Nur in der iOS-Huelle vorhanden, im Browser bleibt beides leer — deshalb
   ueberall defensiv abgefragt. Die Zahlen stammen nicht vom Telefon, sondern
   vom Band; Health ist nur der Ort, an dem sie abgeholt werden duerfen.
   Jeder Wert kommt mit seiner eigenen Grundlinie (Median der letzten 28
   Naechte). Ohne die sagt keiner der Werte etwas: 60 ms sind fuer den einen
   viel und fuer den naechsten wenig. */
const healthNow = () => (typeof window !== "undefined" && window.__training_health) || null;
/* Die Nacht, mit der gerechnet und die angezeigt wird: die aktuelle aus
   Health, ersatzweise die letzte aus dem Verlauf, in beiden Faellen mit
   ergaenzten Grundlinien. Wer die rohen Zahlen braucht — das Diagnose-Blatt —
   nimmt weiter `healthNow()`. */
const healthAktuell = () => basisFuellen(healthNow() || healthNaechte(1)[0] || null);
const healthPossible = () => !!(typeof window !== "undefined" && window.__training_healthRequest);

/* Merkt sich, dass gerade jemand auf die Freigabe wartet — nicht im Zustand,
   der auf die Platte geht, sondern nur fuer diesen Lauf. */
let healthWartet = null, healthLaeuft = false, healthStumm = false, healthUhr = null;
window.addEventListener("training:health", () => {
  healthLaeuft = false;
  clearTimeout(healthUhr);
  healthLogSchreiben(healthNow());
  if (!healthWartet) { if (!S.active) render(); return; }
  const w = healthWartet; healthWartet = null;
  /* Kam die Anfrage von der Startseite, gehoert das Ergebnis auch dorthin. */
  if (w.vonKarte) { render(); return; }
  formSheet(w.next);
});

const hDur = min => Math.floor(min/60) + ":" + String(Math.round(min%60)).padStart(2,"0") + " h";

/* ------------------------------------------------------------------
   Whoop-Befunde: fuenf Jahre eigene Naechte, ausgewertet am 09.08.2026.
   Alles hier unten steht auf gemessenen Zahlen aus *seinem* Export, nicht
   auf Lehrbuchwerten. Wo eine Zahl aus der Auswertung stammt, steht sie
   im Kommentar mit — sonst laesst sie sich spaeter nicht mehr pruefen.
   ------------------------------------------------------------------ */

/* Eine Nacht in den Verlauf schreiben. Health kennt nur "letzte Nacht";
   ein Fenster ueber mehrere Naechte muss die App selbst fuehren.
   Merkt sich auch die Grundlinien der Nacht: sie wandern, und eine alte
   Abweichung gegen die heutige Grundlinie zu rechnen waere falsch. */
function healthLogSchreiben(h){
  if (!h) return;
  let neu = false;
  const rein = n => {
    if (!n || !n.nacht) return;
    if (n.schlaf == null && n.hrv == null && n.puls == null && n.atem == null) return;
    const alt = S.healthLog.find(x => x.nacht === n.nacht);
    const zeile = alt || {nacht:n.nacht};
    ["schlaf","hrv","puls","atem","schlafBasis","hrvBasis","pulsBasis","atemBasis"]
      .forEach(k => { if (n[k] != null && zeile[k] !== n[k]) { zeile[k] = n[k]; neu = true; } });
    if (!alt) { S.healthLog.push(zeile); neu = true; }
  };
  rein(h);
  /* Neuere Huellen schicken die letzten Naechte gleich mit. Dann steht das
     Fenster sofort, statt sich erst ueber eine Woche zu fuellen. */
  if (Array.isArray(h.verlauf)) h.verlauf.forEach(rein);
  /* Nur schreiben, wenn sich wirklich etwas geaendert hat. Ein Speichern ohne
     Anlass ist beim Start der Huelle genau der Vorgang, der am 7. August
     zweimal alle Daten gekostet hat. */
  if (!neu) return;
  S.healthLog.sort((a, b) => (a.nacht < b.nacht ? 1 : -1));
  S.healthLog = S.healthLog.slice(0, 90);
  save();
}

/* Die letzten n Naechte mit Daten, neueste zuerst. Die aktuelle Nacht aus
   Health kommt vorne dazu, falls sie noch nicht im Verlauf steht — sonst
   fehlt sie beim ersten Rendern nach dem Lesen. */
function healthNaechte(n){
  const h = healthNow();
  const liste = S.healthLog.slice();
  if (h && h.nacht && !liste.some(x => x.nacht === h.nacht)) {
    liste.unshift(h);
    liste.sort((a, b) => (a.nacht < b.nacht ? 1 : -1));
  }
  return liste.slice(0, n || 90).map(basisFuellen);
}

/* --- Startgrundlinie aus dem eigenen Whoop-Export ----------------
   Health kann eine Grundlinie erst liefern, wenn sieben Naechte darin
   stehen. Bis dahin gaebe es keine Schaetzung — obwohl die Zahlen laengst
     bekannt sind: der Export vom August 2026 umfasst mehrere Jahre.
   Die Mediane daraus stehen hier als Startwert und werden abgeloest,
   sobald Health eine eigene Grundlinie mitschickt.

   Zwei Bedingungen, damit das ehrlich bleibt:
   — Die Werte stammen aus den Naechten NACH dem Firmware-Bruch vom
     21.06.2026. Davor lag die HRV messbar hoeher (−4,18 ms am Bruch), und
     eine Grundlinie aus der Zeit davor wuerde jede heutige Nacht
     systematisch schlechter aussehen lassen, als sie ist.
   — Sie laufen ab. Der Sensor driftet, und eine Grundlinie, die ein
     halbes Jahr alt ist, misst die Drift statt der Erholung. */
const START_BASIS = {
  /* Hier standen bis 9.24 die 28-Naechte-Mediane aus dem eigenen Whoop-Export
     — also gemessene Gesundheitswerte einer bestimmten Person, in einer Datei,
     die oeffentlich ausgeliefert wird. Das war ein Fehler und ist entfernt.

     Die App braucht sie auch nicht: Health liefert zu Schlaf, Ruhepuls und
     Atmung eine eigene Grundlinie mit, sobald sieben Naechte vorliegen. Nur
     davor gaebe es keine Einordnung, und dafuer ist "noch keine Grundlinie"
     die ehrliche Antwort.

     Wer hier je wieder Werte eintraegt, traegt sie ins Netz ein. Wenn eine
     Startgrundlinie noetig wird, gehoert sie auf das Geraet — in die Huelle
     oder in den lokalen Datenstand, nie in diese Datei. */
  hrvBasis:    null,
  pulsBasis:   null,
  schlafBasis: null,
  atemBasis:   null,
  stand: "",
  naechte: 0,
  haltbar: 120
};

function startBasisGueltig(){
  if (START_BASIS.hrvBasis == null) return false;
  const alter = (parseDay(dayKey(new Date())) - parseDay(START_BASIS.stand)) / 86400000;
  return alter >= 0 && alter <= START_BASIS.haltbar;
}

/* Fehlende Grundlinien aus dem Startwert ergaenzen — als Kopie, damit der
   gespeicherte Verlauf unveraendert bleibt und im Diagnose-Blatt weiter
   steht, was wirklich aus Health kam. `startbasis` merkt sich, dass hier
   nachgeholfen wurde; die Anzeige sagt es dann auch. */
function basisFuellen(n){
  if (!n || !startBasisGueltig()) return n;
  let ergaenzt = false;
  const out = Object.assign({}, n);
  ["hrv", "puls", "schlaf", "atem"].forEach(k => {
    const b = k + "Basis";
    if (out[k] != null && out[b] == null && START_BASIS[b] != null) {
      out[b] = START_BASIS[b];
      ergaenzt = true;
    }
  });
  if (ergaenzt) out.startbasis = true;
  return out;
}

const medianVon = arr => {
  const s = arr.filter(x => x != null).sort((a, b) => a - b);
  if (!s.length) return null;
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/* --- Eigener Erholungswert ---------------------------------------
   Regression auf seine eigenen Naechte gegen Whoops Erholungswert.
   Die Guete steht in .claude/WHOOP-BEFUNDE.md — hier bewusst nicht, weil
   Naechte gefittet — genau deshalb taugen sie, und genau deshalb steht
   ueberall "geschaetzt" daran. Es ist ein Modell, kein Messwert. */
const ERH = {
  basis: 64.3,
  hrv:   0.84,   /* je Prozent Abweichung der HRV vom 28-Naechte-Median */
  puls: -1.36,   /* je Schlag Abweichung des Ruhepulses */
  schlaf: 3.54,  /* je Stunde Abweichung der Schlafdauer */
  atem:   0.66   /* je Atemzug Abweichung der Atemfrequenz */
};
/* Grenzen mit gemessener Trefferquote, nicht aus dem Bauch:
   Score ≤ 35 → seine Erholung lag an den allermeisten dieser Tage
   wirklich im roten Bereich; das trifft nur wenige Tage im Monat.
   Score ≤ 45 → an 98 % dieser Tage unter 50 %, also ein Tag, an dem man
   nichts erzwingt. Gruen ab 67 wie beim Band, damit die Zahl dasselbe
   bedeutet wie die, die er seit fuenf Jahren gewohnt ist. */
const ERH_GRUEN = 67, ERH_GELB = 45, ERH_ROT = 35;

function erholung(n){
  /* Ohne Angabe die letzte bekannte Nacht — und zwar aus dem Verlauf, nicht
     nur aus `healthNow()`. Beim Start der Huelle steht dort noch nichts, weil
     Health erst gefragt werden muss; der Ring waere dann jedes Mal fuer ein
     paar Sekunden weg und danach wieder da. Zwei Naechte Nachlauf, weil das
     Band manchmal erst am Vormittag synchronisiert — was aelter ist, sagt
     ueber heute nichts mehr und bekommt deshalb keine Zahl. */
  n = basisFuellen(n);
  if (!n) {
    n = healthNaechte(1)[0];
    if (!n || !n.nacht) return null;
    const alter = Math.round((parseDay(dayKey(new Date())) - parseDay(n.nacht)) / 86400000);
    if (alter > 2) return null;
  }
  if (!n) return null;
  const teile = [];
  let score = ERH.basis, fehlt = [];
  const term = (wert, basis, faktor, umrechnen, name, einheit) => {
    if (wert == null || basis == null) { fehlt.push(name); return; }
    const abw = umrechnen(wert, basis);
    const pkt = faktor * abw;
    score += pkt;
    teile.push({name:name, abw:abw, pkt:pkt, einheit:einheit});
  };
  term(n.hrv, n.hrvBasis, ERH.hrv, (w, b) => (w - b) / b * 100, "HRV", " %");
  term(n.puls, n.pulsBasis, ERH.puls, (w, b) => w - b, "Ruhepuls", " bpm");
  term(n.schlaf, n.schlafBasis, ERH.schlaf, (w, b) => (w - b) / 60, "Schlaf", " h");
  term(n.atem, n.atemBasis, ERH.atem, (w, b) => w - b, "Atmung", "");

  /* Ohne HRV und Schlaf traegt das Modell nicht: die beiden stellen zusammen
     den groessten Teil der Erklaerung. Dann lieber keine Zahl als eine, die
     nur die Grundlinie 64,3 mit etwas Rauschen ist. */
  const hatHrv = teile.some(t => t.name === "HRV");
  const hatSchlaf = teile.some(t => t.name === "Schlaf");
  if (!hatHrv || !hatSchlaf) return null;

  score = Math.max(1, Math.min(99, Math.round(score)));
  return {
    score: score, nacht: n.nacht, teile: teile, fehlt: fehlt,
    /* "ab 35 abwaerts" heisst einschliesslich 35 — genau so ist die
   gemessenen Trefferquote gewaehlt worden. */
    ampel: score >= ERH_GRUEN ? "gruen" : score > ERH_ROT ? "gelb" : "rot",
    wort:  score >= ERH_GRUEN ? "Erholt" : score > ERH_ROT ? "Mittel" : "Kaum erholt",
    /* Fehlt ein Wert, ist die Schaetzung schwaecher — das gehoert dran. */
    /* Die Startgrundlinie gehoert in die Guete: eine Schaetzung gegen einen
       Median von vor Wochen ist schwaecher als eine gegen die eigenen
       letzten 28 Naechte, und der Unterschied muss dranstehen. */
    startbasis: !!n.startbasis,
    guete: (fehlt.length ? "Schätzung ohne " + fehlt.join(" und ") : "Schätzung")
      + (n.startbasis ? " · gegen die Startgrundlinie" : "")
  };
}

/* --- Ersatz, wenn die HRV fehlt ----------------------------------
   Auf seinem Telefon kommt die HRV nicht aus Health an, alles andere schon.
   Das Hauptmodell rechnet dann gar nicht — und ein leerer Ring ist zwar
   ehrlich, aber nutzlos.

   Also dasselbe Verfahren ohne HRV, auf denselben Naechten gefittet.
       Score = 66,3 − 5,00 × Puls-Abw.(bpm) + 4,64 × Schlaf-Abw.(h)
   Deutlich schwaecher als das Hauptmodell, aber stabil ausserhalb der Stichprobe.

   Die Atmung ist bewusst *nicht* drin, obwohl sie ankommt: ihr Koeffizient
   dreht im Modell das Vorzeichen (allein −8,02, im Modell +8,22), weil sie
   mit dem Ruhepuls zu 0,46 korreliert. Ein unerklaerbares Vorzeichen fuer
   0,6 Prozentpunkte R² ist Wartungsrisiko ohne Gegenwert.

   **Und deshalb steht hier keine Zahl.** Der mittlere Fehler betraegt 10
   Punkte auf einer Skala, die von Rot nach Gruen nur ein Drittel breit ist;
   an 23,6 % der Tage laege die Anzeige um mehr als 15 Punkte daneben. Eine
   angezeigte "68" hiesse real "irgendwo zwischen 56 und 80" — das waere
   erfundene Genauigkeit.

   Was das Modell dagegen zuverlaessig kann, ist die Einordnung: die
   Dezil-Kalibrierung ist lueckenlos monoton, ab der Mitte gibt es keinen
   einzigen roten Tag mehr, und in fuenf Jahren stand nie Gruen, wenn Whoop
   Rot sagte. Also: Ampel ja, Zahl nein. */
const ERSATZ = {basis: 66.3, puls: -5.00, schlaf: 4.64};
/* Hoehere Grenzen als beim Hauptmodell, weil der Ersatzwert gestaucht ist
   (Streuung 14,7 statt 19,3). Mit 35 und 45 wuerde er zu selten ausloesen.
   40 trifft zu 72 %, 48 zu 83 % gegen "Erholung unter 50". */
const ERSATZ_ROT = 40, ERSATZ_GELB = 48;
/* Beide Schwellen sind gegen diese Formel nachgerechnet worden, nicht aus
   einem verwandten Modell uebertragen (Runde 5, Abschnitt 11):
   — 40 hat in allen drei Fenstern das beste F1 (gesamt, letzte 365 Tage,
     ausserhalb der Stichprobe). 38 und 42 sind ueberall schlechter.
     Ergibt rund 11 Alarme im Jahr bei 72 % Treffern.
   — 48 ist der letzte Punkt, an dem die Genauigkeit gegen "Erholung unter
   50" klar ueber der Zufallsquote bleibt, bei rund 10 % Alarmrate.
   Und die Zahl, auf die es wirklich ankommt: **gruen, obwohl die Erholung
   rot war, gab es in fuenf Jahren null Mal** — auch nie knapp. Die hoechste
   Punktzahl einer roten Nacht war 65,6, die Gruenschwelle liegt bei 67.

   Ein Modell mit den einzelnen Schlafphasen (REM und Kernschlaf statt
   Schlafdauer) wurde geprueft und verworfen: es bringt 0,27 Punkte weniger
   mittleren Fehler — Rauschen — und traegt im kritischen Bereich sogar
   schlechter. Die vollstaendige Suche ueber alle 1023 Kombinationen der in
   Health verfuegbaren Groessen steht in WHOOP-RUNDE5.md; zehn Punkte
   mittlerer Fehler sind das Beste, was ohne HRV geht. */

function erholungErsatz(n){
  n = basisFuellen(n || healthNaechte(1)[0]);
  if (!n) return null;
  if (n.puls == null || n.pulsBasis == null) return null;
  if (n.schlaf == null || n.schlafBasis == null) return null;
  /* Nur einspringen, wenn das Hauptmodell wirklich nicht kann. Sonst waere
     die schwaechere Schaetzung dort, wo die bessere moeglich ist. */
  if (n.hrv != null && n.hrvBasis != null) return null;
  const roh = ERSATZ.basis
    + ERSATZ.puls * (n.puls - n.pulsBasis)
    + ERSATZ.schlaf * (n.schlaf - n.schlafBasis) / 60;
  const stufe = roh <= ERSATZ_ROT ? "rot" : roh <= ERSATZ_GELB ? "gelb" : "gruen";
  return {
    ampel: stufe, nacht: n.nacht,
    wort: stufe === "gruen" ? "Erholt" : stufe === "gelb" ? "Mittel" : "Kaum erholt",
    /* Der Rohwert wird nicht angezeigt, aber die Erholungslage braucht ihn
       zum Vergleichen. */
    intern: Math.round(roh)
  };
}

/* Warum gerade keine Zahl dasteht. Ohne diesen Satz verschwindet der Ring
   stumm, und eine Anzeige, die bei fehlenden Daten einfach weg ist, sieht aus
   wie ein Fehler in der App — genau dann, wenn man wissen will, warum nichts
   da ist. Der Grund muss konkret sein: "keine Daten" hilft niemandem weiter,
   "die HRV-Grundlinie fehlt noch" schon. */
function erhFehlgrund(n){
  n = n || healthNow() || S.healthLog[0] || null;
  if (!n) return "Health hat noch nichts geliefert.";
  const fehltWert = [];
  const fehltBasis = [];
  [["hrv","HRV"], ["schlaf","Schlaf"]].forEach(p => {
    if (n[p[0]] == null) fehltWert.push(p[1]);
    else if (n[p[0]+"Basis"] == null) fehltBasis.push(p[1]);
  });
  if (fehltWert.length) {
    /* Kommen die anderen Werte an, liegt es nicht am Lesen, sondern an einem
       einzelnen Schalter in Health. Das ist eine andere Aussage — und die
       einzige, mit der man etwas anfangen kann. */
    const andereDa = ["schlaf", "puls", "atem"].some(k => n[k] != null);
    if (andereDa && fehltWert.length === 1 && fehltWert[0] === "HRV") {
      /* Nachgeprueft am 10.08.2026: Whoop exportiert die HRV nicht nach Apple
         Health — Schlaf, Ruhepuls und Atmung schon. Das ist keine Einstellung,
         die sich umlegen liesse, sondern eine Entscheidung von Whoop. Die App
         hat hier eine Fassung lang zum Schalter geschickt, den es nicht gibt. */
      return "Whoop gibt die HRV nicht an Apple Health weiter — alles andere schon. "
        + "Daran lässt sich nichts einstellen, deshalb rechnet die App ohne sie.";
    }
    if (andereDa) {
      return fehltWert.join(" und ") + " kommt nicht an, alles andere schon. "
        + "Dann fehlt in Health der Schalter dafür — nicht die Freigabe insgesamt.";
    }
    return fehltWert.join(" und ") + " fehlt in Health — ohne "
      + (fehltWert.length > 1 ? "beide" : "den Wert") + " rechnet das Modell nicht.";
  }
  if (fehltBasis.length) {
    return "Grundlinie für " + fehltBasis.join(" und ") + " fehlt noch. "
      + "Dafür braucht es sieben Nächte mit Daten — vorher wäre jede Einordnung geraten.";
  }
  const n1 = healthNaechte(1)[0];
  if (n1 && n1.nacht) {
    const alter = Math.round((parseDay(dayKey(new Date())) - parseDay(n1.nacht)) / 86400000);
    if (alter > 2) return "Die letzte Nacht in Health ist " + alter + " Nächte alt — das sagt über heute nichts mehr.";
  }
  return "Die Werte reichen für eine Schätzung noch nicht.";
}

/* --- Mehrere Naechte, aber nicht geglaettet ----------------------
   Die zweite Auswertungsrunde hat die naheliegende Loesung widerlegt:
   ueber mehrere Naechte zu mitteln macht den Wert *schlechter*, nicht
   ruhiger. Die Erklaerungskraft faellt mit jeder weiteren Nacht im Fenster
   deutlich ab. Der Grund ist einfach: der
   Erholungswert *ist* im Kern die HRV der letzten Nacht. Wer
   sie glaettet, glaettet genau das weg, was er messen will.

   Richtig ist die Trennung von zwei Fragen:
   — Wie ist es *heute*? Das sagt die einzelne Nacht, und zwar sehr gut.
   — Wie steht es *ueber die Tage*? Das sagt keine geglaettete Zahl,
     sondern die Haeufung: wie viele der letzten drei Naechte schwach
     waren. Eine schwache Nacht ist ein Ausrutscher, drei sind ein Zustand.

   Was eine einzelne Nacht wirklich nicht kann, ist morgen vorhersagen
   (nahe null, bestes Modell kaum besser als Raten). Deshalb gibt es hier keine
   Prognose — nur eine Lage. */
const ERH_TAGE = 3;

function erholungLage(){
  const werte = healthNaechte(ERH_TAGE).map(n => erholung(n)).filter(Boolean);
  if (!werte.length) return null;
  return {
    heute: werte[0].score,
    n: werte.length,
    schwach: werte.filter(e => e.score <= ERH_GELB).length,
    /* Erst ab zwei Naechten laesst sich von einer Haeufung sprechen. */
    reihe: werte.length >= 2
  };
}

/* --- Nachhall harter Belastung -----------------------------------
   Aus seinen Daten, nicht aus dem Lehrbuch: nach einer harten Einheit
   (Strain ab 14) liegt die Erholung am Folgetag 14,8 Punkte tiefer, am
   zweiten Tag noch 4,0 — und am dritten ist der Effekt weg (+2,0, nicht
   signifikant). Boxen genauso: −14,0 und −4,6.

   Ausdruecklich *nicht* das normale Krafttraining: kein messbarer Effekt am
   Folgetag, statistisch von null unterscheiden ließe. Sein
   Krafttraining ist derzeit nicht der Engpass — das Volumen darf steigen.
   Deshalb zaehlt hier nur Boxen und die Einheit, die er selbst als sehr
   hart eingetragen hat. Letzteres ist eine Uebertragung: die App kennt
   keinen Strain, und "sehr hart" ist das Naechste, was sie hat. */
function nachhall(){
  const heute = new Date();
  for (let i = 1; i <= 2; i++) {
    const d = new Date(heute); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    const s = S.sessions.find(x => x.date === k
      && (x.kind === "box" || (x.kind === "lift" && x.effort >= 5)));
    if (s) return {tage:i, box:s.kind === "box"};
  }
  return null;
}

/* --- Schlaf-Untergrenze statt Schlafziel -------------------------
   Aus seinen eigenen Daten: deutlich unter der eigenen Basislinie bricht die
   Erholung steil ein, und kurze Naechte sind bei ihm eher Regel als Ausnahme.
   Ein Ziel ("8 Stunden") hat er jahrelang nicht erreicht und es hat nichts
   geaendert. Eine Untergrenze ist etwas anderes: sie meldet sich nur, wenn es
   wirklich zu wenig war.
   Die genauen Zahlen stehen bewusst nicht hier, sondern lokal in
   .claude/WHOOP-BEFUNDE.md — diese Datei wird oeffentlich ausgeliefert. */
const SCHLAF_UNTER = 360;   /* 6 h — darunter kippt die Erholung deutlich */
const SCHLAF_KURZ  = 420;   /* 7 h — darunter zaehlt die Nacht als kurz */
const SCHLAF_HAEUFIG = 3;   /* so viele kurze Naechte in sieben sind ein Muster */

function schlafGrenze(){
  const naechte = healthNaechte(7).filter(n => n.schlaf != null);
  if (!naechte.length) return null;
  const letzte = naechte[0];
  const kurz = naechte.filter(n => n.schlaf < SCHLAF_KURZ).length;
  const haeufung = naechte.length >= 5 && kurz >= SCHLAF_HAEUFIG;
  /* Kurz halten: die Karte steht auf der Startseite ueber den Knoepfen. Wer
     mehr wissen will, tippt sie an — dort steht der ganze Befund. */
  if (letzte.schlaf < SCHLAF_UNTER) {
    return {art:"rot", kurz:kurz, von:naechte.length, letzte:letzte.schlaf,
      text: hDur(letzte.schlaf) + " — unter deiner Untergrenze",
      detail:"Unter sechs Stunden gibt bei dir messbar alles nach: HRV, Ruhepuls, Erholung."};
  }
  if (haeufung) {
    return {art:"gelb", kurz:kurz, von:naechte.length, letzte:letzte.schlaf,
      text: kurz + " von " + naechte.length + " Nächten unter sieben Stunden",
      detail:"Einzelne steckst du weg, mehrere summieren sich zu einem Rückstand."};
  }
  return null;
}

/* --- Atmung: die Luecke, die der Erholungswert laesst ------------
   Der auffaelligste Befund der dritten Runde. An seinen kranken Tagen
   stand der Erholungswert bei 67,9 gegen 66,0 sonst — er zeigt eine
   Infektion schlicht nicht an (d = +0,11, p = 0,73). Die Atemfrequenz
   zeigt sie sehr deutlich (d = +1,90, p = 0,0017).

   Ueber den ganzen Zeitraum: an Morgen mit einer Atemfrequenz von 0,8 oder
   mehr ueber der eigenen Grundlinie lag die Erholung bei 46,9 statt 65,1
   (d = −0,96, p < 0,0001) — das betrifft 3,5 % der Tage, also rund einen
   im Monat.

   Warum das eine eigene Meldung braucht, obwohl die Atmung im Modell schon
   steckt: dort wiegt sie 0,66 Punkte je Atemzug. Bei +0,8 macht das einen
   halben Punkt — der Score bleibt gruen, waehrend die Nacht in Wahrheit
   eine kranke war. Die Meldung korrigiert genau diese Untergewichtung.

   Kein Frueherkennungssystem: gegen die heutige Erholung gerechnet sagt die
   Atmung ueber morgen nichts (partiell r = +0,015, p = 0,60). Sie sagt
   etwas ueber heute, das der Score verschweigt. */
const ATEM_HOCH = 0.8;

function atemGrenze(){
  const n = healthNaechte(1)[0];
  if (!n || n.atem == null || n.atemBasis == null) return null;
  const abw = n.atem - n.atemBasis;
  if (abw < ATEM_HOCH) return null;
  return {art:"gelb", abw:abw, wert:n.atem, basis:n.atemBasis,
    text:"Atmung erhöht — " + kg(Math.round(abw * 10) / 10) + " über deinem Schnitt",
    detail:"Bei dir der zuverlässigste Hinweis auf einen Infekt. Der Erholungswert "
      + "zeigt so etwas nicht — kranke Tage sehen dort normal aus."};
}

/* Der wirksamste Satz aus der ganzen Auswertung — und der einzige, der eine
   Handlung nennt statt einer Zahl. Die Einschlafuhrzeit selbst ist bei ihm
   wirkungslos; was zaehlt, ist die verlorene Zeit. */
const SATZ_18 = "Jede Stunde später ins Bett kostet dich 18 Minuten Schlaf — "
  + "deine Aufwachzeit wandert nur um 35 Minuten mit. Der Rest fehlt einfach.";
/* Auf der Startseite die halbe Laenge: dort steht die Karte ueber den
   Knoepfen, und drei Zeilen Nebensatz schieben sie aus dem Bild. Der Rest
   steht im Blatt, einen Tipp entfernt. */
const SATZ_18_KURZ = "Jede Stunde später ins Bett kostet dich 18 Minuten Schlaf.";

/* Ein Ring statt eines Balkens: der Wert ist eine Lage, kein Fortschritt.
   Der Umfang ist fest, der Strich laeuft ueber `stroke-dasharray`. */
function erhRing(score, ampel, gr){
  gr = gr || 62;
  const r = gr / 2 - 4, u = 2 * Math.PI * r;
  /* Drei Faelle. Mit Zahl: der Bogen zeigt die Hoehe. Ohne Zahl, aber mit
     Ampel: voller Ring in der Ampelfarbe und ein Strich in der Mitte — das
     ist der Ersatz ohne HRV, der die Lage kennt, aber nicht den Punkt. Ganz
     ohne beides: grauer Ring, Strich. Eine Null waere hier eine Aussage,
     und zwar die schlimmstmoegliche. */
  const leer = score == null;
  /* Ohne Zahl, aber mit Ampel: der Ring fuellt sich nach Stufe, damit die
     Lage auf einen Blick lesbar ist — ein Drittel, zwei Drittel, voll. Ein
     Strich in der Mitte hat dagegen behauptet, es fehle etwas. Es fehlt
     nichts: die HRV kommt nie, und der Wert ist so genau, wie er sein kann. */
  const stufenAnteil = {rot:0.34, gelb:0.67, gruen:1};
  const an = leer
    ? (ampel ? u * (stufenAnteil[ampel] || 1) : u)
    : u * Math.max(0, Math.min(100, score)) / 100;
  const farbe = ampel ? "var(--lv-"+ampel+")" : null;
  return '<svg class="erhring" width="'+gr+'" height="'+gr+'" viewBox="0 0 '+gr+' '+gr+'">'
    + '<circle cx="'+(gr/2)+'" cy="'+(gr/2)+'" r="'+r+'" fill="none" '
    + 'stroke="var(--lv-none)" stroke-width="4"/>'
    + (farbe ?
       '<circle cx="'+(gr/2)+'" cy="'+(gr/2)+'" r="'+r+'" fill="none" '
       + 'stroke="'+farbe+'" stroke-width="4" stroke-linecap="round" '
       /* Nicht kg() — das schreibt ein Komma, und SVG rechnet dann mit zwei Zahlen. */
       + 'stroke-dasharray="'+an.toFixed(2)+' '+u.toFixed(2)+'" '
       + 'transform="rotate(-90 '+(gr/2)+' '+(gr/2)+')"/>' : '')
    + (leer && ampel ? '' :
       '<text x="'+(gr/2)+'" y="'+(gr/2)+'" class="erhtext'+(leer ? ' erhleer' : '')+'" '
       + 'text-anchor="middle" dominant-baseline="central">'+(leer ? '—' : score)+'</text>')
    + '</svg>';
}

/* Nur das, was gemessen ist. Muskeln und Motivation stehen bewusst nicht hier —
   die weiss das Band nicht, die weiss nur er. */
function healthSuggest(h){
  const out = {};
  if (h.schlaf != null){
    const b = h.schlafBasis;
    out.sleep = (h.schlaf < 330 || (b && h.schlaf < b - 60)) ? 1
              : (h.schlaf >= 420 && (!b || h.schlaf >= b - 15)) ? 3 : 2;
  }
  if (h.hrv != null && h.hrvBasis){
    out.energy = h.hrv <= h.hrvBasis * 0.90 ? 1 : h.hrv >= h.hrvBasis * 1.03 ? 3 : 2;
  } else {
    /* Ohne HRV blieb die Energie leer — und weil Whoop sie nie liefert, hiess
       das: dauerhaft leer. Von fuenf Fragen waren zwei vorbelegt statt drei,
       obwohl die Antwort in denselben Zahlen steckt. Die Ersatzampel sagt
       genau das, was hier gefragt ist. */
    const e = erholungErsatz(h);
    if (e) out.energy = e.ampel === "rot" ? 1 : e.ampel === "gelb" ? 2 : 3;
  }
  if (h.puls != null && h.pulsBasis){
    out.drain = h.puls >= h.pulsBasis + 4 ? 1 : h.puls <= h.pulsBasis + 1 ? 3 : 2;
  }
  return out;
}

/* Eine Kachel je Wert: Zahl gross, Abweichung von der Grundlinie darunter.
   Ohne Grundlinie steht dort nichts — eine erfundene Einordnung waere
   schlimmer als gar keine. */
function healthBox(h, kompakt){
  const kachel = (titel, wert, abw) => '<div class="hcell"><div class="hcap">'+titel+'</div>'
    + '<div class="hnum">'+wert+'</div>'
    + '<div class="habw">'+(abw || "—")+'</div></div>';
  const delta = (wert, basis, einheit, hochIstGut) => {
    if (basis == null) return "";
    const d = Math.round((wert - basis) * 10) / 10;
    if (!d) return "wie sonst";
    const gut = hochIstGut ? d > 0 : d < 0;
    return '<span class="'+(gut ? "hup" : "hdown")+'">'+(d > 0 ? "+" : "")+kg(d)+' '+einheit+'</span>';
  };
  const zellen = [];
  if (h.schlaf != null) zellen.push(kachel("Schlaf", hDur(h.schlaf),
    h.schlafBasis == null ? "" : delta(Math.round(h.schlaf), Math.round(h.schlafBasis), "min", true)));
  if (h.hrv != null) zellen.push(kachel("HRV", kg(h.hrv)+" ms", delta(h.hrv, h.hrvBasis, "ms", true)));
  if (h.puls != null) zellen.push(kachel("Ruhepuls", kg(h.puls), delta(h.puls, h.pulsBasis, "", false)));
  if (h.atem != null) zellen.push(kachel("Atmung", kg(h.atem), delta(h.atem, h.atemBasis, "", false)));
  if (!zellen.length) return "";
  /* Was die Zahlen bedeuten, gehoert daneben. Ohne diese Zeilen steht dort
     eine Empfehlung, die aus dem Nichts kommt — und der man deshalb nicht
     glaubt. Jede Zeile nennt den Messwert, den Vergleich und den Schluss. */
  const sug = healthSuggest(h);
  const daraus = [];
  if (sug.sleep !== undefined) {
    daraus.push(hDur(h.schlaf)
      + (h.schlafBasis ? ' gegen ' + hDur(h.schlafBasis) + ' im Schnitt' : '')
      + ' → Schlaf „' + ["","Schlecht","Okay","Gut"][sug.sleep] + '“');
  }
  if (sug.energy !== undefined) {
    daraus.push('HRV ' + kg(h.hrv) + ' gegen ' + kg(h.hrvBasis)
      + ' → Energie „' + ["","Leer","Geht so","Voll da"][sug.energy] + '“');
  }
  if (sug.drain !== undefined) {
    daraus.push('Ruhepuls ' + kg(h.puls) + ' gegen ' + kg(h.pulsBasis)
      + ' → Erschöpfung „' + ["","Stark","Etwas","Keine"][sug.drain] + '“');
  }
  if (kompakt) {
    /* Auf der Startseite nur die Zahlen und wohin sie fliessen — die
       Herleitung steht im Blatt, das sich beim Antippen oeffnet. */
    return '<div class="hgrid">'+zellen.join("")+'</div>'
      + '<div class="hnote">'+(h.quelle ? esc(h.quelle)+' · ' : '')
      /* Rechnet die App gegen den Startwert aus dem Export statt gegen eine
         selbst gemessene Grundlinie, gehoert das hierhin. Sonst steht dort
         "gegen deinen Schnitt", und gemeint ist ein fremder. */
      + (h.startbasis ? 'gegen deine Startgrundlinie · antippen'
         : daraus.length ? 'antippen für die Herleitung'
                         : 'noch keine Grundlinie — dafür braucht es sieben Nächte')
      + '</div>';
  }
  return '<div class="hbox"><div class="hhead">Letzte Nacht'
    + (h.quelle ? ' · '+esc(h.quelle) : '')+'</div>'
    + '<div class="hgrid">'+zellen.join("")+'</div>'
    + (daraus.length
        ? '<div class="ghd" style="margin:16px 0 8px">Daraus vorbelegt</div>'
          + '<ul class="glist">' + daraus.map(z => '<li>'+esc(z)+'</li>').join("") + '</ul>'
        : '')
    + (h.startbasis
        ? '<div class="hnote">Verglichen wird gegen die <b>Startgrundlinie</b> aus deinem '
          + 'Whoop-Export (' + START_BASIS.naechte + ' Nächte, Stand '
          + esc(dateShort(START_BASIS.stand)) + '). Sobald Health sieben eigene Nächte hat, '
          + 'löst die deinen tatsächlichen Schnitt ab.</div>'
        : '')
    + '<div class="hnote">Muskeln und Motivation bleiben leer — die weiß das Band nicht. '
    + 'Alles überschreibbar; die Empfehlung rechnet mit dem, was am Ende dasteht.</div></div>';
}

/* Die Werte der letzten Nacht auf der Startseite — dauerhaft sichtbar, nicht
   nur beim Ausfuellen der Tagesform. Sie sind der einzige harte Messwert, den
   die App ueberhaupt hat; alles andere ist Selbsteinschaetzung. Dazu, von wann
   sie stammen: das Band synchronisiert manchmal erst Stunden spaeter, und eine
   Zahl ohne Zeitpunkt ist an dieser Stelle wertlos. */
function healthKarte(){
  /* Ausserhalb der Huelle gibt es Health nicht — dort faellt die Karte weg.
     Innerhalb steht sie immer, auch wenn nichts ankommt: eine Karte, die bei
     fehlenden Daten verschwindet, sieht aus wie ein Fehler in der App. Und
     genau dann braucht man sie am dringendsten, weil man wissen will, warum
     nichts da ist. */
  if (!healthPossible()) return "";
  /* Dieselbe Regel wie beim Ring: was schon einmal gelesen wurde, bleibt
     stehen, bis etwas Neueres kommt. Sonst ist die Karte bei jedem Start
     kurz leer — und leer sieht aus wie kaputt. Wie alt die Nacht ist, steht
     in der Zeile darueber. */
  const h = healthAktuell();
  const kasten = h ? healthBox(h, true) : "";

  if (kasten) {
    /* Kein Ring mehr an dieser Stelle: der steht seit 9.10 oben neben dem
       Titel, wo man ihn beim Aufschlagen sieht. Hier stehen nur noch die
       gemessenen Einzelwerte — der Beleg zur Zahl, nicht die Zahl selbst. */
    return '<div class="stack"><div class="eyebrow"><span>Letzte Nacht</span>'
      + '<span class="faint">'+esc(healthWann(h))+'</span></div>'
      + '<button class="card hcard" data-a="erhsheet">'+kasten+'</button>'
      + '</div>';
  }
  /* Nichts da. Der Knopf liest neu, der Text sagt, wo man nachsieht. */
  return '<div class="stack"><div class="eyebrow"><span>Letzte Nacht</span>'
    + '<span class="faint">Apple Health</span></div>'
    + '<div class="card"><div class="hnote" style="margin:0 0 13px">'
    + (healthLaeuft
        ? 'Liest gerade aus Apple Health …'
        : (h || healthStumm)
          ? 'Health hat noch nichts geliefert. Whoop trägt die Nacht meist im Laufe '
            + 'des Vormittags ein. Prüfe sonst in der Health-App unter „Durchsuchen → Schlaf“, '
            + 'ob dort eine Nacht steht, und unter „Profil → Datenschutz → Apps → Calmma“, '
            + 'ob alle vier Schalter an sind.'
          : 'Schlaf, HRV, Ruhepuls und Atmung der letzten Nacht. Nur lesend.')
    + '</div>'
    + '<button class="btn ghost" style="margin:0" data-a="healthask">'
    + (healthLaeuft ? 'Liest …' : h ? 'Neu lesen' : 'Mit Apple Health verbinden')
    + '</button></div></div>';
}

/* Die Schlaf-Untergrenze als eigene Karte, direkt ueber den Knoepfen. Sie
   steht getrennt von den Kacheln, weil sie etwas anderes ist: die Kacheln
   berichten, diese Karte meldet sich. Und sie meldet sich nur, wenn wirklich
   etwas ist — eine Warnung, die immer da steht, liest nach drei Tagen keiner
   mehr. */
function warnKarten(){
  /* Zwei Zeilen je Karte, mehr nicht. Der 18-Minuten-Satz stand hier eine
     Fassung lang als dritter Block mit Trennlinie und hat die Karte auf
     141 px gebracht — er hat damit genau die Knoepfe aus dem Bild geschoben,
     zu denen er hinfuehren soll. Er steht jetzt einen Tipp entfernt: im
     Schlaf-Blatt und dauerhaft im Erholungs-Blatt. */
  const karte = (w, ziel) => '<button class="card warncard '+w.art+'" data-a="'+ziel+'">'
    + '<div class="warntitel">'+esc(w.text)+'</div>'
    + '<div class="warntext">'+esc(w.detail)+'</div></button>';
  const teile = [];
  /* Die Atmung zuerst: sie meldet moeglicherweise einen Infekt, und der
     schlaegt jede Frage nach der Schlafdauer. */
  const ag = atemGrenze();
  if (ag) teile.push(karte(ag, "erhsheet"));
  const sg = schlafGrenze();
  if (sg) teile.push(karte(sg, "schlafsheet"));
  if (!teile.length) return "";
  return '<div class="stack">' + teile.join("") + '</div>';
}

/* Wann die Werte herkommen. Das Datum der Nacht, nicht der Zeitpunkt des
   Lesens — danach hat er gefragt, und nur das beantwortet die Frage. */
function healthWann(h){
  if (!h.nacht) return "Zeitpunkt unbekannt";
  /* Die Nacht traegt den Schluessel des Abends, an dem sie begann — wer heute
     frueh aufgestanden ist, findet sie unter gestern. Ohne diese Verschiebung
     stuende ueber der letzten Nacht "Nacht auf gestern". */
  const heute = parseDay(dayKey(new Date()));
  const tage = Math.round((heute - parseDay(h.nacht)) / 86400000);
  if (tage <= 0) return "heute";
  if (tage === 1) return "heute Nacht";
  if (tage === 2) return "Nacht auf gestern";
  return "vor " + tage + " Nächten · "
    + parseDay(h.nacht).toLocaleDateString("de-DE", {day:"2-digit", month:"short"});
}

/* ---- Tagesform: fuenf Fragen, je drei Stufen, ein Speichern ---- */
function formSheet(next, working){
  const gespeichert = formForToday();
  /* Mit ergaenzter Grundlinie: sonst belegt die Tagesform nichts vor,
     obwohl die Zahlen einordenbar sind. */
  const h = healthAktuell();
  /* Vorschlaege nur beim ersten Oeffnen des Tages. Steht schon etwas fest,
     bleibt es stehen — sonst wuerde eine eigene Antwort beim naechsten
     Aufschlagen wieder von der Messung ueberschrieben. */
  const cur = working || gespeichert
    || (h ? healthSuggest(h) : {});
  const ausHealth = (!working && !gespeichert && h) ? healthSuggest(h) : {};
  const kasten = h ? healthBox(h) : "";
  openSheet(
    '<h3>Wie geht es dir heute?</h3>'
    + '<div class="sh-sub">Fünf kurze Fragen. Danach passt die Empfehlung dazu.</div>'
    /* Drei Faelle, drei verschiedene Dinge: Werte da, Freigabe noch nicht
       erteilt, oder Freigabe erteilt und trotzdem nichts gemessen. Der letzte
       darf nicht wie der zweite aussehen — sonst tippt man auf einen Knopf,
       der nichts mehr tun kann. */
    + (kasten ? kasten
         + '<button class="btn ghost" data-a="healthask" style="margin:-6px 0 16px">'
         + (healthLaeuft ? 'Liest …' : 'Aus Apple Health neu lesen') + '</button>'
         : healthPossible()
           ? '<button class="btn ghost" data-a="healthask">'
             + (healthLaeuft ? 'Liest aus Apple Health …' : 'Aus Apple Health lesen') + '</button>'
             + '<div class="hnote" style="margin:8px 0 16px">'
             + (healthLaeuft ? 'Einen Moment.'
                : (h || healthStumm)
                  ? 'Health hat für letzte Nacht nichts geliefert. Prüfe in der Health-App unter '
                    + '„Durchsuchen → Schlaf", ob dort überhaupt eine Nacht steht — und ob Calmma '
                    + 'unter „Datenzugriff und Geräte" lesen darf.'
                  : 'Liest Schlaf, HRV und Ruhepuls der letzten Nacht. Nur lesend.')
             + '</div>'
           : '')
    + FORM_FIELDS.map(f => {
        const v = +cur[f.k] || 0;
        return '<div class="frow"><div class="fq">'+f.label
          + (ausHealth[f.k] ? '<span class="ftag">Health</span>' : '')+'</div><div class="fopts">'
          + [[1,f.low],[2,f.mid],[3,f.high]].map(o =>
              '<button data-a="fset" data-id="'+f.k+'" data-d="'+o[0]+'" class="'+(v===o[0]?"on":"")+'">'
              + esc(o[1])+'</button>').join("")
          + '</div></div>';
      }).join("")
    + '<button class="btn" style="margin-top:18px" data-a="formok">Speichern</button>'
    + '<button class="btn ghost" data-a="sheetclose">Abbrechen</button>',
    {form:Object.assign({}, cur), next:next}
  );
}
function saveForm(w){
  const rec = {date:dayKey(new Date())};
  FORM_FIELDS.forEach(f => rec[f.k] = +w[f.k] || 2);
  rec.score = formScore(rec);
  rec.level = formLevel(rec.score);
  S.form = S.form.filter(f => f.date !== rec.date);
  S.form.push(rec);
  save();
  return rec;
}

/* ---- Freie Trainingswahl, Empfehlung nur markiert ---- */
/* Zustand eines Plans: was seine Hauptgruppen gerade sagen.
   Gewichtet nach Anteil, damit eine Nebengruppe den Plan nicht rot faerbt —
   dass Bankdruecken den Trizeps mitnimmt, macht einen Push-Tag nicht zum
   Trizeps-Tag. Nur was mindestens ein Fuenftel des Plans ausmacht, zaehlt. */
function planZustand(pid, st){
  const by = muscleMap(st);
  const share = planShare(pid);
  const haupt = MUSCLES.filter(m => (share[m] || 0) >= 0.15);
  if (!haupt.length) return null;
  const rot = haupt.filter(m => by[m].level === "rot");
  const brach = haupt.filter(m => by[m].stale === "brach");
  const faellig = haupt.filter(m => by[m].stale === "faellig" || by[m].stale === "neu");
  if (rot.length) return {art:"rot", text:"Überlastet", detail:joinNames(rot.map(m => by[m])) + " noch belastet"};
  if (brach.length) return {art:"brach", text:"Überfällig", detail:joinNames(brach.map(m => by[m])) + " lange nichts"};
  if (faellig.length) return {art:"faellig", text:"Wäre dran", detail:joinNames(faellig.map(m => by[m])) + " wieder fällig"};
  /* Auch "alles erholt" ist ein Zustand. Ihn wegzulassen hat die Auswahl
     unverstaendlich gemacht: an den belasteten Plaenen stand eine Begruendung,
     an den erholten gar nichts — und damit war nicht zu sehen, warum ein Plan
     mit kuerzerem Rueckstand vorne liegt. Er liegt vorne, weil seine Muskeln
     frisch sind, und genau das steht jetzt da. */
  const gelb = haupt.filter(m => by[m].level === "gelb");
  if (gelb.length) return {art:"faellig", text:"Teilweise erholt",
    detail:joinNames(gelb.map(m => by[m])) + " noch etwas belastet"};
  return {art:"frei", text:"Erholt", detail:joinNames(haupt.map(m => by[m])) + " frisch"};
}

function pickSheet(){
  const rec = recommend();
  const rid = rec.kind === "plan" ? rec.planId : null;
  openSheet('<h3>Training auswählen</h3>'
    + '<div class="sh-sub">'+esc(rec.why)+'</div>'
    /* Die Rangfolge stand nirgends, und ohne sie sieht die Empfehlung
       willkuerlich aus: warum Pull, wenn Push laenger zurueckliegt? Weil
       Erholung vor Rueckstand geht. Ein Satz, der genau das sagt. */
    + '<div class="note" style="padding:0 2px 13px">Sortiert ist nach deinem Plan, '
    + 'nicht nach der Empfehlung. Entschieden wird zuerst nach Erholung, dann '
    + 'nach Rückstand — ein Plan mit frischen Muskeln geht vor einem, der länger '
    + 'zurückliegt, aber noch belastet ist.</div>'
    + Object.keys(plans()).map(k => {
        const pl = plans()[k];
        /* Die ersten Übungen als Vorschau: daran erkennt man einen Plan schneller
           als am Titel, gerade bei den beiden Bein-Varianten. Einzeilig gehalten
           und bei Bedarf abgeschnitten, damit alle Zeilen gleich hoch bleiben. */
        const preview = pl.ex.slice(0, 2).map(e => exName(e.id)).join(", ")
                      + (pl.ex.length > 2 ? " …" : "");
        /* Der Zustand steht an jedem Plan, nicht nur am empfohlenen: die
           Empfehlung nimmt ihm die Wahl nicht ab, sie ordnet sie nur. Wer
           bewusst etwas anderes will, soll sehen, was er sich einhandelt. */
        const z = planZustand(k, rec.state);
        return '<button class="pick'+(k === rid ? " on" : "")+(z && z.art === "rot" ? " warn" : "")+'"'
          + ' data-a="start" data-id="'+k+'">'
          + exIcon(pl.ex[0].id, 40, 52)
          /* Das "zuletzt" hing frueher am Ende der Vorschauzeile und wurde mit
             ihr abgeschnitten — also genau die Angabe, nach der man in dieser
             Liste sucht. Es steht jetzt in der Titelzeile rechts und schrumpft
             nie: die Vorschau darunter gibt nach, nicht das Datum. */
          + '<div class="pbody"><div class="ptop">'
          + '<div class="ptitle">'+esc(pl.title)+'</div>'
          + '<div class="plast">'+lastPlanLabel(k)+'</div></div>'
          + '<div class="pmeta">'+esc(preview)+'</div>'
          + (z ? '<div class="pz '+z.art+'">'+esc(z.text)+' · <span>'+esc(z.detail)+'</span></div>' : '')
          + '</div>'
          + (k === rid ? '<span class="tag on">Empfohlen</span>' : '')
          + '</button>';
      }).join("")
    + '<button class="btn ghost" data-a="sheetclose" style="margin-top:16px">Abbrechen</button>', {});
}

/* Warum das Nervensystem gerade so dasteht. Ohne die Gruende waere die
   Einordnung eine Behauptung — und genau daran erkennt man Software, die
   raet statt zu rechnen. */
function sysSheet(){
  const sys = systemLoad();
  openSheet('<h3>'+esc(sys.text)+'</h3>'
    + '<div class="sh-sub">Muskeln erholen sich je Gruppe, das Nervensystem trägt alles zusammen. '
    + 'Es lässt sich nicht messen — das hier sind Anzeichen, jedes für sich schwach.</div>'
    + (sys.gruende.length
        ? '<div class="ghd">Was dafür spricht</div><ul class="glist">'
          + sys.gruende.map(g => '<li>'+esc(g)+'</li>').join("") + '</ul>'
        : '<div class="ghd">Befund</div><ul class="glist"><li>Nichts, was für eine Pause spricht.</li></ul>')
    + '<div class="ghd">Woran es sich zeigt</div><ul class="glist">'
    + '<li>Tagesform der letzten drei Tage</li>'
    + '<li>Geschätzte Erholung heute'
    + (sys.erh ? ' — gerade ' + sys.erh.heute : '')
    + '. Unter '+ERH_ROT+' wiegt sie schwer, unter '+ERH_GELB+' zählt sie mit</li>'
    + '<li>Wie viele der letzten '+ERH_TAGE+' Nächte schwach waren'
    + (sys.erh && sys.erh.reihe ? ' — gerade ' + sys.erh.schwach + ' von ' + sys.erh.n : '')
    + '. Eine allein reicht nie für eine Pause</li>'
    + '<li>Schlaf unter sechs Stunden, oder drei kurze Nächte in sieben</li>'
    + '<li>Boxen oder eine sehr harte Einheit in den letzten zwei Tagen — danach '
    + 'fällt dein Folgemorgen deutlich häufiger schwach aus als nach ruhigen '
    + 'Tagen</li>'
    + '<li>Einheiten dieser Woche gegen deine sonstigen Wochen</li></ul>'
    /* Was nicht mehr zaehlt, gehoert genauso ins Blatt wie das, was zaehlt.
       Sonst sieht es aus, als waere es vergessen worden. */
    + '<div class="ghd">Was bewusst nicht zählt</div><ul class="glist">'
    + '<li><b>Tage am Stück trainiert</b>'
    + (sys.folge ? ' — gerade ' + sys.folge : '')
    + '. In deinen Daten hat das die Erholung am Folgetag nicht messbar '
    + 'verändert. Es war eine Annahme aus dem Lehrbuch, kein Befund aus '
    + 'deinen Zahlen.</li>'
    + '<li><b>Normales Krafttraining.</b> Am Folgetag kein Effekt, der sich von '
    + 'null unterscheiden ließe. Nur Boxen und sehr harte Einheiten hallen '
    + 'nach — und die zwei Tage, nicht drei.</li>'
    /* Der praktischste Befund der dritten Runde: er aendert, wie man eine
       Einheit plant, und nicht nur, wie man sie hinterher bewertet. */
    + '<li><b>Wie lange du trainierst.</b> Die reine Dauer einer Einheit kostet '
    + 'dich nichts. Was kostet, ist die Zeit im hohen Puls — jede Minute dort '
    + 'schlägt zu Buche. Eine lange Einheit '
    + 'mit ordentlichen Pausen ist deshalb billiger als eine kurze gehetzte — '
    + 'die Pausenzeiten in dieser App sind genau deswegen großzügig.</li>'
    + '<li><b>Der Wochentag und die Jahreszeit.</b> Sonntags erholst du dich '
    + 'messbar besser als freitags, aber das ist eine Folge deiner Nächte und '
    + 'nicht ihr Grund — die Zahlen oben haben es schon drin. Saisonal ist bei '
    + 'dir gar nichts.</li></ul>'
    + '<div class="gsrc">Fühlst du dich müde und erschöpft, gilt das mehr als jede dieser Zahlen. '
    + 'Ein Ruhetag kostet keinen Fortschritt — er ist der Teil, in dem er entsteht.</div>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

/* Wie der geschaetzte Erholungswert zustande kommt. Er sieht aus wie ein
   Messwert und ist keiner — also muss an dieser Stelle offenliegen, aus
   welchen vier Zahlen er entsteht, wie gut er trifft und woher das bekannt
   ist. Ohne das waere es eine erfundene Zahl mit Nachkommastelle. */
function erhSheet(){
  const h = healthAktuell();
  const e = erholung(h);
  const lage = erholungLage();
  /* Kein Wert heisst nicht "nichts zu sagen". Frueher fiel man hier in die
     Tagesform und wusste danach genauso wenig wie vorher, warum oben keine
     Zahl stand. */
  /* Absichtlich `healthNow()` und nicht `h`: das Blatt soll zeigen, was
     wirklich aus Health kam, nicht was die Startgrundlinie ergaenzt hat. */
  if (!e) { erhErsatzSheet(healthNow() || (S.healthLog[0] || null)); return; }
  const zeile = t => {
    const wert = (t.abw > 0 ? "+" : "") + kg(Math.round(t.abw * 10) / 10) + t.einheit;
    const pkt  = (t.pkt > 0 ? "+" : "") + kg(Math.round(t.pkt * 10) / 10);
    return '<li><b>'+esc(t.name)+'</b> '+esc(wert)+' gegen deinen 28-Nächte-Schnitt'
      + ' <span class="'+(t.pkt >= 0 ? "hup" : "hdown")+'">'+esc(pkt)+' Punkte</span></li>';
  };
  openSheet('<h3>Erholung '+e.score+' <span class="ftag">geschätzt</span></h3>'
    /* `guete` statt "aus vier Zahlen": fehlt eine, stimmt die Vier nicht —
       und rechnet die App gegen die Startgrundlinie, ist das ebenfalls Teil
       der Guete und gehoert in denselben Satz. */
    + '<div class="sh-sub">'+esc(e.wort)+'. Kein Messwert, sondern eine '
    + esc(e.guete.charAt(0).toLowerCase() + e.guete.slice(1))
    + ' aus deinen gemessenen Nachtwerten.</div>'
    + (h ? healthBox(h) : "")
    + '<div class="ghd">Wie sich das zusammensetzt</div>'
    + '<ul class="glist"><li>Ausgangswert '+kg(ERH.basis)+'</li>'
    + e.teile.map(zeile).join("") + '</ul>'
    + '<div class="ghd">Über mehrere Nächte</div><ul class="glist">'
    + (lage && lage.reihe
        ? '<li><b>'+lage.schwach+' der letzten '+lage.n+' Nächte</b> lagen unter '+ERH_GELB+'. '
          + 'Eine schwache Nacht ist ein Ausrutscher, mehrere sind ein Zustand — '
          + 'erst dann rät die App zur Pause.</li>'
        : '<li>Noch zu wenige Nächte im Verlauf. Ab der zweiten zählt die App, '
          + 'wie viele der letzten '+ERH_TAGE+' Nächte schwach waren.</li>')
    /* Der naheliegende Weg waere gewesen, den Wert selbst zu glaetten. Er ist
       geprueft und falsch — das gehoert hierhin, sonst schlaegt es irgendwann
       jemand wieder vor. */
    + '<li>Den Wert selbst zu mitteln wäre falsch: über mehrere Nächte geglättet '
    + 'verliert er den Großteil seiner Aussage. Er <i>ist</i> im Kern die HRV '
    + 'der letzten Nacht — wer sie glättet, glättet weg, was er messen will.</li></ul>'
    + '<div class="ghd">Wie gut das trifft</div><ul class="glist">'
    + '<li>Aus deinen eigenen Nächten gerechnet, gegen den Erholungswert, den dein '
    + 'Band selbst ermittelt. Trifft dort sehr zuverlässig.</li>'
    + '<li>Unter '+ERH_ROT+' lag deine Erholung fast immer wirklich im roten Bereich — '
    + 'das trifft nur wenige Tage im Monat.</li>'
    + '<li><b>Was er nicht kann: morgen.</b> Von heute auf morgen bleibt fast '
    + 'nichts stehen. Deshalb sagt die App nichts über morgen voraus.</li>'
    + '<li>Die Koeffizienten gelten für dich, nicht allgemein — genau deshalb '
    + 'sind sie so gut, und genau deshalb steht „geschätzt“ daran.</li></ul>'
    /* Steht hier auch ohne Warnung: von den vier Groessen ist der Schlaf der
       einzige, den er selbst stellen kann — und der Satz nennt als einziger
       eine Handlung statt einer Zahl. Nur in der Warnung waere er genau dann
       unsichtbar, wenn noch nichts passiert ist. */
    + '<div class="ghd">Der eine Hebel</div><ul class="glist"><li>'+esc(SATZ_18)+'</li></ul>'
    + '<div class="gsrc">Grün ab '+ERH_GRUEN+' wie beim Band, rot ab '+ERH_ROT+' abwärts — '
    + 'die Grenze mit der besten Trefferquote aus deinen eigenen Nächten.</div>'
    + '<button class="btn" data-a="formask">Tagesform ausfüllen</button>'
    + '<button class="btn ghost" data-a="schlafsheet">Schlaf im Einzelnen</button>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

/* Wenn oben "—" steht: was da ist, was fehlt, und was zu tun ist. Dazu die
   rohen Zahlen, wie sie aus Health kamen. Ohne die laesst sich von aussen
   nicht unterscheiden, ob die App falsch rechnet oder Health falsch liefert —
   und dann raet man an einem Fehler herum, statt ihn zu sehen. */
/* Entscheidet, welches der beiden Blaetter passt: gibt es wenigstens die
   Ersatzampel, gehoert die erklaert — sonst nur, warum nichts dasteht. */
function erhErsatzSheet(h){
  const ers = erholungErsatz();
  if (!ers) { erhLeerSheet(h); return; }
  /* Die Spanne statt einer Zahl: sie sagt dasselbe, ohne eine Genauigkeit
     zu behaupten, die es nicht gibt. Plus/minus eine Standardabweichung des
     Modellfehlers — zwei von drei Naechten liegen darin. */
  const halb = 12;
  const von = Math.max(1, ers.intern - halb), bis = Math.min(99, ers.intern + halb);
  openSheet('<h3>'+esc(ers.wort)+' <span class="ftag">geschätzt</span></h3>'
    + '<div class="sh-sub">Etwa '+von+' bis '+bis+' — eine Spanne, keine Zahl. '
    + 'Genauer geht es mit den Werten, die dein Band liefert, nicht.</div>'
    + (h ? healthBox(h) : "")
    + '<div class="ghd">Warum hier keine Zahl steht</div><ul class="glist">'
    + '<li>Ohne HRV rechnet die App aus Ruhepuls und Schlaf. Das trifft die '
    + 'Richtung zuverlässig, aber nicht den Punkt — dafür ist der Fehler zu '
    + 'groß im Verhältnis zur Skala.</li>'
    + '<li>Eine angezeigte „68“ hieße dann real „irgendwo zwischen 56 und 80“. '
    + 'Das wäre erfundene Genauigkeit — die Ampel ist ehrlicher.</li></ul>'
    + '<div class="ghd">Was die Einordnung trotzdem kann</div><ul class="glist">'
    + '<li>Sie trifft meistens dieselbe Ampelstufe wie dein Band — mit HRV wäre '
    + 'sie noch etwas treffsicherer.</li>'
    + '<li>Über deinen ganzen Verlauf stand sie <b>kein einziges Mal auf Grün, wenn '
    + 'dein Band Rot sagte</b>. Wenn sie warnt, ist etwas dran.</li></ul>'
    /* Der Weg zur richtigen Zahl gehoert prominent hierhin: es ist ein
       Schalter, keine Grenze der App. */
    + '<div class="ghd">Warum keine HRV</div><ul class="glist">'
    + '<li>Whoop gibt sie nicht an Apple Health weiter. Schlaf, Ruhepuls und '
    + 'Atmung schon — die HRV nicht. Daran lässt sich nichts einstellen.</li>'
    + '<li>Der einzige Weg zur vollen Genauigkeit wäre ein Export aus Whoop '
    + 'von Hand. Für einen Wert je Nacht steht das in keinem Verhältnis.</li></ul>'
    + (h && h.diag
        ? '<div class="ghd">Was in Health gespeichert ist</div><ul class="glist">'
          + [["hrv","HRV"],["puls","Ruhepuls"]].map(p => {
              const d = h.diag[p[0]] || {}, n = d.anzahl || 0;
              const q = (d.quellen || []).join(", ");
              return '<li><b>'+p[1]+'</b> '
                + (n ? n + ' Messungen in 30 Tagen' + (q ? ' · aus ' + esc(q) : '')
                     : '<span class="hdown">keine einzige Messung in 30 Tagen</span>')
                + '</li>';
            }).join("") + '</ul>'
        : '')
    + '<div class="gsrc">Auf dieselben Nächte gerechnet wie das volle Modell. Den '
    + 'Unterschied holt kein Ersatz zurück.</div>'
    + (typeof window !== "undefined" && window.__training_openHealth
        ? '<button class="btn" data-a="healthapp">Health öffnen</button>' : '')
    + '<button class="btn ghost" data-a="healthask">Aus Apple Health neu lesen</button>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

function erhLeerSheet(h){
  /* `zeigen` erlaubt eine zweite Schreibweise desselben Werts. Beim Schlaf
     braucht es die: Health liefert Minuten, auf der Startseite stehen
     Stunden — und wer prueft, ob eine Zahl stimmt, will beide sehen. */
  const zeile = (titel, wert, basis, einheit, zeigen) => {
    const w = v => (v == null ? null : (zeigen ? zeigen(v) + ' (' + kg(v) + (einheit||'') + ')'
                                               : kg(v) + (einheit || '')));
    return '<li><b>'+titel+'</b> '
      + (wert == null ? '<span class="hdown">fehlt</span>' : w(wert))
      + ' · Grundlinie '
      + (basis == null ? '<span class="hdown">fehlt noch</span>' : w(basis))
      + '</li>';
  };
  const naechte = healthNaechte(90);
  openSheet('<h3>Noch keine Schätzung</h3>'
    + '<div class="sh-sub">'+esc(erhFehlgrund(h))+'</div>'
    + (h
        ? '<div class="ghd">Was aus Health ankommt</div><ul class="glist">'
          + zeile("Schlaf", h.schlaf == null ? null : Math.round(h.schlaf),
                  h.schlafBasis == null ? null : Math.round(h.schlafBasis), " min", hDur)
          + zeile("HRV", h.hrv, h.hrvBasis, " ms")
          + zeile("Ruhepuls", h.puls, h.pulsBasis, "")
          + zeile("Atmung", h.atem, h.atemBasis, "")
          + '<li><b>Nacht</b> '+esc(h.nacht || "ohne Datum")
          + (h.quelle ? ' · aus '+esc(h.quelle) : '') + '</li>'
          + '<li><b>Nächte im Verlauf</b> '+naechte.length+'</li></ul>'
        : '')
    /* Was HealthKit wirklich vorliegen hat. Ohne diese Zahlen laesst sich
       "nicht freigegeben" nicht von "niemand schreibt es" unterscheiden —
       beides kommt oben als fehlender Wert an. */
    + (h && h.diag
        ? '<div class="ghd">Was in Health gespeichert ist</div><ul class="glist">'
          + [["hrv","HRV"],["puls","Ruhepuls"],["atem","Atmung"]].map(p => {
              const d = h.diag[p[0]] || {};
              const n = d.anzahl || 0;
              const q = (d.quellen || []).join(", ");
              return '<li><b>'+p[1]+'</b> '
                + (n ? n + ' Messungen in 30 Tagen' + (q ? ' · aus ' + esc(q) : '')
                     : '<span class="hdown">keine einzige Messung in 30 Tagen</span>')
                + '</li>';
            }).join("")
          + '</ul>'
          + '<div class="hnote" style="margin:0 0 4px">'
          + (((h.diag.hrv || {}).anzahl || 0) === 0 && ((h.diag.puls || {}).anzahl || 0) > 0
              ? 'Ruhepuls kommt an, HRV nicht — in Health liegt für die HRV also '
                + 'nichts, was diese App lesen dürfte. Entweder schreibt Whoop sie '
                + 'nicht hinein, oder die Freigabe dafür wurde nie erteilt. '
                + '„Neu lesen" fragt sie erneut an.'
              : 'Steht hier überall eine Zahl, liegt es nicht an Health.')
          + '</div>'
        : '')
    + '<div class="ghd">Was das Modell braucht</div><ul class="glist">'
    + '<li>HRV und Schlaf, jeweils <b>mit</b> ihrer Grundlinie. Ruhepuls und '
    + 'Atmung machen die Schätzung genauer, sind aber nicht Bedingung.</li>'
    + '<li>Eine Grundlinie entsteht aus dem Median von sieben Nächten. Weniger '
    + 'wäre keine Grundlinie, sondern eine der Nächte — und alles, was darauf '
    + 'fußt, wäre geraten.</li></ul>'
    /* Fehlt genau ein Wert, waehrend die anderen ankommen, ist die Antwort
       immer dieselbe: ein Schalter in Health steht auf aus. Die Klickfolge
       gehoert hierhin — "prüfe die Berechtigungen" hilft niemandem. */
    + (h && h.hrv == null && (h.schlaf != null || h.puls != null)
        ? '<div class="ghd">Warum die HRV fehlt</div><ul class="glist">'
          + '<li>Whoop schreibt Schlaf, Ruhepuls und Atmung nach Apple Health, '
          + 'die <b>Herzfrequenzvariabilität aber nicht</b>. Das ist eine '
          + 'Entscheidung von Whoop und keine Einstellung — es gibt keinen '
          + 'Schalter, der das ändert.</li>'
          + '<li>Die App rechnet deshalb ohne sie. Das kostet Genauigkeit, reicht '
          + 'aber für die Einordnung.</li></ul>'
        : '')
    + '<div class="gsrc">Stimmt hier eine Zahl nicht, liegt es nicht an der '
    + 'Rechnung — dann steht sie so in Apple Health. Nachsehen unter '
    + '„Durchsuchen → Schlaf“ beziehungsweise „Herz → Herzfrequenzvariabilität“.</div>'
    + (typeof window !== "undefined" && window.__training_openHealth
        ? '<button class="btn" data-a="healthapp">Health öffnen</button>' : '')
    + '<button class="btn ghost" data-a="healthask">Aus Apple Health neu lesen</button>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

/* Schlaf als Untergrenze, nicht als Ziel. Ein Ziel von acht Stunden hat er
   fuenf Jahre lang nicht erreicht und es hat nichts geaendert. */
function schlafSheet(){
  const sg = schlafGrenze();
  const naechte = healthNaechte(7).filter(n => n.schlaf != null);
  openSheet('<h3>'+esc(sg ? sg.text : "Schlaf")+'</h3>'
    + '<div class="sh-sub">'+esc(sg ? sg.detail
        : "Deine letzten Nächte liegen über der Untergrenze. Es gibt nichts zu melden.")+'</div>'
    + (naechte.length
        ? '<div class="ghd">Die letzten '+naechte.length+' Nächte</div><ul class="glist">'
          + naechte.map(n => '<li>'+esc(dateShort(n.nacht))+' · '+hDur(n.schlaf)
              + (n.schlaf < SCHLAF_UNTER ? ' <span class="hdown">unter sechs Stunden</span>'
                 : n.schlaf < SCHLAF_KURZ ? ' <span class="hdown">kurz</span>' : '')
              + '</li>').join("") + '</ul>'
        : '')
    + '<div class="ghd">Der eine Hebel</div><ul class="glist"><li>'+esc(SATZ_18)+'</li></ul>'
    + '<div class="ghd">Warum eine Grenze und kein Ziel</div><ul class="glist">'
    + '<li>Eine gute Stunde unter deinem eigenen Schnitt kostet dich ein <b>Vielfaches</b> '
    + 'dessen, was eine halbe Stunde kostet — der Einbruch kommt spät und dann steil.</li>'
    + '<li>Knapp die Hälfte deiner Nächte liegt <b>unter sieben Stunden</b>. Ein Ziel '
    + 'zehn davon unter sechs. Ein Ziel hätte daran nichts geändert; es war fünf Jahre da.</li>'
    + '<li><b>Wann du ins Bett gehst, ist an sich egal.</b> Es zählt nur, wie viel '
    + 'Schlaf dabei herauskommt — und das entscheidet der Zeitpunkt indirekt.</li></ul>'
    + '<div class="gsrc">Aus deinem eigenen Whoop-Verlauf gerechnet.</div>'
    + '<button class="btn ghost" data-a="sheetclose">Schließen</button>', {});
}

/* ---- Boxen: nur Dauer und Intensitaet ---- */

    + BOX_DUR.map(n => '<button class="chip'+(st.minutes===n?" on":"")+'" data-a="boxdur" data-d="'+n+'">'+n+' min</button>').join("")
    + '</div></div>'
    + '<div class="frow"><div class="fq">Wie intensiv war es?</div><div class="fopts">'

}
